<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="En Jeux">
<title>En Jeux — votre maître du jeu de poche</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#059669">
<meta name="description" content="En Jeux : trois jeux dans votre poche — scores, duel de temps et quiz animé. En famille, entre amis, en voiture.">
<style>
  :root{
    --bg:#f5f5f4; --card:#fff; --line:#e7e5e4; --ink:#1c1917; --mut:#78716c; --soft:#a8a29e;
    --gr:#059669; --gr-l:#ecfdf5; --gr-b:#a7f3d0; --am:#f59e0b; --am-l:#fffbeb; --ro:#e11d48; --ro-l:#fff1f2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:10px 8px;display:flex;align-items:center;gap:6px;
    padding-top:calc(10px + env(safe-area-inset-top))}
  header h1{font-size:17px;margin:0;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .sub{font-size:11px;color:var(--soft);font-weight:400;display:block;margin-top:1px}
  main{flex:1;padding:16px 16px 110px}
  .icobtn{background:none;border:0;font-size:22px;padding:6px 10px;color:var(--mut);cursor:pointer;line-height:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:12px}
  .card h2{font-size:13px;margin:0 0 8px;color:var(--mut);font-weight:600}
  .hero{border-radius:20px;padding:22px 18px;margin-bottom:16px;color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#065f46 0%,#059669 55%,#34d399 130%)}
  .hero h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
  .hero p{margin:4px 0 0;font-size:13.5px;opacity:.92}
  .hero .dice{position:absolute;right:10px;top:6px;font-size:64px;opacity:.22;transform:rotate(12deg)}
  .hero .pills{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;position:relative;z-index:1}
  .hero .pills span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:3px 11px;font-size:11.5px;font-weight:600;backdrop-filter:blur(2px)}
  .trust{display:flex;gap:6px;margin:-6px 0 16px}
  .trust span{flex:1;text-align:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 4px;font-size:11.5px;font-weight:600;color:var(--mut);box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .trust b{display:block;font-size:16px;margin-bottom:1px}
  .tool .wm{position:absolute;right:-8px;bottom:-18px;font-size:84px;opacity:.07;transform:rotate(-10deg);pointer-events:none;z-index:0}
  .tool .tag{display:inline-block;margin:5px 0 1px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 9px;border-radius:99px}
  .tool.t-coupe .tag{background:#d1fae5;color:#047857}
  .tool.t-tictac .tag{background:#fef3c7;color:#b45309}
  .tool.t-micro .tag{background:#ede9fe;color:#6d28d9}
  .miniact{flex:1;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer;font-family:inherit;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .miniact .e{font-size:22px;flex-shrink:0}
  .miniact b{display:block;font-size:13.5px;color:var(--ink)}
  .miniact small{display:block;font-size:11px;color:var(--mut);margin-top:1px}
  /* retour visuel immédiat au toucher : plus aucune impression de « ça ne réagit pas » */
  button{transition:transform .06s ease, opacity .06s ease}
  .btn:active,.sm:active,.tool:active,.miniact:active,.chip:active,.icobtn:active,.navbar button:active,nav button:active{transform:scale(.96);opacity:.85}
  .updbar{position:fixed;left:12px;right:12px;bottom:16px;z-index:9999;background:#1c1917;color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.28);animation:updin .25s ease}
  .updbar span{flex:1;font-size:13.5px;font-weight:600}
  .updbar button{background:#059669;color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:700;font-family:inherit;cursor:pointer;font-size:13px}
  @keyframes updin{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .whowheel{font-size:56px;text-align:center;padding:8px 0}
  .whoname{font-size:30px;font-weight:800;text-align:center;letter-spacing:-.02em}
  .tool{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;margin-bottom:12px;
    border-radius:18px;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;position:relative;overflow:hidden}
  .tool .em{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;background:#f5f5f4;flex-shrink:0;color:#fff}
  .tool.t-coupe{border-color:#a7f3d0;background:linear-gradient(135deg,#ecfdf5,#d1fae5)}
  .tool.t-coupe .em{background:linear-gradient(135deg,#059669,#34d399)}
  .tool.t-tictac{border-color:#fde68a;background:linear-gradient(135deg,#fffbeb,#fef3c7)}
  .tool.t-tictac .em{background:linear-gradient(135deg,#d97706,#fbbf24)}
  .tool.t-micro{border-color:#ddd6fe;background:linear-gradient(135deg,#f5f3ff,#ede9fe)}
  .tool.t-micro .em{background:linear-gradient(135deg,#7c3aed,#a78bfa)}
  .tool.on{border-color:var(--gr-b);background:var(--gr-l)}
  .tool.on .em{background:var(--gr)}
  @keyframes fall{0%{transform:translateY(-30px) rotate(0)}100%{transform:translateY(320px) rotate(340deg);opacity:0}}
  .confetti span{position:absolute;top:0;font-size:22px;animation:fall 2.6s linear infinite}
  .medal{font-size:17px;margin-right:2px}
  .av{display:inline-flex;align-items:center;justify-content:center;border-radius:99px;flex-shrink:0;
    width:34px;height:34px;font-size:19px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .av.big{width:64px;height:64px;font-size:36px;border-width:3px}
  .av.sm{width:26px;height:26px;font-size:15px}
  .avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .avgrid button{border:2px solid transparent;background:#fff;border-radius:14px;font-size:26px;padding:8px 0;cursor:pointer}
  .avgrid button.on{border-color:var(--gr);background:var(--gr-l)}
  .charena{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .chp{width:76px;text-align:center;cursor:pointer;border-radius:14px;padding:6px 2px;transition:transform .15s}
  .chp b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
  .chp small{font-variant-numeric:tabular-nums;font-weight:700;font-size:12px}
  .chp .ring{position:relative;width:64px;height:64px;margin:0 auto}
  .chp .ring svg{width:64px;height:64px}
  .chp .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px}
  .chp.live{background:var(--gr-l);transform:scale(1.06)}
  .chp.live .face{animation:pulse 1.2s ease-in-out infinite}
  .chp.ko{opacity:.45;filter:grayscale(1)}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .tool b{font-size:16px;display:block}
  .tool small{color:var(--mut);font-size:13px;display:block;margin-top:2px;line-height:1.35}
  .tag{display:inline-block;background:#e7e5e4;color:var(--mut);border-radius:99px;padding:2px 8px;font-size:10px;font-weight:700;text-transform:uppercase;margin-left:6px;vertical-align:middle}
  button.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:var(--gr);color:#fff;cursor:pointer;font-family:inherit}
  button.btn.dark{background:#292524}button.btn.grey{background:#e7e5e4;color:#44403c}
  button.btn.red{background:var(--ro)}
  button.sm{border:0;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;background:#e7e5e4;color:#44403c}
  button.sm.g{background:var(--gr);color:#fff}button.sm.r{background:var(--ro);color:#fff}
  input,textarea{font-family:inherit;font-size:16px;border:1px solid #d6d3d1;border-radius:12px;padding:10px;width:100%;background:#fff}
  input:focus,textarea:focus{outline:2px solid var(--gr);outline-offset:-1px}
  .row{display:flex;gap:8px;align-items:center}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .chip{border:1px solid var(--line);background:#fff;color:var(--mut);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;font-family:inherit}
  .chip.on{background:var(--gr);color:#fff;border-color:var(--gr)}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom)}
  nav .in{max-width:520px;margin:0 auto;display:flex}
  nav button{flex:1;background:none;border:0;padding:9px 0 7px;font-size:11px;color:var(--soft);cursor:pointer;font-family:inherit;font-weight:600}
  nav button .i{display:block;font-size:20px;margin-bottom:2px}
  nav button.on{color:var(--gr)}
  .navbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .navbar .in{max-width:520px;margin:0 auto}
  .rank{display:flex;align-items:center;gap:12px;border-radius:12px;padding:10px;background:#fafaf9;margin-bottom:5px}
  .rank.lead{background:var(--gr-l)}
  .rank .pos{width:28px;height:28px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:#fff;border:1px solid var(--line);color:var(--soft);flex-shrink:0}
  .rank.first .pos{background:var(--gr);color:#fff;border-color:var(--gr)}
  .rank .nm{flex:1;min-width:0}
  .rank .nm b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank .nm small{color:var(--soft);font-size:11px}
  .rank .pts{text-align:right;font-variant-numeric:tabular-nums}
  .rank .pts b{font-size:19px;display:block}
  .rank .pts small{font-size:9px;text-transform:uppercase;color:var(--soft);letter-spacing:.03em}
  .champ{border-radius:16px;padding:12px;border:1px solid}
  .champ.g{background:var(--gr-l);border-color:var(--gr-b)}
  .champ.a{background:var(--am-l);border-color:#fde68a}
  .champ .l{font-size:11px;font-weight:700;text-transform:uppercase}
  .champ.g .l{color:#047857}.champ.a .l{color:#b45309}
  .champ .v{font-size:18px;font-weight:800;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .champ .s{font-size:13px;font-variant-numeric:tabular-nums}
  .champ.g .v,.champ.g .s{color:#064e3b}.champ.a .v,.champ.a .s{color:#78350f}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .plr{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px;margin-bottom:9px}
  .plr.win{border-color:var(--gr-b);background:var(--gr-l)}
  .plr .n{flex:1;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:4px}
  .plr .stp{width:42px;height:42px;border-radius:12px;border:0;font-size:20px;background:#f5f5f4;color:var(--mut);cursor:pointer;flex-shrink:0}
  .plr .stp.p{background:var(--gr-l);color:var(--gr)}
  .plr input{width:64px;text-align:center;font-size:20px;font-weight:700;padding:8px 2px;font-variant-numeric:tabular-nums}
  .empty{text-align:center;padding:48px 16px}
  .empty .e{font-size:40px}.empty h3{margin:10px 0 4px;font-size:17px}
  .empty p{color:var(--mut);font-size:14px;margin:0 0 16px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#1c1917;color:#fff;
    padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:60;max-width:90%;text-align:center}
  .warn{background:var(--ro-l);border:1px solid #fecdd3;color:#9f1239;border-radius:12px;padding:10px;font-size:12.5px;line-height:1.4;margin-bottom:12px}
  .ok{background:var(--gr-l);border:1px solid var(--gr-b);color:#065f46;border-radius:12px;padding:10px;font-size:12.5px;line-height:1.4;margin-bottom:12px}
  ul.lst{list-style:none;padding:0;margin:0}
  ul.lst li{display:flex;gap:8px;align-items:flex-start;background:#fafaf9;border-radius:10px;padding:8px 10px;margin-bottom:5px;font-size:14px}
  .hist{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:9px}
  .hist .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .hist .dt{font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums}
  .hist .w{background:var(--am-l);color:#b45309;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:600}
  .hist .sc{margin-top:7px;font-size:13px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 14px;font-variant-numeric:tabular-nums}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;display:flex;align-items:flex-end}
  .sheet .in{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;padding:16px;
    max-height:92vh;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .grab{width:40px;height:5px;background:#d6d3d1;border-radius:99px;margin:0 auto 12px}
  label.lb{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--soft);display:block;margin:0 0 5px}
  .mini{font-size:12px;color:var(--soft);line-height:1.45}
  /* ---- Export PDF (impression) ---- */
  #pdf{display:none}
  @media print{
    body{background:#fff}
    header,#nav,#app,.sheet,.toast{display:none !important}
    #pdf{display:block !important;padding:0;color:#1c1917;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
    .pdf-h{background:linear-gradient(135deg,#065f46,#34d399);color:#fff;padding:22px 20px;border-radius:14px;margin-bottom:16px}
    .pdf-h h1{margin:0;font-size:26px} .pdf-h p{margin:4px 0 0;opacity:.9;font-size:13px}
    .pdf-sec{margin-bottom:18px;break-inside:avoid}
    .pdf-sec h2{font-size:15px;border-bottom:2px solid #059669;padding-bottom:4px;margin:0 0 8px;color:#065f46}
    table{width:100%;border-collapse:collapse;font-size:12.5px}
    th{text-align:left;color:#78716c;font-weight:600;padding:6px 8px;border-bottom:1px solid #e7e5e4;font-size:11px;text-transform:uppercase}
    td{padding:6px 8px;border-bottom:1px solid #f0efee}
    tr:nth-child(even) td{background:#fafaf9}
    .pdf-top td{font-weight:800;color:#065f46}
    .pdf-medal{font-size:15px}
    .pdf-foot{margin-top:20px;text-align:center;color:#a8a29e;font-size:10px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header id="hd"></header>
  <main id="app"></main>
  <div id="nav"></div>
  <div id="pdf"></div>
</div>
<script>
/* ============================ STOCKAGE ============================
   Sur un vrai fichier ouvert dans Safari, localStorage persiste.
   Règle de sûreté : on n'écrit JAMAIS avant une lecture réussie,
   pour qu'un incident de lecture ne puisse pas effacer l'historique. */
var KEY='jeux-famille-v1', canSave=false, saveMsg='';
function loadStore(){
  try{
    var probe='__t'+Date.now();
    localStorage.setItem(probe,'1'); localStorage.removeItem(probe); // le stockage répond
    canSave=true;
    var v=localStorage.getItem(KEY);
    if(v) return JSON.parse(v);
    return null;
  }catch(e){ canSave=false; saveMsg=e.message||'indisponible'; return null; }
}
function persist(){
  if(!canSave) return;
  try{ localStorage.setItem(KEY, JSON.stringify(D)); }
  catch(e){ canSave=false; saveMsg='écriture refusée'; render(); }
}

/* ============================= UTILS ============================== */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function today(){var d=new Date(),p=function(n){return(n<10?'0':'')+n;};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
var APP_VERSION='19';
function fr(d){return d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'';}
function nf(n){return (Math.round(n*100)/100).toLocaleString('fr-FR');}
function pl(n,w){return n+' '+w+(n>1?'s':'');}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fp(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}

var AV_POOL=['🦁','🐯','🦊','🐼','🐨','🐸','🐙','🦄','🐵','🐷','🦖','🦉','🐺','🐳','🐝','🦋','🤖','👽','🧙‍♂️','🦸‍♀️','🥷','🧜‍♀️','🐲','🦩','👹','👺','🤡','👻','🎃','😈','🤠','🥸','💀','🧛','🧟','🎭'];
var AV_BG=['#fee2e2','#ffedd5','#fef9c3','#dcfce7','#d1fae5','#cffafe','#dbeafe','#e0e7ff','#ede9fe','#fae8ff','#fce7f3','#f5f5f4'];
function hashN(s){var x=0,f=fp(s);for(var i=0;i<f.length;i++)x=(x*31+f.charCodeAt(i))>>>0;return x;}
function avFor(name){
  var k=fp(name);
  for(var i=0;i<D.lib.length;i++) if(fp(D.lib[i].name)===k && D.lib[i].emoji) return D.lib[i].emoji;
  return AV_POOL[hashN(name)%AV_POOL.length];
}
function avBg(name){return AV_BG[hashN(name)%AV_BG.length];}
function avPhotoOf(name){
  var k=fp(name);
  for(var i=0;i<D.lib.length;i++) if(fp(D.lib[i].name)===k && D.lib[i].photo) return D.lib[i].photo;
  return null;
}
function av(name,cls){
  var ph=avPhotoOf(name);
  if(ph) return '<span class="av '+(cls||'')+'" style="background-image:url('+ph+');background-size:cover;background-position:center"></span>';
  return '<span class="av '+(cls||'')+'" style="background:'+avBg(name)+'">'+avFor(name)+'</span>';
}

var DEF=['Patrick','Mélanie','Mattéo','Maxime'];
function fresh(){return {v:1, lib:DEF.map(function(n){return{id:uid(),name:n};}), matches:[], journal:[], micro:[], tictac:[]};}

var D=loadStore()||fresh();
if(!D.lib)D.lib=[]; if(!D.matches)D.matches=[]; if(!D.journal)D.journal=[]; if(!D.micro)D.micro=[]; if(!D.tictac)D.tictac=[];
if(!D.onboarded && (D.matches.length||D.journal.length||D.micro.length||D.tictac.length)) D.onboarded=1;

/* ========================== LOGIQUE SCORE ========================= */
function winners(r,roster,rule){
  var ids=roster.map(function(p){return p.id;}),e=[];
  for(var k in r.scores){ if(ids.indexOf(k)>=0 && r.scores[k]!==null && !isNaN(r.scores[k])) e.push([k,r.scores[k]]); }
  if(!e.length) return [];
  var vals=e.map(function(x){return x[1];});
  var best=rule==='low'?Math.min.apply(null,vals):Math.max.apply(null,vals);
  return e.filter(function(x){return x[1]===best;}).map(function(x){return x[0];});
}
function rank(m,keep){
  keep=keep||function(){return true;};
  var rounds=m.rounds.filter(keep), s={};
  m.players.forEach(function(p){s[p.id]={id:p.id,name:p.name,points:0,played:0,wins:0};});
  rounds.forEach(function(r){
    var w=winners(r,m.players,m.winRule);
    for(var k in r.scores){ if(s[k]&&r.scores[k]!==null&&!isNaN(r.scores[k])){s[k].points+=r.scores[k];s[k].played++;} }
    w.forEach(function(k){ if(s[k]) s[k].wins++; });
  });
  var list=[]; for(var k in s) list.push(s[k]);
  var low=m.winRule==='low';
  var byCumul=list.slice().sort(function(a,b){return low?(a.points-b.points||b.wins-a.wins):(b.points-a.points||b.wins-a.wins);});
  var byWins=list.slice().sort(function(a,b){return b.wins-a.wins||(low?a.points-b.points:b.points-a.points);});
  return {byCumul:byCumul,byWins:byWins,count:rounds.length};
}
function leaders(sorted,key,rule){
  var played=sorted.filter(function(p){return p.played>0;});
  if(!played.length) return [];
  if(key==='wins'){ var bw=Math.max.apply(null,played.map(function(p){return p.wins;}));
    if(bw<=0) return []; return played.filter(function(p){return p.wins===bw;}).map(function(p){return p.id;}); }
  var vals=played.map(function(p){return p.points;});
  var b=rule==='low'?Math.min.apply(null,vals):Math.max.apply(null,vals);
  return played.filter(function(p){return p.points===b;}).map(function(p){return p.id;});
}

function share(){
  var m=cur(),r=rank(m,keeper()),lp=leaders(r.byCumul,'points',m.winRule),lw=leaders(r.byWins,'wins',m.winRule);
  var med=['🥇','🥈','🥉'];
  var lab={all:'',month:'ce mois-ci',year:'cette année',custom:'période choisie'}[S.period];
  var t='🏆 '+m.name+'\n'+pl(r.count,'manche')+(lab?' · '+lab:'')+(m.winRule==='low'?' · le moins de points gagne':'')+'\n\n';
  r.byCumul.forEach(function(p,i){t+=(med[i]||'   ')+' '+p.name+' — '+nf(p.points)+' pts · '+pl(p.wins,'victoire')+'\n';});
  var nmOf=function(l,ids){return l.filter(function(p){return ids.indexOf(p.id)>=0;}).map(function(p){return p.name;}).join(' & ');};
  t+='\n';
  if(lp.length) t+='Meilleur cumul : '+nmOf(r.byCumul,lp)+'\n';
  if(lw.length && nmOf(r.byWins,lw)!==nmOf(r.byCumul,lp)) t+='Plus de victoires : '+nmOf(r.byWins,lw)+'\n';
  if(navigator.share){ navigator.share({text:t}).catch(function(){}); return; }
  copy(t,'Résultats copiés — colle-les dans WhatsApp');
}
function copy(t,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast(msg);},function(){fallbackCopy(t,msg);});}
  else fallbackCopy(t,msg);
}
function fallbackCopy(t,msg){
  var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);
  a.select();a.setSelectionRange(0,999999);try{document.execCommand('copy');toast(msg);}catch(e){toast('Copie impossible');}a.remove();
}

var MICRO_PROMPT="Tu es l'animateur d'un quiz oral de culture générale dynamique, exigeant, fluide et compétitif. Le jeu est inspiré de l'esprit des grands jeux télévisés français, du Trivial Pursuit et de TTMC, sans copier leurs questions ni imiter une personnalité réelle. Ton rôle est d'animer, pas de montrer que tu connais les réponses. Tu dois : poser ; écouter ; arbitrer ; compter ; adapter ; relancer. Le jeu doit paraître naturel, rapide et vivant.\n\n1. DÉMARRAGE\nQuand je dis « On fait un quiz », réponds uniquement : « Qui joue ? ». Ne suppose jamais les joueurs. Une fois les prénoms donnés : conserve leur ordre exact ; mets tous les scores à zéro ; objectif par défaut 15 points ; niveau initial élevé ; commence immédiatement avec le premier joueur cité. Respecte strictement la rotation jusqu'à la fin. Ne demande jamais « C'est à qui ? ». Après le dernier joueur, reviens automatiquement au premier.\n\n2. RÈGLES NON NÉGOCIABLES (prioritaires sur tout le reste)\nNe donne jamais la réponse avant le joueur. Dès qu'un joueur commence clairement à répondre, arrête immédiatement de parler et écoute. Ne parle jamais par-dessus sa réponse. Ne valide jamais la réponse d'une autre personne à la place du joueur concerné. Respecte toujours l'ordre des joueurs. Tiens le score avec rigueur. Ne repose jamais la même question ni le même fait sous une autre formulation. Ne souffle jamais d'indice involontaire. Si une question est ambiguë, déjà posée, mal attribuée ou révélée par erreur, annule-la et remplace-la sans modifier le score. Avant chaque question, vérifie silencieusement : bon joueur -> score -> niveau -> variété -> absence de doublon -> mécanique éventuelle. Ne verbalise jamais ces contrôles.\n\n3. BARÈME CLASSIQUE\nBonne réponse complète avant le début des propositions : 2 points. Bonne réponse pendant ou après les propositions : 1 point. Mauvaise réponse : 0. Dès que tu commences à prononcer la proposition A, la réponse vaut au maximum 1 point. Règle stricte et identique pour tous.\n\n4. RÉPONSE OFFICIELLE\nLa première réponse clairement présentée comme définitive par le joueur concerné est sa réponse officielle. Une réflexion à voix haute n'est pas forcément définitive (« Je pense B… attends… » n'est pas officiel ; « Je choisis B. » l'est). Si ce n'est pas clair, demande seulement « Ta réponse officielle ? » sans indice. Une réponse officielle fausse ne peut pas être remplacée après une réaction des autres, une réponse soufflée, un indice, la correction ou une seconde tentative opportuniste.\n\n5. FORMAT DES QUESTIONS\nFormat : « Paul, astronomie. Quelle planète possède Triton comme principal satellite ? ». Laisse une courte possibilité de réponse spontanée. Sans réponse immédiate, propose « A. … B. … C. … D. … » puis silence. Les mauvaises propositions doivent être crédibles. À niveau élevé, évite les QCM avec une seule réponse sérieuse et trois absurdes.\n\n6. DIFFICULTÉ\nÉchelle mentale souple 1 à 8 (1 très accessible … 8 très expert mais jouable). Commence autour de 5. Adapte chaque joueur individuellement : un niveau global et un niveau par grand domaine (ex. fort en histoire, moyen en sciences). Monte si le joueur répond facilement, vite, ou avant les propositions. Baisse légèrement si plusieurs questions sont hors de portée. Ne sur-réagis jamais à une seule réponse. Vise une difficulté où il réussit régulièrement mais pas systématiquement. Un excellent joueur peut monter à 7 ou 8. Ne te base pas sur l'âge, uniquement sur les performances.\n\n7. VARIÉTÉ (façon Trivial Pursuit)\nVarie largement : histoire, géographie, sciences, physique, chimie, biologie, nature, astronomie, littérature, philosophie, arts, peinture, architecture, cinéma, séries, musique, sport, langue française, inventions, technologie, mythologie, gastronomie, société, culture populaire, logique, énigmes, estimation, culture mondiale. Répartis équitablement, ne donne pas toujours le même thème au même joueur. Varie aussi le fait d'annoncer ou non la catégorie.\n\n8. ANTI-DOUBLON ABSOLU\nNe répète jamais la même question, une reformulation très proche, ni le même fait sous un autre angle presque identique (ex. « unité de l'intensité électrique » = « en quelle unité mesure-t-on le courant » : même fait). Considère comme historique les questions déjà posées dans toute la partie et, quand tu peux les identifier, celles déjà posées plus tôt dans la conversation. Planifie silencieusement plusieurs questions d'avance pour éviter les répétitions, équilibrer les thèmes, anticiper la difficulté et garder de la variété.\n\n9. QUALITÉ DES QUESTIONS\nPrivilégie faits solides, réponses claires, questions faciles à comprendre oralement, connaissances intéressantes, pièges intelligents non artificiels. Évite les réponses dépendant d'une définition contestée, d'un classement incertain, d'une mesure variable ou d'une convention non précisée. Si plusieurs réponses se défendent, choisis une autre question. Actualité rare ; si une réponse évolue dans le temps, précise l'année.\n\n10. TOURS DÉFI (façon TTMC)\nDe temps en temps : « Tour Défi. Ton thème : histoire. Tu te mets combien entre 1 et 5 ? ». Le joueur choisit son niveau (1 accessible … 5 très difficile), la question doit vraiment correspondre. Bonne réponse : points = niveau choisi. Mauvaise : 0, pas de négatif. Pendant un Tour Défi, pas de bonus de rapidité. Jamais deux Tours Défi consécutifs. Répartis-les équitablement.\n\n11. AUTRES MÉCANIQUES SPÉCIALES (occasionnelles, imprévisibles, sans prendre le dessus ; après chacune, reprends la rotation normale)\nCASH : un seul par joueur et par partie ; avant les propositions il dit « Cash », tu te tais ; bonne réponse 3 points, mauvaise 0 ; consommé après usage.\nQUESTION AVEC VOL : tu annonces « Question avec vol » ; si le joueur principal se trompe, un autre peut tenter (1 point) ; à plus de deux joueurs, le premier à se manifester APRÈS l'ouverture du vol obtient la tentative ; ne valide jamais une réponse criée avant l'ouverture.\nQUESTION MYSTÈRE : pas de catégorie annoncée, barème classique.\nESTIMATION : date, distance, quantité, durée, population, ordre de grandeur ; à plusieurs, le plus proche gagne 1 point.\nDUEL : quand les scores sont proches, même thème, questions différentes de difficulté comparable, chaque bonne réponse 1 point ; puis rotation normale.\nQUITTE OU DOUBLE : très rare, proposé à un joueur nettement derrière, il risque 1 point ; bonne réponse +2, mauvaise -1 ; jamais si son score est à zéro.\n\n12. LOGIQUE\nIntègre régulièrement mais varie fortement (pas que des suites numériques) : déduction, analogies, logique verbale, conditionnelle, probabilités simples, problèmes courts, raisonnement spatial descriptible, classement logique, estimation raisonnée, énigmes courtes. Tout doit se comprendre sans papier.\n\n13. ORAL ET BRUIT\nLe jeu peut se dérouler en voiture, à table, avec du bruit, plusieurs personnes parlant en même temps. Ne prends pas automatiquement un mot entendu pour une réponse. Distingue réponse officielle, réflexion, plaisanterie, conversation parasite, réponse soufflée, réponse d'un autre. Si tu ne sais pas qui a parlé, ne devine pas : demande « Ta réponse officielle ? ». N'identifie pas les joueurs à la voix si ce n'est pas fiable.\n\n14. CORRECTION\nBonne réponse classique : « Oui. Un point. ». Avant propositions : « Oui. Deux points, réponse directe. ». Mauvaise : « Non, c'était X. ». Parfois une seule phrase de culture générale en plus, puis enchaîne. Pas de mini-cours sauf si on demande une explication.\n\n15. SCORE\nMets à jour immédiatement après chaque question. Annonce régulièrement mais pas forcément à chaque réponse (toutes les 3 questions, après un gros gain, après un Tour Défi, sur demande, quand la fin approche). Format : « Score : Léa 8, Thomas 6. ». Corrige une vraie erreur une seule fois puis continue. Ne change pas un score parce qu'un joueur insiste. Aucun point de compensation arbitraire.\n\n16. ARBITRAGE\nReste stable. Reviens sur une décision seulement si tu as mal entendu, mal attribué, mal calculé, si ta question était ambiguë ou ta correction factuelle erronée. Sinon la décision reste prise.\n\n17. RYTHME\nRapide et naturel, mais rythme rapide ≠ parler par-dessus les joueurs. Le rythme concerne les transitions, corrections courtes, passage à la question suivante. Dès qu'un joueur répond : silence et écoute. Évite « On continue ? », « Vous êtes prêts ? », « Vous voulez la suivante ? ».\n\n18. STYLE\nClarté, énergie, précision, naturel, légère taquinerie. Occasionnellement : « Très propre. », « Celle-là piquait. », « Réponse éclair. », « Ça se resserre. », « Joli coup. », « Là, il y avait un piège. » — pas après chaque question, pas de caricature d'animateur télé.\n\n19. FIN DE PARTIE\nLe premier à atteindre ou dépasser l'objectif gagne. Si une mécanique à plusieurs joueurs est en cours, termine-la avant de désigner le vainqueur. Égalité : une question chacun, puis mort subite. Annonce le vainqueur et le score final. Ne lance pas de revanche automatique.\n\n20. PRINCIPE DIRECTEUR\nAvant la question : vérifie. Pendant la réponse : écoute. Après : arbitre. Puis compte et enchaîne. Rigoureux sur le fond, souple dans l'animation.\n\n21. LANCEMENT\nOrdre enregistré, scores à zéro, objectif 15, niveau initial autour de 5/8, première question classique, plusieurs questions préparées d'avance, démarrage immédiat, aucun rappel inutile des règles.";
function briefText(){
  var t=MICRO_PROMPT;
  var recent=D.journal.slice(0,120);
  if(recent.length){
    t+='\n\n--- JOURNAL ANTI-DOUBLON ---\nVoici les questions/faits déjà posés lors de nos parties précédentes. Traite-les comme historique (section 8) : ne les repose pas, même reformulés :\n\n'+
      recent.map(function(e){return '- '+e.text;}).join('\n')+'\n';
  }
  t+='\n\nOn fait un quiz';
  return t;
}
function briefShare(){ if(navigator.share){navigator.share({text:briefText()}).catch(function(){});} else briefCopy(); }
function briefCopy(){ copy(briefText(),'Lancement copié — colle-le dans Claude et passe en voix'); }
function addJournal(){
  var t=document.getElementById('jp').value;
  var lines=t.split('\n').map(function(s){return s.replace(/^\s*[-•*\d.)]+\s*/,'').trim();}).filter(Boolean);
  if(!lines.length){toast('Rien à ajouter');return;}
  var seen={};D.journal.forEach(function(e){seen[e.fp]=1;});
  var added=0;var fresh=[];
  lines.forEach(function(l){var f=fp(l);if(!f||seen[f])return;seen[f]=1;fresh.push({id:uid(),text:l,fp:f,date:today()});added++;});
  if(!added){toast('Déjà toutes au journal');return;}
  D.journal=fresh.concat(D.journal);persist();
  toast(added+' ajoutée'+(added>1?'s':'')+' · '+(lines.length-added)+' doublon(s) ignoré(s)');
  render();
}
function delJ(id){D.journal=D.journal.filter(function(e){return e.id!==id;});persist();render();}
function copyJournal(){copy(D.journal.map(function(e){return e.text;}).join('\n'),'Journal copié');}

/* ---- LE MICRO : enregistrement des résultats + palmarès ---- */
function microOpen(){ S.microSheet=true; render(); }
function microClose(){ S.microSheet=false; render(); }
function microDrawSheet(){
  var el=document.createElement('div'); el.className='sheet'; el.id='msh';
  el.innerHTML='<div class="in" onclick="event.stopPropagation()"><div class="grab"></div>'+
    '<h2 style="margin:0 0 4px;font-size:19px">Résultat d\'une partie de quiz</h2>'+
    '<p class="mini" style="margin:0 0 12px">Recopie le classement final annoncé par l\'animateur. Le 1er de la liste est le vainqueur.</p>'+
    '<label class="lb">Date</label><input type="date" id="mqd" value="'+today()+'">'+
    '<label class="lb" style="margin-top:12px">Classement final</label>'+
    '<p class="mini" style="margin:0 0 6px">Une ligne par joueur : <b>Prénom score</b> (ex. « Mattéo 15 »). L\'ordre n\'importe pas, je trie par score.</p>'+
    '<textarea id="mqr" rows="5" placeholder="Mattéo 15&#10;Patrick 12&#10;Mélanie 9"></textarea>'+
    '<div class="row" style="margin-top:14px"><button class="btn grey" onclick="microClose()">Annuler</button>'+
    '<button class="btn" onclick="microSave()">Enregistrer au palmarès</button></div></div>';
  el.onclick=microClose; document.body.appendChild(el);
}
function microSave(){
  var date=document.getElementById('mqd').value||today();
  var raw=document.getElementById('mqr').value.split('\n').map(function(s){return s.replace(/^\s*\d+[.)\-]\s*/,'').trim();}).filter(Boolean);
  if(!raw.length){toast('Recopie au moins un joueur');return;}
  var players=[];
  raw.forEach(function(line){
    var mtc=line.match(/^(.*?)[\s:.\-–]+(-?\d+(?:[.,]\d+)?)\s*(?:pts?|points?)?$/i);
    if(mtc){ players.push({name:mtc[1].trim(), score:parseFloat(mtc[2].replace(',','.'))}); }
    else { players.push({name:line.replace(/[\s:.\-–]+$/,'').trim(), score:null}); }
  });
  players=players.filter(function(p){return p.name;});
  if(!players.length){toast('Format non reconnu');return;}
  var haveScores=players.some(function(p){return p.score!==null;});
  if(haveScores) players.sort(function(a,b){return (b.score===null?-1:b.score)-(a.score===null?-1:a.score);});
  D.micro.unshift({id:uid(), date:date, players:players});
  persist(); S.microSheet=false; S.qtab='pal'; toast('Résultat enregistré 🏆'); render();
}

function microAgg(){
  var agg={};
  D.micro.forEach(function(g){
    var win=g.players[0];
    g.players.forEach(function(p){
      var k=fp(p.name); if(!k) return;
      if(!agg[k]) agg[k]={name:p.name, games:0, wins:0, best:null};
      agg[k].games++;
      if(win && fp(win.name)===k) agg[k].wins++;
      if(p.score!==null && (agg[k].best===null || p.score>agg[k].best)) agg[k].best=p.score;
    });
  });
  var list=[]; for(var k in agg) list.push(agg[k]);
  list.sort(function(a,b){return b.wins-a.wins||b.games-a.games;});
  return list;
}

/* ---- MUR DES CHAMPIONS : agrégation transverse des 3 jeux ---- */
function championsAgg(){
  var agg={};
  function slot(name){ var k=fp(name); if(!k) return null;
    if(!agg[k]) agg[k]={name:name, coupes:0, coupeManches:0, quizWins:0, quizGames:0, duels:0, duelWins:0}; return agg[k]; }
  // La Coupe : titres (champion cumul, toutes parties) + manches gagnées
  D.matches.forEach(function(m){
    var r=rank(m,function(){return true;}); if(!r.count) return;
    r.byCumul.forEach(function(p){ var s=slot(p.name); if(s) s.coupeManches+=p.wins; });
    var lead=leaders(r.byCumul,'points',m.winRule);
    m.players.forEach(function(p){ if(lead.indexOf(p.id)>=0){ var s=slot(p.name); if(s) s.coupes++; } });
  });
  // Le Micro
  D.micro.forEach(function(g){
    g.players.forEach(function(p,i){ var s=slot(p.name); if(s){ s.quizGames++; if(i===0) s.quizWins++; } });
  });
  // Tic-Tac
  D.tictac.forEach(function(d){
    d.players.forEach(function(p){ var s=slot(p.name); if(s){ s.duels++; if(d.winner&&fp(d.winner)===fp(p.name)) s.duelWins++; } });
  });
  var list=[]; for(var k in agg){ var a=agg[k]; a.crowns=a.coupes+a.quizWins+a.duelWins; list.push(a); }
  list.sort(function(a,b){return b.crowns-a.crowns || (b.coupeManches+b.quizGames+b.duels)-(a.coupeManches+a.quizGames+a.duels);});
  return list;
}

/* ============================== PALMARÈS ==========================
   Agrège toutes les parties de La Coupe. Les points de jeux différents ne
   sont pas comparables : on classe donc par TITRES (meneur d'une partie)
   puis par victoires de manches. Joueurs agrégés par nom (insensible à la
   casse et aux accents). */
var PAL={year:String(new Date().getFullYear())};
function palKeep(y){
  if(y==='all') return function(){return true;};
  if(y==='d1'||y==='d7'||y==='d30'){
    var n=y==='d1'?1:y==='d7'?7:30;
    var lim=new Date(Date.now()-(n-1)*864e5).toISOString().slice(0,10);
    return function(r){return r.date>=lim;};
  }
  return function(r){return r.date.slice(0,4)===y;};
}
function palYears(){
  var ys={};
  D.matches.forEach(function(m){m.rounds.forEach(function(r){ys[r.date.slice(0,4)]=1;});});
  return Object.keys(ys).sort().reverse();
}
function palData(year){
  var agg={};
  function slot(name){
    var k=fp(name);
    if(!agg[k]) agg[k]={name:name,titles:0,wins:0,played:0,matches:0};
    return agg[k];
  }
  if(year===undefined) year=PAL.year;
  var keep=palKeep(year);
  D.matches.forEach(function(m){
    var r=rank(m,keep);
    if(!r.count) return;
    var seen={};
    m.players.forEach(function(p){
      var st=r.byCumul.filter(function(x){return x.id===p.id;})[0];
      if(!st||!st.played) return;
      var s=slot(p.name); if(!seen[fp(p.name)]){s.matches++;seen[fp(p.name)]=1;}
      s.wins+=st.wins; s.played+=st.played;
    });
    var lead=leaders(r.byCumul,'points',m.winRule);
    m.players.forEach(function(p){ if(lead.indexOf(p.id)>=0) slot(p.name).titles++; });
  });
  var list=[]; for(var k in agg) list.push(agg[k]);
  list.sort(function(a,b){return b.titles-a.titles||b.wins-a.wins||b.played-a.played;});
  return list;
}

/* =============================== CHRONO ===========================
   Duel de temps : chaque joueur a son compte à rebours,
   en pause quand ce n'est pas son tour. Bon = il garde la main ; Faux = au
   suivant. À zéro = éliminé. L'animateur pilote. Rien n'est persisté : une
   manche de chrono est éphémère (mais les réglages, eux, sont mémorisés). */
var CH = null;              // état de la manche en cours (null = écran de config)
var chTick = null;          // intervalle
function chBeep(){
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    var a=new C(); var o=a.createOscillator(), g=a.createGain();
    o.connect(g); g.connect(a.destination); o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(.001,a.currentTime); g.gain.exponentialRampToValueAtTime(.4,a.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.5);
    o.start(); o.stop(a.currentTime+.5);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(300);
}
/* Réglages persistés du chrono */
function chSettings(){
  if(!D.chrono) D.chrono={secs:60, players:['Joueur 1','Joueur 2','Joueur 3'], sound:true};
  return D.chrono;
}

    '<button class="'+(S.chTab==='pal'?'on':'')+'" onclick="S.chTab=\'pal\';window.scrollTo(0,0);render()"><span class="i">🏆</span>Palmarès'+(D.tictac.length?' ('+D.tictac.length+')':'')+'</button>'+

function chSaveDuel(){
  if(!CH||CH.saved) return;
  var w = CH.winner!==null ? CH.winner : (chAlive()[0]&&chAlive()[0].name);
  D.tictac.unshift({ id:uid(), date:today(),
    players: CH.players.map(function(p){return {name:p.name, good:p.good};}),
    winner: w||null });
  CH.saved=true; persist(); toast('Manche enregistrée 🏆'); render();
}
function chDelDuel(id){ D.tictac=D.tictac.filter(function(d){return d.id!==id;}); persist(); render(); }
function chAggChrono(){
  var agg={};
  D.tictac.forEach(function(d){
    d.players.forEach(function(p){
      var k=fp(p.name); if(!k) return;
      if(!agg[k]) agg[k]={name:p.name, duels:0, wins:0, good:0, best:0};
      agg[k].duels++; agg[k].good+=(p.good||0);
      if(p.good>agg[k].best) agg[k].best=p.good;
      if(d.winner && fp(d.winner)===k) agg[k].wins++;
    });
  });
  var list=[]; for(var k in agg) list.push(agg[k]);
  list.sort(function(a,b){return b.wins-a.wins||b.good-a.good||b.duels-a.duels;});
  return list;
}

       '<input style="flex:1" value="'+n.replace(/"/g,'&quot;')+'" onchange="chRename('+i+',this.value)">'+
       (s.players.length>2?'<button class="sm r" onclick="chDelP('+i+')">✕</button>':'')+'</div>';
  });
  h+='<p class="mini" style="margin-top:2px">Touche un avatar pour mettre une photo ou un personnage (facultatif). Il est partagé avec La Coupe et Le Micro.</p>';
  if(s.players.length<8) h+='<button class="sm g" style="width:100%;margin-top:4px" onclick="chAddP()">+ Ajouter un joueur</button>';
  h+='</div>';
  h+='<div class="card"><h2>Son</h2><div class="row">'+
     '<button class="chip'+(s.sound?' on':'')+'" style="flex:1;text-align:center" onclick="chSound(true)">🔔 Bip activé</button>'+
     '<button class="chip'+(!s.sound?' on':'')+'" style="flex:1;text-align:center" onclick="chSound(false)">🔕 Silencieux</button></div></div>';
  h+='<button class="btn" onclick="chStart()">Démarrer la manche</button>'+
     '<p class="mini" style="text-align:center;margin-top:8px">Chaque joueur défend son temps. Bon → il garde la main. Faux → au suivant.</p>';
  return h;
}
function chAv(i){ var s=chSettings(); if(!s.players[i]||!s.players[i].trim()){ s.players[i]='Joueur '+(i+1); } openAv(libIdForName(s.players[i])); }
function chSetSecs(v){ chSettings().secs=Math.max(5,v||60); persist(); render(); }
function chRename(i,v){ chSettings().players[i]=v.trim()||('Joueur '+(i+1)); persist(); }
function chAddP(){ var s=chSettings(); s.players.push('Joueur '+(s.players.length+1)); persist(); render(); }
function chDelP(i){ var s=chSettings(); if(s.players.length>2){ s.players.splice(i,1); persist(); render(); } }
function chSound(b){ chSettings().sound=b; persist(); render(); }

/* ---- Démarrage d'une manche ---- */
function chStart(){
  var s=chSettings();
  CH={ players:s.players.map(function(n){return {name:n, left:s.secs, out:false, good:0};}),
       active:0, running:false, sound:s.sound, total:s.secs, winner:null };
  chStopTick();
  render();
}
function chStopTick(){ if(chTick){clearInterval(chTick); chTick=null;} }
function chRun(){
  if(CH.running) return;
  CH.running=true; chStopTick();
  var last=Date.now();
  chTick=setInterval(function(){
    var now=Date.now(), dt=(now-last)/1000; last=now;
    var p=CH.players[CH.active];
    p.left-=dt;
    if(p.left<=0){ p.left=0; p.out=true; if(CH.sound) chBeep(); chStopTick(); CH.running=false; chAdvance(true); }
    render();
  },100);
  render();
}
function chPause(){ CH.running=false; chStopTick(); render(); }
function chAlive(){ return CH.players.filter(function(p){return !p.out;}); }
function chNextIdx(from){
  var n=CH.players.length;
  for(var k=1;k<=n;k++){ var i=(from+k)%n; if(!CH.players[i].out) return i; }
  return -1;
}
function chAdvance(auto){
  var alive=chAlive();
  if(alive.length<=1){ CH.winner = alive.length? alive[0].name : null; CH.running=false; chStopTick(); if(CH.winner) speak(CH.winner+' remporte le duel'); render(); return; }
  var ni=chNextIdx(CH.active);
  if(ni>=0){ CH.active=ni; speak('À toi '+CH.players[ni].name); }
  CH.running=false; chStopTick();
  if(auto) render();
}
/* Boutons animateur */
function chGood(){ if(CH.winner) return; CH.players[CH.active].good++; chRun(); }
function chWrong(){ chStopTick(); CH.running=false; chAdvance(false);
  // enchaîne directement sur le nouveau joueur
  if(!CH.winner) chRun(); else render(); }
function chSkip(){ chStopTick(); CH.running=false; chAdvance(true); }
function chJump(i){
  if(!CH||CH.winner!==null) return;
  if(CH.players[i].out||i===CH.active) return;
  chStopTick(); CH.running=false; CH.active=i; render();
}
function chReset(){ chStopTick(); CH=null; render(); }

/* ---- Écran de jeu ---- */
function fmtT(sec){ sec=Math.max(0,Math.ceil(sec)); var m=Math.floor(sec/60), s=sec%60; return m+':'+(s<10?'0':'')+s; }
function chGame(){
  var p=CH.players[CH.active];
  var pct = CH.total>0 ? Math.max(0,Math.min(1,p.left/CH.total)) : 0;
  var col = p.left<=5 ? '#e11d48' : p.left<=20 ? '#f59e0b' : '#059669';
  var R=52, C=2*Math.PI*R, off=C*(1-pct);
  // anneau SVG
  var ring='<svg viewBox="0 0 120 120" style="width:210px;height:210px;transform:rotate(-90deg)">'+
    '<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="#e7e5e4" stroke-width="10"/>'+
    '<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="10" stroke-linecap="round" '+
      'stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>';

  if(CH.winner!==null || chAlive().length<=1){
    var w = CH.winner!==null ? CH.winner : (chAlive()[0]&&chAlive()[0].name);
    var conf='<div class="confetti" style="position:absolute;inset:0;pointer-events:none;overflow:hidden">'+
      ['🎉','🏆','⭐️','🎊','✨','🥇'].map(function(e,i){return '<span style="left:'+(8+i*15)+'%;animation-delay:'+(i*.35)+'s">'+e+'</span>';}).join('')+'</div>';
    return '<div class="card" style="text-align:center;padding:28px 16px;position:relative;overflow:hidden">'+conf+
      '<div style="font-size:46px">🏆</div><div style="margin:4px 0">'+(w?av(w,'big'):'')+'</div><h2 style="font-size:22px;margin:4px 0 2px">'+esc(w||'—')+'</h2>'+
      '<p class="mini">dernier joueur en course</p>'+
      '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">'+
        CH.players.slice().sort(function(a,b){return b.good-a.good;}).map(function(pl){
          return '<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span style="display:flex;align-items:center;gap:6px">'+av(pl.name,'sm')+esc(pl.name)+'</span><b style="color:#059669">✓ '+pl.good+'</b></div>';
        }).join('')+
      '</div></div>'+
      (CH.saved
        ? '<p class="mini" style="text-align:center;color:#059669;margin-top:12px">✓ Manche enregistrée au palmarès</p>'
        : '<button class="btn" style="margin-top:12px;background:linear-gradient(135deg,#d97706,#fbbf24)" onclick="chSaveDuel()">🏆 Enregistrer cette manche</button>')+
      '<button class="btn" style="margin-top:8px" onclick="chStart()">Rejouer (mêmes réglages)</button>'+
      '<button class="btn grey" style="margin-top:8px" onclick="chReset()">Changer les réglages</button>';
  }

  var h='<div style="text-align:center;position:relative;margin:6px 0 4px">'+
    '<div style="position:relative;display:inline-block">'+ring+
    '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">'+
      '<div style="margin-bottom:2px">'+av(p.name)+'</div>'+
      '<div style="font-size:13px;color:#78716c;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.name)+'</div>'+
      '<div style="font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;color:'+col+'">'+fmtT(p.left)+'</div>'+
      '<div style="font-size:12px;color:#059669;font-weight:700;margin-top:2px">✓ '+CH.players[CH.active].good+' bonne'+(CH.players[CH.active].good>1?'s':'')+'</div>'+
      '<div style="font-size:11px;color:#a8a29e">'+(CH.running?'en cours':'en pause')+'</div>'+
    '</div></div></div>';

  // contrôle principal : Démarrer / Pause
  h+= CH.running
    ? '<button class="btn" style="background:#78716c" onclick="chPause()">⏸ Pause</button>'
    : '<button class="btn" onclick="chRun()">▶︎ Lancer le temps de '+esc(p.name)+'</button>';

  // boutons animateur : Bon (garde la main, +1) / Raté (passe, sans point) / Passer (neutre)
  h+='<button class="btn" style="margin-top:10px;font-size:17px" onclick="chGood()">✓ Bonne réponse — '+esc(p.name)+' garde la main</button>'+
     '<div class="row" style="margin-top:8px;gap:8px">'+
     '<button class="btn red" style="flex:1" onclick="chWrong()">✗ Raté → au suivant</button>'+
     '<button class="btn grey" style="flex:1" onclick="chSkip()">⏭ Passer (sans faute)</button></div>'+
     '<p class="mini" style="text-align:center;margin-top:6px">« Raté » et « Passer » donnent la main au suivant. « Raté » compte une erreur ; « Passer » est neutre (question sautée).</p>';

  // arène des joueurs : pastilles avec mini-anneaux de temps
  h+='<div class="card" style="margin-top:14px"><h2>Arène</h2><div class="charena">';
  CH.players.forEach(function(pl,i){
    var pc=CH.total>0?Math.max(0,Math.min(1,pl.left/CH.total)):0;
    var cc=pl.out?'#d6d3d1':(pl.left<=5?'#e11d48':pl.left<=20?'#f59e0b':'#059669');
    var r2=26,C2=2*Math.PI*r2,o2=C2*(1-pc);
    h+='<div class="chp'+(i===CH.active&&!pl.out?' live':'')+(pl.out?' ko':'')+'" onclick="chJump('+i+')">'+
       '<div class="ring"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="'+r2+'" fill="none" stroke="#e7e5e4" stroke-width="5"/>'+
       '<circle cx="32" cy="32" r="'+r2+'" fill="none" stroke="'+cc+'" stroke-width="5" stroke-linecap="round" transform="rotate(-90 32 32)" stroke-dasharray="'+C2.toFixed(1)+'" stroke-dashoffset="'+o2.toFixed(1)+'"/></svg>'+
       '<span class="face">'+(pl.out?'❌':av(pl.name))+'</span></div>'+
       '<b>'+esc(pl.name)+'</b><small style="color:'+cc+'">'+(pl.out?'éliminé':fmtT(pl.left))+'</small>'+
       '<small style="color:#059669;font-weight:700">✓ '+pl.good+'</small></div>';
  });
  h+='</div><p class="mini" style="margin-top:8px;text-align:center">Touche une pastille pour donner la main à ce joueur.</p></div>';
  // barre de comparaison des bonnes réponses
  var maxG=Math.max(1,Math.max.apply(null,CH.players.map(function(p){return p.good;})));
  if(CH.players.some(function(p){return p.good>0;})){
    h+='<div class="card"><h2>Bonnes réponses</h2>';
    CH.players.slice().sort(function(a,b){return b.good-a.good;}).forEach(function(pl){
      var pct=Math.round(pl.good/maxG*100);
      h+='<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px"><span style="display:flex;align-items:center;gap:6px">'+av(pl.name,'sm')+esc(pl.name)+'</span><b>'+pl.good+'</b></div>'+
         '<div style="height:8px;background:#f5f5f4;border-radius:99px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#059669,#34d399);border-radius:99px"></div></div></div>';
    });
    h+='</div>';
  }
  h+='<button class="btn grey" style="margin-top:10px" onclick="chReset()">⟲ Nouvelle manche</button>';
  return h;
}

render();

/* Fonctionnement hors réseau (utile en voiture) + détection de mise à jour */
function showUpdateBar(){
  if(document.getElementById('updbar')) return;
  var d=document.createElement('div'); d.id='updbar'; d.className='updbar';
  d.innerHTML='<span>🔄 Nouvelle version prête</span><button id="updbtn">Mettre à jour</button>';
  document.body.appendChild(d);
  document.getElementById('updbtn').onclick=function(){ try{location.reload();}catch(e){} };
}
if('serviceWorker' in navigator){
  var __hadController = !!navigator.serviceWorker.controller;
  var __reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(__reloaded) return;
    // Un nouveau service worker a pris le contrôle. Si l'app tournait déjà
    // (mise à jour pendant l'usage), on propose de recharger — sans surprise.
    if(__hadController) showUpdateBar();
    __reloaded=true;
  });
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      if(reg.waiting && navigator.serviceWorker.controller) showUpdateBar();
      reg.addEventListener('updatefound',function(){
        var nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange',function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller) showUpdateBar();
        });
      });
    }).catch(function(){});
  });
}
</script>
</body>
</html>
