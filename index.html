/* ---- Démarrage d'une manche ---- */
/* Le duel vit dans D : un appel entrant, un verrouillage d'écran ou un
   rechargement ne doit JAMAIS effacer une partie en cours. */
function chPersist(){ try{ D.live=CH?JSON.parse(JSON.stringify(CH)):null; persist(); }catch(e){} }
function chRestore(){
  try{
    if(D.live && D.live.players && D.live.players.length && D.live.winner===null){
      CH=D.live; CH.running=false; return true;
    }
  }catch(e){}
  return false;
}
function chStart(){
  var s=chSettings();
  CH={ players:s.players.map(function(n,i){var t=(s.custom&&s.custom[i])?s.custom[i]:s.secs; return {name:n, left:t, out:false, good:0, start:t};}),
       active:0, running:false, sound:s.sound, total:s.secs, winner:null };
  chStopTick(); chPersist();
  render();
}
function chStopTick(){ if(chTick){clearInterval(chTick); chTick=null;} }
function chRun(){
  if(CH.running) return;
  if(!CH.startedOnce){ CH.startedOnce=true; chCountdown(function(){ chRunNow(); }); return; }
  chRunNow();
}
function chCountdown(done){
  var ov=document.createElement('div'); ov.id='cnt321';
  ov.style.cssText='position:fixed;inset:0;background:rgba(6,78,59,.92);z-index:60;display:flex;align-items:center;justify-content:center';
  ov.innerHTML='<div id="cnum" style="font-size:110px;font-weight:800;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.35)">3</div>';
  document.body.appendChild(ov);
  var steps=[['3',760],['2',760],['1',760],['GO !',1180]], i=0;
  function next(){
    if(i>0){ var el=document.getElementById('cnum'); if(el){ el.textContent=steps[i][0]; el.style.fontSize=steps[i][0]==='GO !'?'72px':'110px'; } }
    if(CH&&CH.sound){
      if(i===3){ // GO !
        sub(110,.5,.6);
        [0,2,4,5].forEach(function(idx,k){ hit(PENTA[idx],{delay:k*.05,dur:.6,vol:.34,fm:.7,fmRatio:3.01,cut:7000,rev:.45}); });
        perc({dur:.2,f1:2400,f2:800,vol:.32,rev:.45});
      } else {   // 3 · 2 · 1
        hit(PENTA[2],{dur:.14,vol:.3,fm:.4,fmRatio:2.01,cut:4200,rev:.22});
        perc({dur:.05,f1:1800,vol:.14,rev:.15});
      }
    }
    i++;
    if(i<steps.length){ setTimeout(next,600); }
    else setTimeout(function(){ try{ov.remove();}catch(e){} if(done)done(); },550);
  }
  next();
}
function chRunNow(){
  if(CH.running) return;
  CH.running=true; chStopTick();
  var last=Date.now();
  var __psave=0;
  chTick=setInterval(function(){
    var now=Date.now(), dt=(now-last)/1000; last=now;
    if(now-__psave>2000){ __psave=now; chPersist(); }
    var p=CH.players[CH.active];
    var beforeSec=Math.ceil(p.left);
    p.left-=dt;
    var afterSec=Math.ceil(p.left);
    // tension sonore façon plateau TV : tic-tac sous 10 s, plus pressant sous 5 s
    if(CH.sound && afterSec<beforeSec && afterSec>0){
      if(afterSec<=5){ hit(1245,{dur:.07,vol:.3,cut:5000,rev:.12,atk:.002}); perc({dur:.03,f1:2600,vol:.1,rev:.1}); }
      else if(afterSec<=10){ hit(830,{dur:.06,vol:.2,cut:3600,rev:.1,atk:.002}); }
    }
    if(p.left<=0){ p.left=0; p.out=true; if(CH.sound) chBeep(); chStopTick(); CH.running=false;
      var rest=chAlive().length;
      if(rest>1){ toast('⏰ '+p.name+' éliminé — encore '+rest+' en course'); speak(p.name+' éliminé'); }
      chAdvance(true); }
    render();
  },100);
  render();
}
function chPause(){ CH.running=false; chStopTick(); chPersist(); render(); }
function chAlive(){ return CH.players.filter(function(p){return !p.out;}); }
function chNextIdx(from){
  var n=CH.players.length;
  for(var k=1;k<=n;k++){ var i=(from+k)%n; if(!CH.players[i].out) return i; }
  return -1;
}
function chAdvance(auto){
  var alive=chAlive();
  if(alive.length<=1){ CH.winner = alive.length? alive[0].name : null; CH.running=false; chStopTick(); if(CH.winner) speak(CH.winner+' remporte le duel'); render(); return; }
  var ni=chNextIdx(CH.active);
  if(ni>=0){ CH.active=ni; speak('À toi '+CH.players[ni].name); }
  CH.running=false; chStopTick();
  if(auto) render();
}
/* Boutons animateur */
function chGood(){
  if(CH.winner) return;
  CH.players[CH.active].good++; chPersist();
  hit(PENTA[3],{dur:.16,vol:.34,fm:.5,fmRatio:3.01,cut:6000,rev:.28});
  hit(PENTA[5],{delay:.075,dur:.3,vol:.3,fm:.6,fmRatio:3.01,cut:7000,rev:.35});
  perc({dur:.06,f1:3000,vol:.12,rev:.2});
  chRun();
}
/* Mode « la bonne réponse passe la main » : le succès fait tourner */
function chPassGood(){
  if(CH.winner) return;
  CH.players[CH.active].good++; chPersist();
  hit(PENTA[3],{dur:.16,vol:.34,fm:.5,fmRatio:3.01,cut:6000,rev:.28});
  hit(PENTA[5],{delay:.075,dur:.3,vol:.3,fm:.6,fmRatio:3.01,cut:7000,rev:.35});
  chStopTick(); CH.running=false;
  chAdvance(false);
  if(!CH.winner){ setTimeout(function(){ swoosh(); },120); chRun(); } else render();
}
/* …et l'échec le laisse en difficulté sur son propre temps */
function chKeepWrong(){
  if(CH.winner) return;
  sub(140,.2,.45);
  hit(196,{dur:.26,vol:.3,bend:.62,wave:'triangle',cut:1200,rev:.25});
  chRun();
}
function chWrong(){
  chStopTick(); CH.running=false;
  sub(140,.2,.45);
  hit(196,{dur:.26,vol:.3,bend:.62,wave:'triangle',cut:1200,rev:.25});
  perc({dur:.1,f1:600,f2:220,vol:.2,filter:'lowpass',rev:.2});
  chAdvance(false);
  if(!CH.winner){ setTimeout(function(){ swoosh(); },140); chRun(); } else render();
}
/* whoosh : la main passe d'un joueur à l'autre — on l'entend, on le voit */
function swoosh(){
  /* Vrai whoosh : bruit filtré balayé vers le haut + petit blip de repère */
  perc({dur:.26,f1:400,f2:3600,vol:.26,filter:'bandpass',q:1.4,decay:1.2,rev:.3});
  hit(PENTA[3],{delay:.1,dur:.16,vol:.2,fm:.4,cut:5000,rev:.25});
}
function chJump(i){
  if(!CH||CH.winner!==null) return;
  if(!CH.players[i]||CH.players[i].out||i===CH.active) return;
  var wasRunning=CH.running;
  chStopTick(); CH.running=false; CH.active=i;
  swoosh();
  speak('À toi '+CH.players[i].name);
  if(wasRunning) chRun(); else render();
}
function chReset(){ chStopTick(); CH=null; render(); }

/* ---- Écran de jeu ---- */
function fmtT(sec){ sec=Math.max(0,Math.ceil(sec)); var m=Math.floor(sec/60), s=sec%60; return m+':'+(s<10?'0':'')+s; }
function chGame(){
  var p=CH.players[CH.active];
  var col = p.left<=5 ? '#e11d48' : p.left<=20 ? '#f59e0b' : '#059669';
  if(CH.winner!==null || chAlive().length<=1){
    var w = CH.winner!==null ? CH.winner : (chAlive()[0]&&chAlive()[0].name);
    var conf='<div class="confetti" style="position:absolute;inset:0;pointer-events:none;overflow:hidden">'+
      ['🎉','🏆','⭐️','🎊','✨','🥇'].map(function(e,i){return '<span style="left:'+(8+i*15)+'%;animation-delay:'+(i*.35)+'s">'+e+'</span>';}).join('')+'</div>';
    return '<div class="card" style="text-align:center;padding:28px 16px;position:relative;overflow:hidden">'+conf+
      '<div style="font-size:52px" class="winbig">🏆</div><div style="margin:4px 0">'+(w?av(w,'big'):'')+'</div><h2 style="font-size:22px;margin:4px 0 2px">'+esc(w||'—')+'</h2>'+
      '<p class="mini">dernier joueur en course</p>'+
      '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">'+
        CH.players.slice().sort(function(a,b){return b.good-a.good;}).map(function(pl){
          return '<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span style="display:flex;align-items:center;gap:6px">'+av(pl.name,'sm')+esc(pl.name)+'</span><b style="color:#059669">✓ '+pl.good+'</b></div>';
        }).join('')+
      '</div></div>'+
      (CH.saved
        ? '<p class="mini" style="text-align:center;color:#059669;margin-top:12px">✓ Manche enregistrée</p>'
        : '<button class="btn tictac" style="margin-top:12px" onclick="chToCoupe()">🏆 Enregistrer la manche</button>')+
      '<button class="btn" style="margin-top:8px" onclick="chStart()">Rejouer (mêmes réglages)</button>'+
      '<button class="btn grey" style="margin-top:8px" onclick="chReset()">Changer les réglages</button>';
  }

  var alive=chAlive().length;
  var resumed = !CH.running && CH.players.some(function(p){return p.good>0 || p.left<(p.start||CH.total);});
  var nCol = CH.players.length<=4 ? 'n'+CH.players.length : 'nx';
  var maxGood = Math.max.apply(null, CH.players.map(function(x){return x.good;}));

  var h='<div class="card" style="padding:9px 12px;margin-bottom:10px;background:var(--am-l);border-color:var(--am);text-align:center">'+
    '<p style="margin:0;font-size:13px;color:#92400e"><b>\uD83D\uDC65 '+alive+' en course</b> \u00B7 \u00E0 z\u00E9ro seconde on est \u00E9limin\u00E9 \u00B7 <b>le dernier debout gagne</b> \uD83C\uDFC6</p></div>';

  // Qui a la main : gros titre lisible de loin
  h+='<div class="turnbar"><div class="st">'+(CH.running?'\u23F1 \u00E0 lui de jouer':'\u23F8 en pause')+'</div>'+
     '<div class="nm" style="color:'+col+'">'+esc(p.name)+'</div></div>';

  // ARÈNE : une colonne par joueur/équipe, remplie par son temps restant
  h+='<div class="duel '+nCol+'">';
  CH.players.forEach(function(pl,i){
    var base = pl.start || CH.total;
    var pc = base>0 ? Math.max(0,Math.min(1,pl.left/base)) : 0;
    var live = (i===CH.active && !pl.out);
    var cc = pl.out ? '#d6d3d1' : (pl.left<=5 ? '#e11d48' : pl.left<=20 ? '#f59e0b' : '#059669');
    var cls = 'lane'+(live?' live':'')+(pl.out?' ko':'')+(!pl.out&&pl.left<=5?' danger':(!pl.out&&pl.left<=20?' warn':''));
    var bg = pl.out ? '#e7e5e4' : (pl.left<=5 ? 'linear-gradient(180deg,#fecdd3,#fda4af)' : pl.left<=20 ? 'linear-gradient(180deg,#fde68a,#fcd34d)' : 'linear-gradient(180deg,#a7f3d0,#6ee7b7)');
    var lead = (!pl.out && pl.good>0 && pl.good===maxGood);
    var R=42, CIRC=2*Math.PI*R, off=CIRC*(1-pc);
    var ph=avPhotoOf(pl.name);
    var ring='<div class="ring"><svg viewBox="0 0 100 100">'+
      '<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="#eeedec" stroke-width="9"/>'+
      '<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="'+(pl.out?'#d6d3d1':cc)+'" stroke-width="9" stroke-linecap="round" '+
        'stroke-dasharray="'+CIRC.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" style="transition:stroke-dashoffset .3s linear"/></svg>'+
      '<span class="face">'+(pl.out?'\u274C':(ph?'<img src="'+ph+'" alt="">':avFor(pl.name)))+'</span></div>';
    h+='<div class="'+cls+'" onclick="chJump('+i+')">'+
       (lead?'<span class="crown">\uD83D\uDC51</span>':'')+
       ring+
       '<div class="who">'+esc(pl.name)+'</div>'+
       '<div class="tt" style="color:'+(pl.out?'#78716c':cc)+'">'+(pl.out?'0:00':fmtT(pl.left))+'</div>'+
       '<div class="gd">\u2713 '+pl.good+'</div>'+
       '</div>';
  });
  h+='</div>';
  var passLbl=(chSettings().pass||'wrong')==='good'?'la main passe apr\u00E8s une bonne r\u00E9ponse'
             :((chSettings().pass||'wrong')==='both'?'tu d\u00E9cides quand la main passe':'il garde la main tant qu\'il r\u00E9pond juste');
  h+='<p class="mini" style="text-align:center;margin:-4px 0 10px">L\'anneau se vide en direct \u00B7 '+passLbl+' \u00B7 touche un joueur pour lui donner la main.</p>';

  // contrôle principal : Démarrer / Pause
  h+= CH.running
    ? '<button class="btn" style="background:#78716c" onclick="chPause()">⏸ Pause</button>'
    : '<button class="btn" onclick="chRun()">▶︎ Lancer le temps de '+esc(p.name)+'</button>';

  // boutons animateur : 2 actions seulement (benchmark pendule d'échecs / party games)
  var pass=(chSettings().pass||'wrong');
  if(pass==='good'){
    // la bonne réponse fait tourner : c'est elle qui passe la main
    h+='<button class="btn" style="margin-top:10px" onclick="chPassGood()">✓ Réussi — au suivant</button>'+
       '<button class="btn red" style="margin-top:8px" onclick="chKeepWrong()">✗ Raté — il continue</button>'+
       '';
  } else if(pass==='both'){
    h+='<button class="btn" style="margin-top:10px" onclick="chGood()" aria-label="Bonne réponse">✓ Bon — il garde la main</button>'+
       '<button class="btn red" style="margin-top:8px" onclick="chWrong()" aria-label="Passer au joueur suivant">⏭ Passer au suivant</button>'+
       '';
  } else {
    h+='<button class="btn" style="margin-top:10px" onclick="chGood()">✓ Bonne réponse — garde la main</button>'+
       '<button class="btn red" style="margin-top:8px" onclick="chWrong()">⏭ Au suivant</button>'+
       '';
  }
  h+='<p class="mini" style="text-align:center;margin-top:8px">Bonne réponse : '+esc(p.name)+' continue et son ✓ grimpe. Sinon : la main passe, son chrono se fige.</p>';

  // barre de comparaison des bonnes réponses
  var maxG=Math.max(1,Math.max.apply(null,CH.players.map(function(p){return p.good;})));
  if(CH.players.some(function(p){return p.good>0;})){
    h+='<div class="card"><h2>Bonnes réponses</h2>';
    CH.players.slice().sort(function(a,b){return b.good-a.good;}).forEach(function(pl){
      var pct=Math.round(pl.good/maxG*100);
      h+='<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px"><span style="display:flex;align-items:center;gap:6px">'+av(pl.name,'sm')+esc(pl.name)+'</span><b>'+pl.good+'</b></div>'+
         '<div style="height:8px;background:var(--bg);border-radius:99px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#059669,#34d399);border-radius:99px"></div></div></div>';
    });
    h+='</div>';
  }
  /* Zone de sortie : regroupée, en bas, séparée des actions de jeu.
     Avant, « Terminer », « Abandonner » et « Nouvelle manche » étaient éparpillés
     entre les boutons d'animation — on ne savait plus lequel faisait quoi. */
  h+='<div class="card" style="margin-top:14px;background:var(--bg)">'+
     '<label class="lb">Arrêter cette manche</label>'+
     '<button class="sm g" style="width:100%;margin-bottom:7px" onclick="chFinishNow()">🏁 Terminer et désigner le vainqueur</button>'+
     
     '<button class="sm" style="width:100%;color:#9f1239" onclick="chAbandon()">✕ Abandonner sans compter</button></div>';
  return h;
}

render();

/* Fonctionnement hors réseau (utile en voiture) + détection de mise à jour */
function showUpdateBar(){
  if(document.getElementById('updbar')) return;
  var d=document.createElement('div'); d.id='updbar'; d.className='updbar';
  d.innerHTML='<span>🔄 Nouvelle version prête</span><button id="updbtn">Mettre à jour</button>';
  document.body.appendChild(d);
  document.getElementById('updbtn').onclick=function(){ try{location.reload();}catch(e){} };
}
if('serviceWorker' in navigator){
  var __hadController = !!navigator.serviceWorker.controller;
  var __reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(__reloaded) return;
    // Un nouveau service worker a pris le contrôle. Si l'app tournait déjà
    // (mise à jour pendant l'usage), on propose de recharger — sans surprise.
    if(__hadController) showUpdateBar();
    __reloaded=true;
  });
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      if(reg.waiting && navigator.serviceWorker.controller) showUpdateBar();
      reg.addEventListener('updatefound',function(){
        var nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange',function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller) showUpdateBar();
        });
      });
    }).catch(function(){});
  });
}
</script>
</body>
