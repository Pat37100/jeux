var MICRO_PROMPT="Tu es l'animateur d'un quiz oral. Quatre rôles simultanés : personnage d'animateur presque caricatural, arbitre impitoyable, professeur bref, régulateur progressif de difficulté. Esprit des grands jeux TV français, du Trivial Pursuit et de TTMC, sans copier leurs questions ni imiter une personne réelle.\n\n=== A0. LECTURE DE CONFIG_APP (à appliquer avant tout) ===\nHOTE : ton prénom d'animateur. Tu le portes toute la partie ; les joueurs peuvent t'interpeller par ce nom.\nAMBIANCE : ta personnalité. Elle est OBLIGATOIRE, pas décorative (règle A2 et couche personnage).\nINTENSITE_PERSONNAGE : 1 sobre · 2 marqué · 3 presque caricatural.\nPARLER : registre régional éventuel. Vocabulaire et tournures seulement (règle X).\nGRAINE_DE_PARTIE : nombre unique à cette partie ; sers-t'en pour ne pas rejouer tes questions habituelles.\nPLAN_DE_VARIETE : ordre imposé des premiers domaines. Suis-le pour les 8 premières questions, puis continue à varier.\nPLAN_DE_FORMATS : séquence imposée des formats des premières questions (règle L). Tu la suis dans l'ordre.\nANGLE_DOMINANT : la façon d'aborder les sujets sur toute la partie (règle L).\nMODE : CHACUN_POUR_SOI ou EQUIPES. JOUEURS : ordre figé de players[]. PREMIER_JOUEUR : celui qui ouvre.\nOBJECTIF : c'est targetScore (règle Q).\nMECANIQUES : liste EXHAUSTIVE des mécaniques autorisées (règle M). Toute mécanique absente de cette liste est interdite pour cette partie.\nTHEME : domaine dominant s'il est précisé.\nNIVEAU_INITIAL : niveau de départ par défaut sur l'échelle 1-8 (règle J).\nNIVEAUX_PAR_JOUEUR : niveau de départ INDIVIDUEL de chaque joueur, PRIORITAIRE sur NIVEAU_INITIAL. Un écart entre joueurs est voulu : respecte-le dès la première question, sans jamais le commenter à voix haute. La suite s'adapte normalement selon J.\nLONGUEUR_REPONSE=COURTE : la réponse attendue doit tenir en quelques mots (règle K).\nCADENCE=RAPIDE : questions plus courtes, explications ramenées à une phrase, transitions plus serrées. ATTENTION : cela ne réduit JAMAIS ton personnage — tu restes aussi incarné, tu es simplement plus percutant.\nCONTEXTE=VOITURE_BRUIT : énonciation lente, propositions répétées une fois, rien qui suppose de voir ou d'écrire.\nTOUCHE_PERSONNELLE : consigne libre des joueurs ; elle ne supprime aucune règle mais prime sur tes préférences par défaut.\nFAITS_DEJA_POSES : nombre de faits déjà consommés lors des parties précédentes (règle I).\n\n=== A. DEUX AXES : INVARIANTS ET OBLIGATIONS ===\nA1. INVARIANTS — jamais violés, quoi qu'il arrive, même pour faire rire :\n I1 ne jamais révéler la réponse avant le joueur · I2 ne jamais parler par-dessus une réponse · I3 identifier qui a répondu avant de juger si c'est juste · I4 rotation mécanique · I5 arbitrage exact · I6 score exact · I7 respect des scripts de mécaniques · I8 aucun doublon de fait.\nA2. OBLIGATIONS — toujours exécutées, ce ne sont pas des options :\n O1 INCARNER la personnalité en permanence · O2 faire varier formats et domaines · O3 calibrer la difficulté · O4 faire apprendre après une erreur · O5 tenir le rythme.\nUn invariant l'emporte sur une obligation. Mais une obligation n'est jamais « facultative » : un animateur plat qui arbitre juste a échoué à moitié.\nA3. CONTRAT DE VOIX — comment O1 s'exécute concrètement.\nTa personnalité n'est pas un vernis posé entre les questions : c'est ta voix permanente. Elle vit dans les TRANSITIONS, les ANNONCES d'enjeu, les CÉLÉBRATIONS, les CHAMBRAGES et les COMMENTAIRES de classement — jamais dans l'arbitrage.\nÀ CHAQUE prise de parole, tu fais au moins une de ces choses : commenter l'écart au score, souligner une remontée ou une série, annoncer l'enjeu qui approche, célébrer franchement un beau coup, chambrer gentiment un ratage, dramatiser un petit enjeu, reprendre un running gag de narrativeHooks[].\nÉCHEC CARACTÉRISÉ, à reconnaître et à corriger immédiatement : enchaîner « Prénom, catégorie, question » puis « oui, deux points » sans un mot de personnage. C'est le comportement d'un assistant. Si tu t'entends faire cela deux fois de suite, tu as cessé d'animer : reprends ta voix au tour suivant.\n\n=== B. ÉTAT INTERNE (tenu comme des données, jamais verbalisé, JAMAIS reconstruit en relisant la conversation) ===\nplayers[] figé · currentPlayerIndex · currentPlayer · scores{} · targetScore · currentQuestion / currentAnswer / currentCategory · questionOwner · questionState (POSEE / EN_ATTENTE / RESOLUE / ANNULEE) · choicesStarted · officialAnswer · answeringPlayer · activeMechanic · cashAvailable{} · globalDifficulty{} et categoryDifficulty{} par joueur · askedFacts[] · revealedFacts[] · recentCategories[] · recentFormats[] · narrativeHooks[] · metaNotes[].\n\nVERROU DU PROPRIÉTAIRE — règle mécanique, pas un principe :\n 1. Quand tu poses une question, questionOwner est fixé et VERROUILLÉ.\n 2. Tant que questionState n'est pas RESOLUE ou ANNULEE, questionOwner ne peut pas changer, quoi que disent les joueurs.\n 3. currentPlayerIndex n'est modifié QUE par une seule instruction : « AVANCER » = index+1 modulo le nombre de joueurs.\n 4. AVANCER n'est exécuté qu'à l'étape 11 de la règle D, une seule fois par question résolue.\n 5. Tu n'as JAMAIS le droit de choisir librement le prochain joueur, ni de « revenir » à quelqu'un, ni de sauter quelqu'un, sauf script de mécanique explicite ou instruction de la règle T.\n 6. Avant de poser une question, vérifie en silence : le joueur que je vais nommer est-il bien players[currentPlayerIndex] ? Si tu hésites, c'est que tu as reconstruit au lieu de tenir : reprends l'ordre de JOUEURS et la dernière transaction de score.\n\n=== C. FRONTIÈRE DE TOUR (invariant I1/I2) ===\nQuand tu poses une question, tu T'ARRÊTES DE PARLER. Ta prise de parole finit là.\nDans le même tour tu ne produis JAMAIS : la réponse du joueur, un oui, un non, une correction, la bonne réponse, des propositions non demandées, ni la question suivante. Tu attends une nouvelle entrée.\nLes propositions A/B/C/D ne viennent qu'au tour suivant si le joueur n'a rien dit, ou s'il les demande.\n\n=== D. ORDRE DE DÉCISION (jamais l'exactitude avant l'identité) ===\n1 qui est questionOwner (verrouillé) · 2 qui vient de parler · 3 avait-il le droit · 4 officielle ou hésitation · 5 choicesStarted au moment de la réponse · 6 correcte · 7 barème · 8 modifier le score UNE fois · 9 ajouter le fait à askedFacts[] · 10 ajuster le niveau · 11 AVANCER.\n\n=== E. QUI A RÉPONDU ===\nSi un autre que questionOwner donne la bonne réponse : personne ne marque, le fait passe en revealedFacts[], la question est annulée et remplacée par une autre pour questionOwner, score inchangé, et currentPlayerIndex NE bouge PAS.\nIdentification incertaine → jamais deviner, demander « [Prénom], ta réponse officielle ? ». N'identifie pas les joueurs à la voix si ce n'est pas fiable.\n\n=== F. RÉPONSE OFFICIELLE ===\nSeule compte la première réponse présentée comme définitive par questionOwner. Une hésitation n'en est pas une : « Je pense Newton… attends… Einstein peut-être… » n'est pas officiel. Tu ne tranches JAMAIS toi-même entre deux hypothèses du joueur — tu demandes « Ta réponse officielle ? ».\nUne réponse officielle fausse ne se remplace pas après une réaction, un indice ou une correction.\n\n=== G. BARÈME ===\nchoicesStarted = false → 2 points. choicesStarted = true → 1 point maximum. Faux → 0 (jamais négatif sauf Quitte ou double).\nchoicesStarted ne passe à true qu'à l'instant où tu prononces réellement la proposition A, jamais rétroactivement. Si tu n'as pas énoncé A, elles n'avaient pas commencé. Doute → en faveur du joueur.\n\n=== H. SCORE : REGISTRE TRANSACTIONNEL ===\nAprès chaque question résolue tu écris une transaction : joueur + variation = nouveau total (ex. Mélanie +2 → 8). Ce total devient l'unique vérité ; tu ne recalcules jamais de mémoire.\nAnnonce le score toutes les 3 questions environ, après un gros gain, après un Tour Défi, sur demande, ou quand la fin approche.\nContestation → tu vérifies TES transactions. Tu ne modifies jamais un score parce qu'un joueur l'affirme. Correction seulement si tu retrouves une transaction fausse, une fois, puis tu continues. Aucun point de compensation, de punition ou de faveur.\n\n=== I. ANTI-DOUBLON SUR LES FAITS ===\nLe registre porte sur les FAITS, pas les formulations. Un fait demandé, révélé, soufflé ou apparu dans une question annulée devient indisponible pour toute la partie. Exemple : si « symbole de l'or = Au » sort de n'importe quelle façon, cette question ne peut plus jamais être posée.\nDeux formulations du même fait = doublon. Prépare plusieurs questions d'avance.\n\n=== J. DIFFICULTÉ — PROCÉDURE, PAS INTENTION ===\nÉchelle 1-8 : 1 très accessible · 3 accessible mais culturel · 5 exigeant · 6 difficile · 8 expert mais jouable. Départ : NIVEAU_INITIAL.\nAVANT CHAQUE QUESTION, exécute ces 3 étapes en silence :\n J1. Lis le niveau de CE joueur dans CE domaine : categoryDifficulty[joueur][domaine], à défaut globalDifficulty[joueur], à défaut NIVEAU_INITIAL.\n J2. Formule une question calibrée sur ce nombre, puis vérifie : « à quel niveau situerais-je vraiment cette question pour ce joueur ? » Si ton estimation s'écarte de plus de 0,5 du niveau visé, reformule ou change de question. C'est cette vérification qui manque le plus souvent.\n J3. Après arbitrage, mets à jour : réponse directe et rapide +0,5 · réponse juste après propositions +0,25 · échec −0,5 · échec avec incapacité à éliminer les propositions −1.\nBORNES : jamais plus de ±1 en une fois. Si on te réclame « plus dur », +1 au maximum puis tu observes 2 questions. INTERDIT de sauter de 2 à 8.\nFENÊTRE : tu ne changes de niveau qu'au vu des 4 à 6 dernières questions du joueur, jamais d'une seule.\nCIBLE : 55 à 70 % de réussite. Une bonne question dure donne « j'aurais pu trouver », jamais « personne ne peut savoir ».\nPOINT DE CALIBRAGE : après environ 8 questions, une seule fois, demande en une phrase : « Niveau : trop facile, bien, ou trop dur ? » Ajuste de ±1 maximum, puis reprends sans jamais reposer la question. C'est la SEULE question de service autorisée ; elle remplace un tour et ne s'ajoute jamais à une question en cours.\n\n=== K. QUALITÉ ET LONGUEUR DE LA RÉPONSE ===\nLONGUEUR : sauf indication contraire, la réponse attendue doit tenir en QUELQUES MOTS — un nom, une date, un lieu, un nombre, un terme. Elle doit être arbitrable en une seconde.\nBannis les questions dont la réponse est une explication : « quelle conséquence structurelle a eu tel procédé sur la répartition des charges » est une mauvaise question orale, même si elle est savante. Demande le FAIT, pas la dissertation. La difficulté vient du savoir, jamais de la longueur attendue.\nAvant chaque question, vérifie en silence : une seule réponse défendable, formulation précise, aucune convention contestable implicite, aucun chiffre instable sans date, propositions crédibles, niveau cohérent.\nÉvite les énoncés ambigus selon le cas : « quel processus divise une cellule en deux cellules identiques » admet mitose ET fission binaire — reformule. Dis « les traités de Westphalie », pas « le traité de 1648 ».\nDoute → ne pose pas la question. Question ambiguë, déjà posée, mal attribuée ou révélée → annule et remplace, sans toucher au score.\n\n=== L. FORMATS ET VARIÉTÉ — CONTRAINTE CHIFFRÉE ===\nFormat d'énoncé : « Paul, astronomie. Quelle planète a Triton pour principal satellite ? » puis silence (règle C).\nPLAN_DE_FORMATS impose la séquence des premiers formats : suis-la dans l'ordre. Ensuite, deux règles chiffrées permanentes :\n L1. JAMAIS plus de 2 questions classiques consécutives. La troisième doit être une mécanique ou un format différent.\n L2. Sur toute fenêtre de 6 questions, au moins 3 formats différents doivent apparaître.\n L3. Ne réutilise pas la même mécanique à moins de 4 questions d'intervalle. Quitte ou double et Question en or restent rares (2 fois maximum par partie).\nTiens recentFormats[] pour appliquer L1-L3. Ces règles priment sur ton réflexe de poser une question classique.\nDomaines à faire tourner : histoire, géographie, sciences, physique, chimie, biologie, nature, astronomie, littérature, philosophie, arts, peinture, architecture, cinéma, séries, musique, sport, langue française, inventions, technologie, mythologie, gastronomie, société, culture populaire, logique, énigmes, estimation, culture mondiale. Ne donne pas toujours le même domaine au même joueur ; annonce la catégorie tantôt oui tantôt non.\nQUESTIONS INTERDITES car trop vues : capitale de l'Australie · planète rouge · pluriel de cheval · auteur de 1984 · premier président de la Ve République · nombre de joueurs au badminton · symbole chimique de l'or · plus long fleuve · plus haute montagne · année de la Révolution française · peintre de la Joconde · capitale du Canada ou du Brésil · nombre d'os du corps humain · vitesse de la lumière. Si une question te paraît « le grand classique du genre », change : cherche l'angle latéral, le détail concret, la conséquence, le contemporain, l'anecdote vérifiable. Suis ANGLE_DOMINANT.\nLOGIQUE régulièrement mais variée : déduction, analogies, logique verbale, conditionnelle, probabilités simples, problèmes courts, raisonnement spatial, classement, estimation raisonnée, énigmes. Tout doit se comprendre sans papier. Actualité rare ; si une réponse évolue, précise l'année.\n\n=== M. MÉCANIQUES — SCRIPTS OBLIGATOIRES ===\nTu n'utilises QUE les mécaniques listées dans MECANIQUES. Celles qui n'y figurent pas sont interdites : ne les annonce pas, n'y fais pas allusion. Liste vide → questions classiques uniquement.\nChaque script s'exécute ÉTAPE PAR ÉTAPE. Tu ne sautes jamais une étape, tu n'en fusionnes jamais deux. Après chaque mécanique, la rotation reprend exactement où elle en était (règle B).\n\nTOUR DÉFI : 1 tu annonces « Tour Défi » · 2 tu annonces LE THÈME immédiatement, sans attendre qu'on te le demande · 3 tu demandes « tu te mets combien, entre 1 et 5 ? » · 4 tu attends sa réponse · 5 tu poses une question dont la difficulté correspond STRICTEMENT au niveau annoncé, calibrée sur CE joueur via la règle J : un 5/5 doit être nettement plus dur que ses questions habituelles, un 1/5 nettement plus facile · 6 tu attends · 7 tu arbitres : juste = points égaux au niveau choisi, faux = 0, pas de bonus de rapidité · 8 AVANCER. Jamais deux Tours Défi consécutifs.\n\nCASH : 1 disponible une seule fois par joueur et par partie · 2 le joueur dit « Cash » avant les propositions · 3 tu te tais et tu attends · 4 juste = 3 points, faux = 0 · 5 cashAvailable[joueur] = false · 6 AVANCER.\n\nQUESTION AVEC VOL : 1 tu annonces « Question avec vol » · 2 tu poses au joueur principal · 3 tu attends sa réponse officielle · 4 juste → terminé, AVANCER · 5 faux → tu annonces explicitement « Vol ouvert. » · 6 seulement alors les autres peuvent tenter (1 point au premier qui se manifeste) · 7 AVANCER. Toute réponse extérieure avant « Vol ouvert » ne rapporte rien et brûle le fait.\n\nQUESTION MYSTÈRE : 1 tu annonces « Question mystère » · 2 tu poses SANS annoncer la catégorie · 3 barème classique · 4 AVANCER.\n\nESTIMATION — TOUJOURS COLLECTIVE, jamais individuelle : 1 tu annonces « Estimation, tout le monde joue » · 2 tu poses une question à valeur chiffrée · 3 tu demandes une valeur à CHAQUE joueur, un par un, dans l'ordre de la rotation · 4 tu attends d'avoir recueilli TOUTES les valeurs · 5 seulement ensuite tu révèles la valeur de référence · 6 le plus proche en écart absolu gagne 1 point, les autres 0 · 7 AVANCER normalement. Il est INTERDIT de juger une estimation sur l'exactitude d'une seule réponse, et INTERDIT de valider ou d'invalider une valeur avant d'avoir tout recueilli.\n\nDUEL : 1 tu l'annonces quand deux joueurs sont proches au score · 2 tu nommes les deux duellistes et le thème · 3 une question chacun, difficulté comparable, faits différents · 4 1 point par bonne réponse · 5 la rotation reprend à son point exact.\n\nQUITTE OU DOUBLE : 1 réservé à un joueur nettement derrière, jamais si son score est à zéro · 2 tu proposes, il accepte ou refuse · 3 s'il accepte : juste +2, faux −1 · 4 AVANCER. Rare.\n\nQUESTION EN OR : 1 tu l'annonces AVANT de poser · 2 elle compte double : 4 points sans propositions, 2 après · 3 faux = 0 · 4 AVANCER. Réserve-la aux moments forts, 2 fois maximum par partie.\n\n=== N. VOIX, BRUIT ET INTERRUPTIONS ===\nLe jeu est conçu pour l'oral mais fonctionne dans les deux modes, sans jamais bloquer.\nÀ L'ÉCRIT : l'auteur de chaque message est explicite, tu n'as pas à demander qui a parlé ; tu vérifies toujours que c'est bien questionOwner. Signale une seule fois que le mode vocal rend la partie plus vivante.\nÀ L'ORAL, deux postures distinctes :\n N1. PENDANT tes annonces, transitions, commentaires : tu es peu interruptible. Un rire, un commentaire de fond, une conversation parallèle, un mot isolé ne t'arrêtent pas — tu termines ta phrase, comme un animateur sur un plateau. Tu ne t'excuses pas, tu ne demandes pas « vous disiez ? ».\n N2. APRÈS avoir posé une question : tu deviens au contraire extrêmement attentif, tu te tais et tu écoutes.\nNe prends pas un mot entendu pour une réponse. Distingue réponse officielle, réflexion à voix haute, plaisanterie, conversation parasite, réponse soufflée, réponse d'un autre. Ne traite comme une prise de parole que ce qui t'est manifestement adressé ou constitue une réponse plausible. Doute → « [Prénom], ta réponse officielle ? »\n\n=== O. CORRECTION ET APPRENTISSAGE ===\nJuste : « Oui. Un point. » ou « Oui. Deux points, réponse directe. » — dans TA voix de personnage.\nFaux : « Non, c'était X. » PUIS une courte explication qui fait comprendre ou retenir — une phrase, deux au grand maximum.\nPERSONNE NE TROUVE (silence, abandon, « on passe », propositions toutes fausses) : tu donnes TOUJOURS la réponse, suivie de la même explication brève. Ne culpabilise pas les joueurs, note que la question était dure, et redescends légèrement le niveau si cela se répète.\nLe savoir doit tenir en une respiration, jamais en paragraphe.\n\n=== P. RYTHME ET ARBITRAGE ===\nRapide sur les transitions et les corrections, jamais par-dessus les joueurs. Évite « on continue ? », « vous êtes prêts ? ».\nTu reviens sur une décision seulement si tu as mal entendu, mal attribué, mal calculé, mal rédigé ou mal corrigé. Sinon la décision reste.\nFRONTIÈRE ABSOLUE : le PERSONNAGE peut être de mauvaise foi, exagérer, s'indigner, dramatiser. L'ARBITRE ne l'est jamais. Le score, la rotation, l'exactitude et les scripts restent froids et exacts, quelle que soit ta performance.\n\n=== Q. FIN DE PARTIE ===\nLe premier à atteindre targetScore gagne ; termine d'abord une mécanique collective en cours. Égalité : une question chacun puis mort subite. Annonce vainqueur et score final dans ta voix de personnage, sans revanche automatique.\nPuis, si des metaNotes[] ont été collectées, restitue-les en quelques lignes.\nPuis liste les faits posés pendant la partie, un par ligne, pour que l'application les mémorise.\n\n=== R. DÉMARRAGE ===\nJoueurs et ordre viennent de CONFIG_APP : ne demande jamais qui joue. Scores à zéro, targetScore fixé, chaque joueur au NIVEAU_INITIAL, plusieurs questions préparées, démarrage immédiat avec PREMIER_JOUEUR. Aucun rappel de règles.\nPREMIÈRE PRISE DE PAROLE, dans l'ordre : 1 une phrase brève invitant à passer en mode vocal si ce n'est pas déjà fait · 2 tu te présentes par ton prénom d'animateur, en une phrase, PLEINEMENT dans ton personnage · 3 tu enchaînes IMMÉDIATEMENT avec la première question. Le tout dans le même message. Tu n'attends aucune confirmation et ne bloques jamais le démarrage.\nAprès le dernier joueur, retour au premier : c'est mécanique, tu ne demandes jamais « c'est à qui ? ».\n\n=== T. MODIFICATION DE PARTIE EN COURS ===\nLes joueurs peuvent changer la composition (« maintenant on joue juste à deux », « Untel arrête », « Untel nous rejoint »).\nDÉCLENCHEMENT : uniquement sur une instruction claire et adressée à toi. Une phrase entendue au vol, une plaisanterie, un prénom prononcé dans une conversation ne déclenchent JAMAIS de changement.\nEXÉCUTION ATOMIQUE — en une seule fois, avant la question suivante :\n T1. Tu reformules le nouveau roster en une phrase pour confirmation : « On continue à deux : Patrick et Mathéo. »\n T2. players[] est remplacé par la nouvelle liste, dans l'ordre annoncé.\n T3. currentPlayerIndex est remis sur le premier joueur de la nouvelle liste.\n T4. Les scores des joueurs conservés sont CONSERVÉS tels quels. Les partants sortent du classement. Un arrivant démarre à 0 et au NIVEAU_INITIAL.\n T5. Les faits déjà posés restent indisponibles.\n T6. À partir de cet instant, un joueur sorti ne doit PLUS JAMAIS être nommé, interrogé, ni compté. Si tu le nommes, tu as échoué à propager le changement.\n\n=== U. REMARQUES SUR LE JEU (canal méta) ===\nSi un joueur formule une remarque sur le produit, le prompt ou ton comportement (« tu n'es pas assez incarné », « il n'y a pas assez de variété ») : tu NE SORS PAS du personnage et tu n'ouvres AUCUNE discussion technique.\n U1. Tu accuses réception en une phrase, dans ta voix : « Noté pour le débrief. »\n U2. Tu stockes la remarque dans metaNotes[].\n U3. Tu appliques immédiatement la correction si elle est applicable (plus d'incarnation, plus de variété…), sans le commenter.\n U4. Tu enchaînes aussitôt sur le jeu.\nSEULE EXCEPTION : une demande explicite d'arrêt (« stoppe le jeu, faisons le débrief ») te fait sortir du rôle et restituer metaNotes[].\n\n=== V. SPOILER, REFUS ET INCONFORT ===\nSi un joueur signale qu'une question le gêne (série non vue, sujet pénible, contenu qu'il ne veut pas entendre, question mal formulée) :\n V1. Tu neutralises immédiatement, sans révéler la réponse.\n V2. Le fait passe en revealedFacts[] : il ne sera pas réutilisé.\n V3. Tu remplaces par une autre question POUR LE MÊME JOUEUR, sur un autre sujet.\n V4. Aucune pénalité, aucun commentaire moralisateur, aucune insistance. Une phrase suffit, puis on joue.\n\n=== W. MÉMOIRE NARRATIVE (narrativeHooks[]) ===\nTu retiens les petits événements de la partie : un running gag, une déclaration amusante, une remontée spectaculaire, une série d'échecs, une rivalité, un joueur qui s'est proclamé expert d'un domaine.\nTu les réemploies pour animer : rappeler un exploit, taquiner quelqu'un sur SA spécialité annoncée, commenter une série, saluer un retour au score. C'est ce qui fait de toi un membre du groupe et non une machine à questions.\nINTERDICTION ABSOLUE : narrativeHooks[] ne touche JAMAIS au score, à la rotation, à l'arbitrage, ni à la difficulté. On ne punit pas un joueur parce qu'il s'est vanté ; on le taquine.\n\n=== X. REGISTRE RÉGIONAL (si PARLER est renseigné) ===\nTu emploies le VOCABULAIRE et les TOURNURES de ce français régional : expressions typiques, mots du quotidien, formules d'enthousiasme.\nINTERDITS FORMELS : aucune imitation phonétique caricaturale, aucune orthographe déformée pour singer un accent, aucune moquerie, aucun stéréotype sur les habitants ou leur culture. C'est un hommage à une variété de la langue, jamais une imitation de personnes.\nSi tu ne peux pas le faire avec justesse et respect, reste en français standard : mieux vaut aucun registre qu'une caricature.\n\n=== Y. PRINCIPE DIRECTEUR ===\nAvant la question : vérifier. Question posée : se taire. Réponse entendue : identifier. Ensuite : arbitrer. Puis : compter. Erreur : expliquer brièvement. Performance : adapter progressivement. Et sur toute la durée, sans jamais relâcher : être quelqu'un.";
/* La diversité des formats est tirée par l'APP, pas demandée au modèle :
   même principe que la graine, qui a fait ses preuves. Jamais plus de deux
   questions classiques d'affilée. */
function planFormats(){
  var mecs=microMecs().slice();
  var names={defi:'Tour Défi',cash:'Cash',vol:'Question avec vol',mystere:'Question Mystère',
             estim:'Estimation',duel:'Duel',quitte:'Quitte ou double',or:'Question en or'};
  var pool=mecs.map(function(id){return names[id];}).filter(Boolean);
  var out=[], since=0;
  for(var i=0;i<8;i++){
    var forceMec = pool.length && (since>=2 || Math.random()<0.34);
    if(forceMec){
      var k=Math.floor(Math.random()*pool.length);
      out.push(pool.splice(k,1)[0]); since=0;
    } else { out.push('classique'); since++; }
  }
  return out;
}
function briefText(){
  /* COUCHE 1 : configuration dynamique venant de l'interface.
     COUCHE 2 : MICRO_PROMPT, le moteur fixe.
     COUCHE 3 : personnalité + consignes issues des options.
     Aucun état de partie ne peut être tenu par l'app : le lien avec l'IA
     est unidirectionnel (un texte copié). Tout l'état vit donc dans le prompt. */
  var team=microTeam();
  var st=MICRO_STYLES.filter(function(s){return s.id===(D.microStyle||'classique');})[0];
  var th=MICRO_THEMES.filter(function(x){return x.id===(D.microTheme||'libre');})[0];

  var hasCtx=function(id){ return ctxs.some(function(x){return x.id===id;}); };
  if(hasCtx('express') && goal===15) goal=8;

  /* Diversité réelle : l'app tire au sort une graine et un plan de domaines.
     Le modèle ne peut pas retomber sur ses réflexes habituels. */
  var DOMS=['histoire','géographie','sciences','astronomie','littérature','philosophie','arts','architecture',
    'cinéma','séries','musique','sport','langue française','inventions','technologie','mythologie','gastronomie',
    'société','culture populaire','logique','énigmes','estimation','nature','chimie','biologie','culture mondiale'];
  var ANGLES=['le détail concret plutôt que la définition','la conséquence plutôt que la date',
    'le contemporain plutôt que le patrimonial','l\'anecdote vérifiable plutôt que le manuel',
    'l\'objet du quotidien plutôt que le monument','ce qui a changé récemment plutôt que ce qui est figé',
    'les seconds rôles plutôt que les figures évidentes'];
  var seed=Math.floor(Math.random()*1e6);
  var prl=MICRO_PARLERS.filter(function(x){return x.id===(D.microParler||'');})[0];
  var pool=DOMS.slice(), plan=[];
  for(var z=0; z<8 && pool.length; z++) plan.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  var angle=ANGLES[Math.floor(Math.random()*ANGLES.length)];
  var cfg='<CONFIG_APP>\n';
  cfg+='HOTE='+hostName()+'\n';
  cfg+='GRAINE_DE_PARTIE='+seed+'\n';
  cfg+='PLAN_DE_VARIETE='+plan.join(' > ')+'\n';
  cfg+='ANGLE_DOMINANT='+angle+'\n';
  cfg+='PLAN_DE_FORMATS='+planFormats().join(' > ')+'\n';
  cfg+='MODE='+(teams?'EQUIPES':'CHACUN_POUR_SOI')+'\n';
  cfg+='JOUEURS='+(team.length?team.join(' > '):'(à demander)')+'\n';
  if(teams){ cfg+='EQUIPE_1='+teams.a.join(', ')+'\nEQUIPE_2='+teams.b.join(', ')+'\n'; }
  cfg+='PREMIER_JOUEUR='+(team[0]||'(à demander)')+'\n';
  cfg+='OBJECTIF='+goal+'\n';
  cfg+='AMBIANCE='+(st?st.label.replace(/[^A-Za-zÀ-ÿ ]/g,'').trim():'Classique')+'\n';
  cfg+='THEME='+(th?th.label.replace(/[^A-Za-zÀ-ÿ0-9\- ]/g,'').trim():'Tous sujets')+'\n';
  cfg+='NIVEAU_INITIAL='+(hasCtx('costaud')?'7':'5')+'\n';
  var lvls=(D.microTeam||[]).map(function(id){
    var p=D.lib.filter(function(x){return x.id===id;})[0];
    if(!p) return null;
    var base=lvlNum(microLvl(id));
    if(hasCtx('costaud')) base=Math.min(8,base+2);
    return p.name+':'+base;
  }).filter(Boolean);
  if(lvls.length) cfg+='NIVEAUX_PAR_JOUEUR='+lvls.join(' · ')+'\n';
  cfg+='INTENSITE_PERSONNAGE='+((st&&st.loud)?'3':(st&&st.txt?'2':'1'))+'\n';
  cfg+='LONGUEUR_REPONSE=COURTE\n';
  cfg+='PARLER='+(prl?prl.label.replace(/[^A-Za-zÀ-ÿ ]/g,'').trim():'(aucun)')+'\n';
  cfg+='CADENCE='+(hasCtx('express')?'RAPIDE':'NORMALE')+'\n';
  cfg+='CONTEXTE='+(hasCtx('voiture')?'VOITURE_BRUIT':'STANDARD')+'\n';
  cfg+='MECANIQUES='+(microMecs().length? MICRO_MECS.filter(function(x){return microMecs().indexOf(x.id)>=0;}).map(function(x){return x.label.replace(/[^A-Za-zÀ-ÿ ]/g,'').trim();}).join(', ') : 'AUCUNE — questions classiques uniquement')+'\n';
  cfg+='TOUCHE_PERSONNELLE='+((D.microCustom||'').trim()||'(aucune)')+'\n';
  cfg+='FAITS_DEJA_POSES='+D.journal.length+'\n';
  cfg+='</CONFIG_APP>\n\n';

  /* CONTRAT DE VOIX en tête : la personnalité était auparavant reléguée à 90 %
     du prompt et introduite comme une simple coloration. Elle ouvre désormais. */
  var voice='=== CONTRAT DE VOIX (à tenir de la première à la dernière seconde) ===\n'+
    'Tu t\'appelles '+hostName()+'. Tu n\'es pas un assistant qui pose des questions : tu es un animateur, et '+hostName()+' est ton nom pour toute la partie.\n'+
    (st&&st.txt? 'TON PERSONNAGE : '+st.txt+'\n' : 'TON PERSONNAGE : animateur classique, chaleureux et net.\n')+
    (prl&&prl.txt? 'TON REGISTRE : '+prl.txt+'\n' : '')+
    'Ce personnage doit s\'entendre DÈS TA PREMIÈRE PHRASE et ne jamais retomber : dans tes annonces, tes transitions, tes corrections, tes commentaires de score, tes célébrations et tes taquineries. Un animateur qui redevient neutre au bout de trois questions a échoué.\n'+
    'Il ne modifie EN REVANCHE jamais : le score, la rotation, l\'arbitrage, l\'exactitude, ni un script de mécanique. Personnage flamboyant, arbitre glacial.\n\n';
  var t=cfg+voice+MICRO_PROMPT;

  /* COUCHE 3 — personnalité et consignes dérivées des options */
  if(st && st.txt) t+='\n\n=== RAPPEL DE PERSONNAGE ===\nTu es '+hostName()+'. '+st.txt+'\nCe rappel est là parce que la tentation, après quelques questions, est de retomber en assistant neutre. Ne retombe pas.';
  if(st && st.loud){
    t+='\n\nNIVEAU D\'INCARNATION : maximal (INTENSITE_PERSONNAGE=3). Sois presque une caricature de présentateur : dramatise absurdement un petit enjeu, installe du suspense, fais semblant d\'être scandalisé par une réponse ratée, célèbre excessivement un beau coup, chambre gentiment, reprends un running gag né pendant la partie, commente une remontée ou une série catastrophique, sois faussement solennel. Invente ta propre personnalité : aucune imitation d\'un animateur réel, aucun tic verbal reconnaissable, aucune copie d\'émission existante. Rappel : cette exubérance ne touche jamais au score ni à la rotation (règles D, H et P).';
  }
  if(ctxs.length) t+='\n\nCONTEXTE ET RYTHME (ces consignes s\'ajoutent à l\'ambiance sans la remplacer ; elles ne modifient aucune règle du moteur) :\n'+
    ctxs.map(function(x){return '- '+x.txt;}).join('\n');
  if(th && th.txt) t+='\n\nTHÈME DOMINANT (remplace la consigne de variété de la section L ; toutes les autres règles restent valables) : '+th.txt;
  if(goal!==15) t+='\n\nOBJECTIF (prioritaire sur toute autre indication d\'objectif) : '+goal+' points.';
  if(teams){
    t+='\n\nMODE ÉQUIPES (adapte les sections G et H : le registre transactionnel porte sur les équipes, tout le reste est inchangé).'+
       '\nÉquipe 1 : '+teams.a.join(', ')+'.'+
       '\nÉquipe 2 : '+teams.b.join(', ')+'.'+
       '\nInterroge toujours un joueur précis, en alternant systématiquement entre les deux équipes et en tournant à l\'intérieur de chaque équipe : currentPlayerIndex reste mécanique. Les points vont à l\'équipe du joueur interrogé. Annonce le score par équipe. Les coéquipiers n\'ont pas le droit de souffler : si quelqu\'un répond à la place du joueur interrogé, la question est perdue pour son équipe et le fait est brûlé. Pour une question avec vol, seule l\'équipe adverse peut tenter après « Vol ouvert ».';
  }
  if(D.microCustom && D.microCustom.trim()) t+='\n\nCONSIGNE LIBRE DES JOUEURS — À RESPECTER TOUT AU LONG DE LA PARTIE. Elle peut porter sur n\'importe quel aspect du jeu : le ton de l\'animateur, le contenu ou le thème des questions, un sujet à privilégier ou à éviter, une règle de rythme, une habitude de la famille. Si elle est ambiguë, applique-la à la fois au ton ET aux questions. Elle ne supprime aucune règle du moteur, mais elle prime sur tes préférences par défaut : '+D.microCustom.trim();
  var recent=D.journal.slice(0,120);
  if(recent.length){
    t+='\n\n=== FAITS DÉJÀ CONSOMMÉS LORS DES PARTIES PRÉCÉDENTES ===\nCharge-les dans askedFacts[] (section I). Ils sont indisponibles, même reformulés :\n\n'+
      recent.map(function(e){return '- '+e.text;}).join('\n')+'\n';
  }
  if(team.length){
    t+='\n\nOn fait un quiz. Les joueurs sont, dans cet ordre : '+team.join(', ')+
       '. Ne demande pas qui joue : initialise l\'état (section R) et démarre immédiatement avec '+team[0]+'.';
  } else {
    t+='\n\nOn fait un quiz';
  }
  return t;
}

var DICE_TYPES=[4,6,8,10,12,20];
var DICE_LAST=null;
function diceCfg(){ if(!D.dice) D.dice={type:6,n:1}; return D.dice; }
function setDiceType(t){ diceCfg().type=t; persist(); openDiceRefresh(); }
function setDiceN(n){ diceCfg().n=Math.max(1,Math.min(6,n)); persist(); openDiceRefresh(); }
function diceFaces(vals,rolling){
  return '<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0 6px">'+
    vals.map(function(v){return '<span class="dieface'+(rolling?' roll':'')+'">'+v+'</span>';}).join('')+'</div>';
}
function diceBody(){
  var c=diceCfg();
  var vals=(DICE_LAST&&DICE_LAST.type===c.type&&DICE_LAST.vals.length===c.n)?DICE_LAST.vals:[];
  var h='<h2 style="margin:2px 0 2px">🎲 Les Dés</h2>'
    ;
  h+= vals.length? diceFaces(vals,false) : '<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0 6px">'+
      Array.apply(null,Array(c.n)).map(function(){return '<span class="dieface" style="color:#d6d3d1">?</span>';}).join('')+'</div>';
  h+= (vals.length&&c.n>1)? '<p style="margin:2px 0 0;font-size:15px;font-weight:800;color:#0f766e">Total : '+vals.reduce(function(a,b){return a+b;},0)+'</p>' : '';
  h+='<button class="btn dice" style="margin-top:12px" onclick="rollDice()">🎲 Lancer</button>';
  h+='<p class="mini" style="margin:14px 0 6px">Type de dé</p><div class="chips" style="justify-content:center">'+
    DICE_TYPES.map(function(t){return '<button class="chip'+(c.type===t?' on':'')+'" onclick="setDiceType('+t+')">d'+t+'</button>';}).join('')+'</div>';
  h+='<p class="mini" style="margin:12px 0 6px">Combien de dés</p><div class="chips" style="justify-content:center">'+
    [1,2,3,4,5,6].map(function(n){return '<button class="chip'+(c.n===n?' on':'')+'" onclick="setDiceN('+n+')">'+n+'</button>';}).join('')+'</div>';
  h+='<button class="sm" style="width:100%;margin-top:14px;background:var(--card)" onclick="document.getElementById(\'dish\').remove();whoStart()">🎯 Plutôt : qui commence ?</button>';
  h+='<button class="btn grey" style="margin-top:8px" onclick="document.getElementById(\'dish\').remove()">Fermer</button>';
  return h;
}
function openDice(){
  var el=document.createElement('div'); el.className='sheet'; el.id='dish';
  el.onclick=function(){ try{el.remove();}catch(e){} };
  el.innerHTML='<div class="in" onclick="event.stopPropagation()" style="text-align:center"><div class="grab"></div><div id="dicebody">'+diceBody()+'</div></div>';
  document.body.appendChild(el);
}
function openDiceRefresh(){ var b=document.getElementById('dicebody'); if(b) b.innerHTML=diceBody(); }
function vibe(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms||18); }catch(e){} }
function rollDice(){
  vibe(24);
  var c=diceCfg(), b=document.getElementById('dicebody'); if(!b) return;
  function draw(){ var out=[]; for(var i=0;i<c.n;i++) out.push(1+Math.floor(Math.random()*c.type)); return out; }
  var ticks=0;
  var timer=setInterval(function(){
    ticks++;
    var tmp=draw();
    var zone=b.querySelector('div[style*="flex-wrap"]');
    if(zone) zone.outerHTML=diceFaces(tmp,true);
    if(ticks>=6){
      clearInterval(timer);
      DICE_LAST={type:c.type,vals:draw()};
      try{ hit(PENTA[3],{dur:.16,vol:.28,cut:6000,rev:.25}); hit(PENTA[5],{delay:.07,dur:.3,vol:.24,cut:7000,rev:.3}); }catch(e){}
      openDiceRefresh();
    }
  },70);
  // secours si l'environnement ne gère pas les timers (tests) : résultat immédiat
  if(typeof setInterval!=='function'){ DICE_LAST={type:c.type,vals:draw()}; openDiceRefresh(); }
}

/* Deux axes distincts : la PERSONNALITÉ (un seul choix) et le CONTEXTE/RYTHME
   (plusieurs choix cumulables). Avant, tout partageait microStyle : choisir
   « En voiture » effaçait « Taquin ». */
function microCtx(){
  if(!D.microCtx) D.microCtx=[];
  var legacy=D.microStyle;
  if(legacy){
    var s0=MICRO_STYLES.filter(function(s){return s.id===legacy;})[0];
    if(s0 && s0.kind!=='personnalite'){
      if(D.microCtx.indexOf(legacy)<0) D.microCtx.push(legacy);
      D.microStyle='classique'; persist();
    }
  }
  return D.microCtx;
}
function toggleMicroCtx(id){
  var c=microCtx(), i=c.indexOf(id);
  if(i>=0) c.splice(i,1); else c.push(id);
  D.microCtx=c; persist(); render();
}
function microCtxStyles(){
  var c=microCtx();
  return MICRO_STYLES.filter(function(s){return c.indexOf(s.id)>=0;});
}

function microToCoupe(id){

function microWin(i){

    var win=i===0?teams.a:teams.b, lose=i===0?teams.b:teams.a;
    players=win.map(function(n){return {name:n,score:null};}).concat(lose.map(function(n){return {name:n,score:null};}));
  } else {
    var names=microTeam();
    if(!names.length){ toast('Aucun joueur'); return; }

  }
  D.micro.unshift({id:uid(), date:today(), players:players});
  reviewMoment(); persist(); S.microSheet=false; S.microDetail=false;
  toast((players[0]?players[0].name:'Résultat')+' gagne 🏆'); render();

function microSave(){
  var date=document.getElementById('mqd').value||today();
  var raw=document.getElementById('mqr').value.split('\n').map(function(s){return s.replace(/^\s*\d+[.)\-]\s*/,'').trim();}).filter(Boolean);
  if(!raw.length){toast('Recopie au moins un joueur');return;}
  var players=[];
  raw.forEach(function(line){
    var mtc=line.match(/^(.*?)[\s:.\-–]+(-?\d+(?:[.,]\d+)?)\s*(?:pts?|points?)?$/i);
    if(mtc){ players.push({name:mtc[1].trim(), score:parseFloat(mtc[2].replace(',','.'))}); }
    else { players.push({name:line.replace(/[\s:.\-–]+$/,'').trim(), score:null}); }
  });
  players=players.filter(function(p){return p.name;});
  if(!players.length){toast('Format non reconnu');return;}
  var haveScores=players.some(function(p){return p.score!==null;});
  if(haveScores) players.sort(function(a,b){return (b.score===null?-1:b.score)-(a.score===null?-1:a.score);});
  D.micro.unshift({id:uid(), date:date, players:players});
  reviewMoment(); persist(); S.microSheet=false; toast('Résultat enregistré 🏆'); render();
  try{ microOfferCoupe(); }catch(e){}
}

function microAgg(){
  var agg={};
  D.micro.forEach(function(g){
    var win=g.players[0];
    g.players.forEach(function(p){
      var k=fp(p.name); if(!k) return;
      if(!agg[k]) agg[k]={name:p.name, games:0, wins:0, best:null};
      agg[k].games++;
      if(win && fp(win.name)===k) agg[k].wins++;
      if(p.score!==null && (agg[k].best===null || p.score>agg[k].best)) agg[k].best=p.score;
    });
  });
  var list=[]; for(var k in agg) list.push(agg[k]);
  list.sort(function(a,b){return b.wins-a.wins||b.games-a.games;});
  return list;
}

/* ---- MUR DES CHAMPIONS : agrégation transverse des 3 jeux ---- */
function championsAgg(){
  var agg={};
  function slot(name){ var k=fp(name); if(!k) return null;
    if(!agg[k]) agg[k]={name:name, coupes:0, coupeManches:0, quizWins:0, quizGames:0, duels:0, duelWins:0}; return agg[k]; }
  // La Coupe : titres (champion cumul, toutes parties) + manches gagnées
  D.matches.forEach(function(m){
    var r=rank(m,function(){return true;}); if(!r.count) return;
    r.byCumul.forEach(function(p){ var s=slot(p.name); if(s) s.coupeManches+=p.wins; });
    var lead=leaders(r.byCumul,'points',m.winRule);
    m.players.forEach(function(p){ if(lead.indexOf(p.id)>=0){ var s=slot(p.name); if(s) s.coupes++; } });
  });
  // Le Micro
  D.micro.forEach(function(g){
    g.players.forEach(function(p,i){ var s=slot(p.name); if(s){ s.quizGames++; if(i===0) s.quizWins++; } });
  });
  // Tic-Tac
  D.tictac.forEach(function(d){
    d.players.forEach(function(p){ var s=slot(p.name); if(s){ s.duels++; if(d.winner&&fp(d.winner)===fp(p.name)) s.duelWins++; } });
  });
  /* Le total unique mélangeait des victoires incomparables : une partie de
     Uno entière valait autant qu'une manche de Tic-Tac de 30 secondes.
     On garde les couronnes pour l'ordre d'affichage, mais chaque discipline
     est désormais restituée séparément (voir renderChampions). */
  var list=[]; for(var k in agg){ var a=agg[k];
    a.crowns=a.coupes+a.quizWins+a.duelWins;
    a.parties=a.coupes+a.quizGames+a.duels;
    list.push(a); }
  list.sort(function(a,b){return b.crowns-a.crowns || (b.coupeManches+b.quizGames+b.duels)-(a.coupeManches+a.quizGames+a.duels);});

/* Palmarès par discipline : comparer ce qui est comparable. */
function champByGame(){
  var out=[];
  var byGame={};
  D.matches.forEach(function(m){
    var r=rank(m,function(){return true;}); if(!r.count) return;
    var g=gameOf(m)||'Autre';
    if(!byGame[g]) byGame[g]={};
    var lead=leaders(r.byCumul,'points',m.winRule);
    m.players.forEach(function(p){
      if(!byGame[g][p.name]) byGame[g][p.name]={name:p.name,wins:0,played:0};
      byGame[g][p.name].played++;
      if(lead.indexOf(p.id)>=0) byGame[g][p.name].wins++;
    });
  });
  for(var g in byGame){
    var arr=[]; for(var n in byGame[g]) arr.push(byGame[g][n]);
    arr.sort(function(a,b){return b.wins-a.wins || b.played-a.played;});
    if(arr.length) out.push({game:g, players:arr});
  }
  var tt={};
  D.tictac.forEach(function(d){ (d.players||[]).forEach(function(p){
    if(!tt[p.name]) tt[p.name]={name:p.name,wins:0,played:0};
    tt[p.name].played++; if(d.winner&&fp(d.winner)===fp(p.name)) tt[p.name].wins++; }); });
  var ttArr=[]; for(var n2 in tt) ttArr.push(tt[n2]);
  if(ttArr.length){ ttArr.sort(function(a,b){return b.wins-a.wins||b.played-a.played;}); out.push({game:'⏱️ Tic-Tac', players:ttArr}); }
  var mq={};
  D.micro.forEach(function(g2){ (g2.players||[]).forEach(function(p,i){
    if(!mq[p.name]) mq[p.name]={name:p.name,wins:0,played:0};
    mq[p.name].played++; if(i===0) mq[p.name].wins++; }); });
  var mqArr=[]; for(var n3 in mq) mqArr.push(mq[n3]);
  if(mqArr.length){ mqArr.sort(function(a,b){return b.wins-a.wins||b.played-a.played;}); out.push({game:'🎙️ Le Micro', players:mqArr}); }
  out.sort(function(a,b){ return b.players.reduce(function(s,x){return s+x.played;},0)-a.players.reduce(function(s,x){return s+x.played;},0); });
  return out;
}

function playBuzz(kit){

    hit(760,{dur:.45,vol:.6,bend:.12,wave:'sine',cut:4000,rev:.3});

/* ============================== PALMARÈS ==========================
   Agrège toutes les parties de La Coupe. Les points de jeux différents ne
   sont pas comparables : on classe donc par TITRES (meneur d'une partie)
   puis par victoires de manches. Joueurs agrégés par nom (insensible à la
   casse et aux accents). */
var PAL={year:String(new Date().getFullYear())};
function palKeep(y){
  if(y==='all') return function(){return true;};
  if(y==='d1'||y==='d7'||y==='d30'){
    var n=y==='d1'?1:y==='d7'?7:30;
    var lim=new Date(Date.now()-(n-1)*864e5).toISOString().slice(0,10);
    return function(r){return r.date>=lim;};
  }
  return function(r){return r.date.slice(0,4)===y;};
}
function palYears(){
  var ys={};
  D.matches.forEach(function(m){m.rounds.forEach(function(r){ys[r.date.slice(0,4)]=1;});});
  return Object.keys(ys).sort().reverse();
}
function palData(year){
  var agg={};
  function slot(name){
    var k=fp(name);
    if(!agg[k]) agg[k]={name:name,titles:0,wins:0,played:0,matches:0};
    return agg[k];
  }
  if(year===undefined) year=PAL.year;
  var keep=palKeep(year);
  D.matches.forEach(function(m){
    var r=rank(m,keep);
    if(!r.count) return;
    var seen={};
    m.players.forEach(function(p){
      var st=r.byCumul.filter(function(x){return x.id===p.id;})[0];
      if(!st||!st.played) return;
      var s=slot(p.name); if(!seen[fp(p.name)]){s.matches++;seen[fp(p.name)]=1;}
      s.wins+=st.wins; s.played+=st.played;
    });
    var lead=leaders(r.byCumul,'points',m.winRule);
    m.players.forEach(function(p){ if(lead.indexOf(p.id)>=0) slot(p.name).titles++; });
  });
  var list=[]; for(var k in agg) list.push(agg[k]);
  list.sort(function(a,b){return b.titles-a.titles||b.wins-a.wins||b.played-a.played;});
  return list;
}

/* =============================== CHRONO ===========================
   Duel de temps : chaque joueur a son compte à rebours,
   en pause quand ce n'est pas son tour. Bon = il garde la main ; Faux = au
   suivant. À zéro = éliminé. L'animateur pilote. Rien n'est persisté : une
   manche de chrono est éphémère (mais les réglages, eux, sont mémorisés). */
var CH = null;              // état de la manche en cours (null = écran de config)
var chTick = null;          // intervalle
var __audio=null,__comp=null;
function audioCtx(){
  var C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
  if(!__audio){ __audio=new C();
    try{ __comp=__audio.createDynamicsCompressor();
      __comp.threshold.value=-20; __comp.knee.value=12; __comp.ratio.value=14;
      __comp.attack.value=.002; __comp.release.value=.18;
      __comp.connect(__audio.destination);
    }catch(e){ __comp=null; }
  }
  var a=__audio; if(a.state==='suspended'){ try{a.resume();}catch(e){} }
  return a;
}
function outNode(a){ return __comp||a.destination; }
/* ── Réverbération courte : c'est ce qui distingue un son "app 2026"
      d'un bip de vieux téléphone. Un son sec paraît daté. ── */
var __rev=null;
function revNode(a){
  if(__rev) return __rev;
  try{
    var len=Math.floor(a.sampleRate*1.1), buf=a.createBuffer(2,len,a.sampleRate);
    for(var c=0;c<2;c++){ var d=buf.getChannelData(c);
      for(var i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); } }
    var cv=a.createConvolver(); cv.buffer=buf;
    var wet=a.createGain(); wet.gain.value=.34;
    cv.connect(wet); wet.connect(outNode(a));
    __rev=cv;
  }catch(e){ __rev=null; }
  return __rev;
}
/* Voix percussive moderne : attaque immédiate, extinction rapide, filtrée, réverbérée.
   C'est la signature sonore des apps actuelles (pop, blip, marimba). */
function sndOn(){ return D.sound!==false; }
function hit(freq,opts){ if(!sndOn()) return;
  if(D.fx===0) return;
  opts=opts||{};
  try{
    var a=audioCtx(); if(!a) return;
    var t=a.currentTime+(opts.delay||0);
    var dur=opts.dur||.22, vol=opts.vol||.4;
    var o=a.createOscillator(); o.type=opts.wave||'sine';
    o.frequency.setValueAtTime(freq,t);
    if(opts.bend) o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*opts.bend),t+dur*.9);
    // synthèse FM : donne le timbre marimba/cloche (bien plus riche qu'une sinusoïde nue)
    if(opts.fm){
      var m=a.createOscillator(), mg=a.createGain();
      m.frequency.value=freq*(opts.fmRatio||2.4); mg.gain.value=freq*(opts.fm||.6);
      m.connect(mg); mg.connect(o.frequency); m.start(t); m.stop(t+dur);
    }
    var g=a.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+(opts.atk||.006));   // attaque nette
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);          // extinction percussive
    var f=a.createBiquadFilter();
    f.type=opts.filter||'lowpass'; f.frequency.value=opts.cut||5200; f.Q.value=opts.q||.9;

function perc(opts){ if(!sndOn()) return;

    if(opts.f2) f.frequency.exponentialRampToValueAtTime(opts.f2,t+dur); // balayage = whoosh
    var g=a.createGain(); g.gain.value=opts.vol||.3;

  h+='<div class="card"><h2><span class="stepn">4</span>Questions <span style="font-weight:400;font-size:12px;color:#a8a29e">(facultatif)</span></h2>'+

  h+='<button class="btn tictac" onclick="chStart()">⏱️ Démarrer la partie</button>';
  /* Historique : rendu supprimable (chDelDuel existait mais n'était branché nulle part,

       (S.chHist?'▾':'›')+' Derniers duels ('+D.tictac.length+')</button>';
    if(S.chHist){
      h+='<div class="card" style="margin-top:8px">'+D.tictac.slice(0,8).map(function(d){

          '<span class="mini" style="width:64px;flex-shrink:0">'+fr(d.date)+'</span>'+
          '<b style="flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(d.winner?'👑 '+esc(d.winner):'—')+'</b>'+
          (d.players&&d.players[0]?'<span class="mini" style="flex-shrink:0">✓ '+(d.players[0].good||0)+' · ✗ '+(d.players[0].bad||0)+'</span>':'')+

function chAv(i){ var s=chSettings(); if(!s.players[i]||!s.players[i].trim()){ s.players[i]='Joueur '+(i+1); } openAv(libIdForName(s.players[i])); }
function chSetSecs(v){ chSettings().secs=Math.min(1800,Math.max(5,v||60)); persist(); render(); }
function chSetPass(v){ chSettings().pass=v; persist(); render(); }
function chSetPlayerSecs(i,v){
  var s=chSettings(); if(!s.custom) s.custom={};
  var n=parseInt(v);
  if(!v||isNaN(n)||n<=0){ delete s.custom[i]; } else { s.custom[i]=Math.max(5,n); }
  persist(); render();
}
function chRename(i,v){ chSettings().players[i]=v.trim()||('Joueur '+(i+1)); persist(); }
function chAddP(){ var s=chSettings(); s.players.push('Joueur '+(s.players.length+1)); persist(); render(); }
function chDelP(i){ var s=chSettings(); if(s.players.length>2){ s.players.splice(i,1); if(s.custom) s.custom={}; persist(); render(); } }
function chSound(b){ chSettings().sound=b; persist(); render(); }

/* ---- Démarrage d'une manche ---- */
/* Le duel vit dans D : un appel entrant, un verrouillage d'écran ou un
   rechargement ne doit JAMAIS effacer une partie en cours. */
function chPersist(){ try{ D.live=CH?JSON.parse(JSON.stringify(CH)):null; persist(); }catch(e){} }
function chRestore(){
  try{
    if(D.live && D.live.players && D.live.players.length && D.live.winner===null){
      CH=D.live; CH.running=false; return true;
    }
  }catch(e){}
  return false;
}
function chStart(){
  try{ chSettings().players.forEach(function(p){ p.bad=0; }); }catch(e){}
  var s=chSettings();
  CH={ players:s.players.map(function(n,i){var t=(s.custom&&s.custom[i])?s.custom[i]:s.secs; return {name:n, left:t, out:false, good:0, start:t};}),
       active:0, running:false, sound:s.sound, total:s.secs, winner:null };
  chStopTick(); chPersist();
  render();
}
function chStopTick(){ if(chTick){clearInterval(chTick); chTick=null;} }
function chRun(){
  if(CH.running) return;
  if(!CH.startedOnce){ CH.startedOnce=true; chCountdown(function(){ chRunNow(); }); return; }
  chRunNow();
}
function chCountdown(done){
  var ov=document.createElement('div'); ov.id='cnt321';
  ov.style.cssText='position:fixed;inset:0;background:rgba(6,78,59,.92);z-index:60;display:flex;align-items:center;justify-content:center';
  ov.innerHTML='<div id="cnum" style="font-size:110px;font-weight:800;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.35)">3</div>';
  document.body.appendChild(ov);
  var steps=[['3',760],['2',760],['1',760],['GO !',1180]], i=0;
  function next(){
    if(i>0){ var el=document.getElementById('cnum'); if(el){ el.textContent=steps[i][0]; el.style.fontSize=steps[i][0]==='GO !'?'72px':'110px'; } }
    if(CH&&CH.sound){
      if(i===3){ // GO !
        sub(110,.5,.6);
        [0,2,4,5].forEach(function(idx,k){ hit(PENTA[idx],{delay:k*.05,dur:.6,vol:.34,fm:.7,fmRatio:3.01,cut:7000,rev:.45}); });
        perc({dur:.2,f1:2400,f2:800,vol:.32,rev:.45});
      } else {   // 3 · 2 · 1
        hit(PENTA[2],{dur:.14,vol:.3,fm:.4,fmRatio:2.01,cut:4200,rev:.22});
        perc({dur:.05,f1:1800,vol:.14,rev:.15});
      }
    }
    i++;
    if(i<steps.length){ setTimeout(next,600); }
    else setTimeout(function(){ try{ov.remove();}catch(e){} if(done)done(); },550);
  }
  next();
}
function chRunNow(){
  if(CH.running) return;
  CH.running=true; chStopTick();
  var last=Date.now();
  var __psave=0;
  chTick=setInterval(function(){
    var now=Date.now(), dt=(now-last)/1000; last=now;
    if(now-__psave>2000){ __psave=now; chPersist(); }
    var p=CH.players[CH.active];
    var beforeSec=Math.ceil(p.left);
    p.left-=dt;
    var afterSec=Math.ceil(p.left);
    // tension sonore façon plateau TV : tic-tac sous 10 s, plus pressant sous 5 s
    if(CH.sound && afterSec<beforeSec && afterSec>0){
      if(afterSec<=5){ hit(1245,{dur:.07,vol:.3,cut:5000,rev:.12,atk:.002}); perc({dur:.03,f1:2600,vol:.1,rev:.1}); }
      else if(afterSec<=10){ hit(830,{dur:.06,vol:.2,cut:3600,rev:.1,atk:.002}); }
    }
    if(p.left<=0){ p.left=0; p.out=true; if(CH.sound) chBeep(); chStopTick(); CH.running=false;
      var rest=chAlive().length;
      if(rest>1){ toast('⏰ '+p.name+' éliminé — encore '+rest+' en course'); speak(p.name+' éliminé'); }
      chAdvance(true); }
    render();
  },100);
  render();
}
function chPause(){ CH.running=false; chStopTick(); chPersist(); render(); }
function chAlive(){ return CH.players.filter(function(p){return !p.out;}); }
function chNextIdx(from){
  var n=CH.players.length;
  for(var k=1;k<=n;k++){ var i=(from+k)%n; if(!CH.players[i].out) return i; }
  return -1;
}
function chAdvance(auto){
  var alive=chAlive();
  if(alive.length<=1){ CH.winner = alive.length? alive[0].name : null; CH.running=false; chStopTick(); if(CH.winner) speak(CH.winner+' remporte le duel'); render(); return; }
  var ni=chNextIdx(CH.active);
  if(ni>=0){ CH.active=ni; speak('À toi '+CH.players[ni].name); }
  CH.running=false; chStopTick();
  if(auto) render();
}
/* Boutons animateur */
function chGood(){
  if(chSettings().qTheme && CH && !CH.winner) setTimeout(function(){ if(CH&&!CH.winner) qbankNext(); },0);
  if(CH.winner) return;
  CH.players[CH.active].good++; chPersist();
  hit(PENTA[3],{dur:.16,vol:.34,fm:.5,fmRatio:3.01,cut:6000,rev:.28});
  hit(PENTA[5],{delay:.075,dur:.3,vol:.3,fm:.6,fmRatio:3.01,cut:7000,rev:.35});
  perc({dur:.06,f1:3000,vol:.12,rev:.2});
  chRun();
}
/* Mode « la bonne réponse passe la main » : le succès fait tourner */
function chPassGood(){
  if(CH.winner) return;
  CH.players[CH.active].good++; chPersist();
  hit(PENTA[3],{dur:.16,vol:.34,fm:.5,fmRatio:3.01,cut:6000,rev:.28});
  hit(PENTA[5],{delay:.075,dur:.3,vol:.3,fm:.6,fmRatio:3.01,cut:7000,rev:.35});
  chStopTick(); CH.running=false;
  chAdvance(false);
  if(!CH.winner){ setTimeout(function(){ swoosh(); },120); chRun(); } else render();
}
/* …et l'échec le laisse en difficulté sur son propre temps */
function chKeepWrong(){
  try{ var _p=CH.players[CH.active]; if(_p) _p.bad=(_p.bad||0)+1; }catch(e){}
  if(CH.winner) return;
  sub(140,.2,.45);
  hit(196,{dur:.26,vol:.3,bend:.62,wave:'triangle',cut:1200,rev:.25});
  chRun();
}
function chSkip(){
  if(chSettings().qTheme && CH && !CH.winner) setTimeout(function(){ if(CH&&!CH.winner) qbankNext(); },0);
  if(!CH||CH.winner) return;
  chStopTick(); CH.running=false;
  perc({dur:.08,f1:500,f2:300,vol:.14,filter:'lowpass'});
  chAdvance(false);
  if(!CH.winner){ setTimeout(function(){ swoosh(); },140); chRun(); } else render();
}
function chWrong(){
  if(chSettings().qTheme && CH && !CH.winner) setTimeout(function(){ if(CH&&!CH.winner) qbankNext(); },0);
  chStopTick(); CH.running=false;
  sub(140,.2,.45);
  hit(196,{dur:.26,vol:.3,bend:.62,wave:'triangle',cut:1200,rev:.25});
  perc({dur:.1,f1:600,f2:220,vol:.2,filter:'lowpass',rev:.2});
  var pw=CH.players[CH.active]; if(pw) pw.bad=(pw.bad||0)+1;
  chAdvance(false);
  if(!CH.winner){ setTimeout(function(){ swoosh(); },140); chRun(); } else render();
}
/* whoosh : la main passe d'un joueur à l'autre — on l'entend, on le voit */
function swoosh(){
  /* Vrai whoosh : bruit filtré balayé vers le haut + petit blip de repère */
  perc({dur:.26,f1:400,f2:3600,vol:.26,filter:'bandpass',q:1.4,decay:1.2,rev:.3});
  hit(PENTA[3],{delay:.1,dur:.16,vol:.2,fm:.4,cut:5000,rev:.25});
}
function chJump(i){
  if(!CH||CH.winner!==null) return;
  if(!CH.players[i]||CH.players[i].out||i===CH.active) return;
  var wasRunning=CH.running;
  chStopTick(); CH.running=false; CH.active=i;
  swoosh();
  speak('À toi '+CH.players[i].name);
  if(wasRunning) chRun(); else render();
}
function chReset(){ chStopTick(); CH=null; render(); }

/* ---- Écran de jeu ---- */
function fmtT(sec){ sec=Math.max(0,Math.ceil(sec)); var m=Math.floor(sec/60), s=sec%60; return m+':'+(s<10?'0':'')+s; }
function chGame(){
  var p=CH.players[CH.active];

  if(chSettings().qTheme && CH.winner===null){
    if(!CH.q){ var q0=qbankPick(); if(q0){ CH.q=q0; CH.qUsed=(CH.qUsed||[]).concat([q0.q]); } }

    }
  }

  if(CH.winner!==null || chAlive().length<=1){
    var w = CH.winner!==null ? CH.winner : (chAlive()[0]&&chAlive()[0].name);
    var conf='<div class="confetti" style="position:absolute;inset:0;pointer-events:none;overflow:hidden">'+
      ['🎉','🏆','⭐️','🎊','✨','🥇'].map(function(e,i){return '<span style="left:'+(8+i*15)+'%;animation-delay:'+(i*.35)+'s">'+e+'</span>';}).join('')+'</div>';
    return '<div class="card" style="text-align:center;padding:28px 16px;position:relative;overflow:hidden">'+conf+

      (function(){
        /* Tableau de fin : podium, taux de réussite et comparaison — pas
           seulement le nombre de bonnes réponses. */
        var srt=CH.players.slice().sort(function(a,b){ return b.good-a.good || (a.bad||0)-(b.bad||0); });
        var champ=srt[0], tot=CH.players.reduce(function(s,x){return s+x.good+(x.bad||0);},0);
        var best=Math.max(1,srt[0].good);
        var med=['🥇','🥈','🥉'];
        return '<p class="mini" style="margin:0">'+
            (champ&&champ.good? '✓ '+champ.good+' bonne'+(champ.good>1?'s':'')+' réponse'+(champ.good>1?'s':'') : 'dernier joueur en course')+
            (tot? ' · '+pl(tot,'question')+' en tout' : '')+'</p>'+
          '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">'+
          podiumBoard(srt.map(function(p){
            var t=p.good+(p.bad||0);
            return {name:p.name, ratio:p.good/best,
              main:'<b style="color:#059669">✓ '+p.good+'</b> <b style="color:#9f1239;font-weight:600">✗ '+(p.bad||0)+'</b>'+(t?' <span style="color:#a8a29e;font-size:11.5px">'+Math.round(p.good/t*100)+'%</span>':'')};
          }))+
          '</div></div>'; })()+
      '<p class="mini" style="text-align:center;color:#059669;margin-top:12px">✓ Ajoutée au 🏅 Mur des champions</p>'+
      '<button class="sm" style="width:100%;margin-top:8px;background:var(--card)" onclick="chToCoupe()">➕ Compter aussi dans une partie de La Coupe</button>'+
      '<button class="btn" style="margin-top:8px" onclick="chStart()">Rejouer</button>'+
      '<button class="btn grey" style="margin-top:8px" onclick="chReset()">Modifier les réglages</button>';
  }

  var alive=chAlive().length;
  var resumed = !CH.running && CH.players.some(function(p){return p.good>0 || p.left<(p.start||CH.total);});
  var nCol = CH.players.length<=4 ? 'n'+CH.players.length : 'nx';
  var maxGood = Math.max.apply(null, CH.players.map(function(x){return x.good;}));

  var h=qBlock+'<div class="card" style="padding:9px 12px;margin-bottom:10px;background:var(--am-l);border-color:var(--am);text-align:center">'+
    '<p style="margin:0;font-size:13px;color:#92400e"><b>\uD83D\uDC65 '+alive+' en course</b> \u00B7 \u00E0 z\u00E9ro seconde on est \u00E9limin\u00E9 \u00B7 <b>le dernier debout gagne</b> \uD83C\uDFC6</p></div>';

  // Qui a la main : gros titre lisible de loin
  h+='<div class="turnbar"><div class="st">'+(CH.running?'\u23F1 \u00E0 lui de jouer':'\u23F8 en pause')+'</div>'+
     '<div class="nm" style="color:'+col+'">'+esc(p.name)+'</div></div>';

  // ARÈNE : une colonne par joueur/équipe, remplie par son temps restant
  h+='<div class="duel '+nCol+'">';
  CH.players.forEach(function(pl,i){
    var base = pl.start || CH.total;

    var cls = 'lane'+(live?' live':'')+(pl.out?' ko':'')+(!pl.out&&pl.left<=5?' danger':(!pl.out&&pl.left<=20?' warn':''));
    var bg = pl.out ? '#e7e5e4' : (pl.left<=5 ? 'linear-gradient(180deg,#fecdd3,#fda4af)' : pl.left<=20 ? 'linear-gradient(180deg,#fde68a,#fcd34d)' : 'linear-gradient(180deg,#a7f3d0,#6ee7b7)');
    var lead = (!pl.out && pl.good>0 && pl.good===maxGood);

    var ph=avPhotoOf(pl.name);
    var ring='<div class="ring"><svg viewBox="0 0 100 100">'+

       '</div>';
  });
  h+='</div>';

             :((chSettings().pass||'wrong')==='both'?'tu d\u00E9cides quand la main passe':'il garde la main tant qu\'il r\u00E9pond juste');
  h+='<p class="mini" style="text-align:center;margin:-4px 0 10px">L\'anneau se vide en direct \u00B7 '+passLbl+' \u00B7 touche un joueur pour lui donner la main.</p>';

  }
  h+='<button class="sm" style="width:100%;margin-top:8px;background:var(--card)" onclick="chSkip()">⏭ Passer sans compter</button>';


  // barre de comparaison des bonnes réponses
  var maxG=Math.max(1,Math.max.apply(null,CH.players.map(function(p){return p.good;})));
  if(CH.players.some(function(p){return p.good>0 || (p.bad||0)>0;})){

    CH.players.slice().sort(function(a,b){return b.good-a.good;}).forEach(function(pl){
      var pct=Math.round(pl.good/maxG*100);
      var nb=pl.bad||0, tot=pl.good+nb;
      h+='<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px"><span style="display:flex;align-items:center;gap:6px">'+av(pl.name,'sm')+esc(pl.name)+'</span><b><span style="color:#059669">✓ '+pl.good+'</span> <span style="color:#9f1239;font-weight:600">✗ '+nb+'</span>'+(tot?' <span style="color:#a8a29e;font-weight:500;font-size:11.5px">'+Math.round(pl.good/tot*100)+'%</span>':'')+'</b></div>'+
         '<div style="height:8px;background:var(--bg);border-radius:99px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#059669,#34d399);border-radius:99px"></div></div></div>';
    });
    h+='</div>';
  }
  /* Zone de sortie : regroupée, en bas, séparée des actions de jeu.
     Avant, « Terminer », « Abandonner » et « Nouvelle manche » étaient éparpillés
     entre les boutons d'animation — on ne savait plus lequel faisait quoi. */
  h+='<div class="card" style="margin-top:14px;background:var(--bg)">'+
     '<label class="lb">Arrêter cette manche</label>'+
     '<button class="sm g" style="width:100%;margin-bottom:7px" onclick="chFinishNow()">🏁 Terminer et désigner le vainqueur</button>'+
     
     '<button class="sm" style="width:100%;color:#9f1239" onclick="chAbandon()">✕ Abandonner sans compter</button></div>';
  return h;
}

render();

/* Fonctionnement hors réseau (utile en voiture) + détection de mise à jour */
function showUpdateBar(){
  if(document.getElementById('updbar')) return;
  var d=document.createElement('div'); d.id='updbar'; d.className='updbar';
  d.innerHTML='<span>🔄 Nouvelle version prête</span><button id="updbtn">Mettre à jour</button>';
  document.body.appendChild(d);
  document.getElementById('updbtn').onclick=function(){ try{location.reload();}catch(e){} };
}
if('serviceWorker' in navigator){
  var __hadController = !!navigator.serviceWorker.controller;
  var __reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(__reloaded) return;
    // Un nouveau service worker a pris le contrôle. Si l'app tournait déjà
    // (mise à jour pendant l'usage), on propose de recharger — sans surprise.
    if(__hadController) showUpdateBar();
    __reloaded=true;
  });
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      if(reg.waiting && navigator.serviceWorker.controller) showUpdateBar();
      reg.addEventListener('updatefound',function(){
        var nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange',function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller) showUpdateBar();
        });
      });
    }).catch(function(){});
  });
}
</script>
