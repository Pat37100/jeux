<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="En Jeux">
<title>En Jeux — votre maître du jeu de poche</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="description" content="En Jeux : trois jeux dans votre poche — scores, duel de temps et quiz animé. En famille, entre amis, en voiture.">
<style>
  :root{
    --bg:#f5f5f4; --card:#fff; --line:#e7e5e4; --ink:#1c1917; --mut:#78716c; --soft:#78716c;
    --gr:#059669; --gr-l:#ecfdf5; --gr-b:#a7f3d0; --am:#f59e0b; --am-l:#fffbeb; --ro:#e11d48; --ro-l:#fff1f2;
  }
  /* ── Mode sombre : on joue le soir, l'iPhone est souvent en sombre.
        Un écran blanc à table éblouit et fatigue. Suit le réglage du téléphone. ── */
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0c0a09; --card:#1c1917; --line:#292524; --ink:#f5f5f4; --mut:#a8a29e; --soft:#a8a29e;
      --gr:#10b981; --gr-l:#052e21; --gr-b:#065f46; --am:#f59e0b; --am-l:#2a1e05; --ro:#f43f5e; --ro-l:#2d0b14;
    }
    body{background:var(--bg);color:var(--ink)}
    header{background:rgba(28,25,23,.94) !important;border-bottom-color:var(--line)}
    nav{background:rgba(28,25,23,.96) !important;border-top-color:var(--line)}
    .card{background:var(--card);border-color:var(--line)}
    input,textarea,select{background:#292524 !important;color:var(--ink) !important;border-color:#44403c !important}
    input::placeholder,textarea::placeholder{color:#78716c}
    .sm{background:#292524;border-color:#44403c;color:var(--ink)}
    .chip{background:#292524;border-color:#44403c;color:var(--ink)}
    .chip.on{background:var(--gr-l);border-color:var(--gr);color:#6ee7b7}
    .tool{background:var(--card);border-color:var(--line)}
    .rank,.hist,.plr{background:#231f1d}
    .lane{background:var(--card);border-color:var(--line)}
    .ring .face{background:#292524}
    .gtab th{background:#231f1d;color:var(--mut)}
    .gtab .stick{background:var(--card);box-shadow:1px 0 0 var(--line)}
    .gtab thead .stick{background:#231f1d}
    .gtab td,.gtab th{border-bottom-color:#292524}
    .gtab .tot{background:#0f2a1f;color:#6ee7b7;box-shadow:-1px 0 0 var(--line)}
    .gtab .win{background:#0f2a1f;color:#6ee7b7}
    .gtab tr.lead .stick{background:linear-gradient(90deg,#2a1e05,var(--card))}
    .gtab .nmbar{background:#292524}
    .sheet .in{background:var(--card);color:var(--ink)}
    .empty{color:var(--mut)}
    .stp{background:#292524;border-color:#44403c;color:var(--ink)}
    .icobtn{color:var(--mut)}
    .rank .rbar{background:#292524}
    .steps .stp1{color:#6ee7b7}
    .grab{background:#44403c}
    .duel .lane.ko{opacity:.35}
    .pdf-h{filter:none}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:10px 8px;display:flex;align-items:center;gap:6px;
    padding-top:calc(10px + env(safe-area-inset-top))}
  header h1{font-size:17px;margin:0;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .sub{font-size:11px;color:var(--soft);font-weight:400;display:block;margin-top:1px}
  main{flex:1;padding:16px 16px 110px}
  .icobtn{background:none;border:0;font-size:22px;padding:6px 10px;color:var(--mut);cursor:pointer;line-height:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:12px}
  .card h2{font-size:13px;margin:0 0 8px;color:var(--mut);font-weight:600}
  .hero{border-radius:22px;padding:26px 20px 22px;margin-bottom:16px;color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#064e3b 0%,#059669 48%,#34d399 100%);
    box-shadow:0 12px 30px -8px rgba(5,150,105,.5)}
  .hero::before{content:'';position:absolute;top:-40%;left:-20%;width:70%;height:180%;
    background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);pointer-events:none}
  .hero::after{content:'';position:absolute;right:-30px;bottom:-30px;width:140px;height:140px;
    background:radial-gradient(circle,rgba(52,211,153,.5),transparent 70%);pointer-events:none}
  .hero h2{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em;position:relative;z-index:1}
  .hero p{margin:6px 0 0;font-size:13.5px;opacity:.94;position:relative;z-index:1;line-height:1.5}
  .hero .dice{position:absolute;right:12px;top:10px;font-size:72px;opacity:.28;transform:rotate(12deg);
    animation:diceFloat 4s ease-in-out infinite;transform-origin:center}
  @keyframes diceFloat{0%,100%{transform:rotate(10deg) translateY(0)}50%{transform:rotate(16deg) translateY(-6px)}}
  @media (prefers-reduced-motion:reduce){.hero .dice{animation:none}}
  .hero .pills{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;position:relative;z-index:1}
  .hero .pills span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:3px 11px;font-size:11.5px;font-weight:600;backdrop-filter:blur(2px)}
  .trust{display:flex;gap:6px;margin:-6px 0 16px}
  .trust span{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 4px;font-size:11.5px;font-weight:600;color:var(--mut);box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .trust b{display:block;font-size:16px;margin-bottom:1px}
  .tool .wm{position:absolute;right:-8px;bottom:-18px;font-size:84px;opacity:.07;transform:rotate(-10deg);pointer-events:none;z-index:0}
  .tool .tag{display:inline-block;margin:5px 0 1px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 9px;border-radius:99px}
  .tool.t-coupe .tag{background:#d1fae5;color:#047857}
  .tool.t-tictac .tag{background:#fef3c7;color:#b45309}
  .tool.t-micro .tag{background:#ede9fe;color:#6d28d9}
  .miniact{flex:0 0 auto;min-width:0;width:100%;display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer;font-family:inherit;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .miniact>span:last-child{min-width:0}
  .miniact b,.miniact small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .miniact .e{font-size:22px;flex-shrink:0}
  .miniact b{display:block;font-size:13.5px;color:var(--ink)}
  .miniact small{display:block;font-size:11px;color:var(--mut);margin-top:1px}
  /* retour visuel immédiat au toucher : plus aucune impression de « ça ne réagit pas » */
  button{transition:transform .06s ease, opacity .06s ease}
  .btn:active,.sm:active,.tool:active,.miniact:active,.chip:active,.icobtn:active,.navbar button:active,nav button:active{transform:scale(.96);opacity:.85}
  .updbar{position:fixed;left:12px;right:12px;bottom:16px;z-index:9999;background:#1c1917;color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.28);animation:updin .25s ease}
  .updbar span{flex:1;font-size:13.5px;font-weight:600}
  .updbar button{background:#059669;color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:700;font-family:inherit;cursor:pointer;font-size:13px}
  @keyframes updin{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  /* Apparition douce des écrans et des cartes : l'app respire */
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  /* l'animation ne joue QUE lors d'un changement d'écran (sinon le chrono ferait trembler l'app) */
  #app.anim>.card,#app.anim>.hero,#app.anim>.tool,#app.anim>.empty,#app.anim>.trust,#app.anim>.row{animation:fadeUp .28s ease both}
  #app.anim>*:nth-child(2){animation-delay:.03s} #app.anim>*:nth-child(3){animation-delay:.06s}
  #app.anim>*:nth-child(4){animation-delay:.09s} #app.anim>*:nth-child(5){animation-delay:.12s}
  @media (prefers-reduced-motion:reduce){#app>*{animation:none !important}}
  /* Écran de victoire : pulsation du trophée */
  @keyframes trophy{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.12) rotate(3deg)}}
  .winbig{display:inline-block;animation:trophy 1.6s ease-in-out infinite}
  /* ---- ARÈNE CÔTE À CÔTE (façon plateau de jeu télévisé) ---- */
  .duel{display:grid;gap:8px;margin:4px 0 12px}
  .duel.n2{grid-template-columns:repeat(2,1fr)}
  .duel.n3{grid-template-columns:repeat(3,1fr)}
  .duel.n4{grid-template-columns:repeat(4,1fr)}
  .duel.nx{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
  .lane{position:relative;border-radius:18px;background:var(--card);border:2px solid #e7e5e4;
        padding:12px 5px 9px;text-align:center;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s}
  .lane .fillbar{display:none}
  .lane>*{position:relative;z-index:1}
  /* anneau de temps autour de l'avatar : on identifie le joueur ET on compare d'un regard */
  .ring{position:relative;width:100%;max-width:86px;margin:0 auto;aspect-ratio:1}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
  .ring .face{position:absolute;inset:16%;border-radius:50%;display:flex;align-items:center;justify-content:center;
    overflow:hidden;background:var(--bg);font-size:26px}
  .ring .face img{width:100%;height:100%;object-fit:cover}
  .lane.live .ring{filter:drop-shadow(0 4px 10px rgba(5,150,105,.45))}
  .lane .who{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px;padding:0 2px}
  .lane .tt{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:2px}
  .lane .gd{font-size:11px;font-weight:700;color:#047857;margin-top:1px}
  .lane.live{border-color:#059669;box-shadow:0 0 0 3px rgba(5,150,105,.18),0 6px 18px rgba(5,150,105,.22);transform:translateY(-4px) scale(1.04)}
  .lane.live .tt{font-size:26px}
  .lane.warn{border-color:#f59e0b}
  .lane.danger{border-color:#e11d48;animation:pulseRed .7s ease-in-out infinite}
  .lane.ko{opacity:.45;filter:grayscale(1)}
  .lane .crown{position:absolute;top:-2px;right:4px;font-size:15px;z-index:2}
  @keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(225,29,72,.45)}50%{box-shadow:0 0 0 8px rgba(225,29,72,0)}}
  .turnbar{text-align:center;margin:2px 0 10px}
  .turnbar .nm{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .turnbar .st{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  @media (prefers-reduced-motion:reduce){.lane,.lane.danger{animation:none;transition:none}}
  .hero h2{text-shadow:0 1px 2px rgba(0,0,0,.12)}
  .whowheel{font-size:56px;text-align:center;padding:8px 0}
  .whoname{font-size:30px;font-weight:800;text-align:center;letter-spacing:-.02em}
  .steps{display:flex;flex-direction:column;gap:9px;margin-top:10px}
  /* Chaque rubrique porte sa couleur : étapes, chips actives et accents. */
  .sc-tictac .stepn{background:#d97706}
  .sc-micro  .stepn{background:#7c3aed}
  .sc-outils .stepn{background:#0d9488}
  .sc-tictac .chip.on{background:#fffbeb;border-color:#d97706;color:#b45309}
  .sc-micro  .chip.on{background:#ede9fe;border-color:#7c3aed;color:#6d28d9}
  .sc-outils .chip.on{background:#ccfbf1;border-color:#0d9488;color:#0f766e}
  .tool.t-champ{border-color:#fcd34d;background:linear-gradient(135deg,#fffbeb,#fef3c7)}
  .tool.t-champ .em{background:linear-gradient(135deg,#b45309,#f59e0b)}
  .tool.t-outils{border-color:#99f6e4;background:linear-gradient(135deg,#f0fdfa,#ccfbf1)}
  .tool.t-outils .em{background:linear-gradient(135deg,#0f766e,#2dd4bf)}
  .tool.t-outils .tag{background:#ccfbf1;color:#0f766e}
  html{-webkit-text-size-adjust:100%}
  button,input,select,textarea,.chip,.tool,.miniact,.swipe{touch-action:manipulation}
  input,select,textarea{font-size:16px}
  .stepn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
    background:var(--gr);color:#fff;font-size:11px;font-weight:800;margin-right:7px;vertical-align:1px}
  .stp1{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:#065f46;line-height:1.45}
  .stp1 .n{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#059669;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-top:1px}
  .gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .gtab{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content;min-width:100%}
  .gtab th,.gtab td{padding:7px 9px;text-align:center;white-space:nowrap;border-bottom:1px solid #f0efee}
  .gtab th{font-size:11px;color:var(--mut);font-weight:700;background:var(--bg)}
  .gtab .stick{position:sticky;left:0;background:var(--card);text-align:left;font-weight:700;z-index:2;box-shadow:1px 0 0 #e7e5e4;min-width:126px;max-width:150px}
  .gtab .nmwrap{display:flex;align-items:center;gap:7px;min-width:0}
  .gtab .nmtxt{min-width:0;display:block;flex:1}
  .gtab .nmtxt b{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gtab .nmbar{display:block;height:3px;border-radius:99px;background:#eeedec;margin-top:3px;overflow:hidden}
  .gtab .nmbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#059669,#34d399)}
  .gtab tr.lead .nmbar i{background:linear-gradient(90deg,#d97706,#fbbf24)}
  .gtab tr.lead .stick{background:linear-gradient(90deg,#fffbeb,#fff)}
  .gtab td.none{color:#d6d3d1}
  .gtab .win{background:#ecfdf5;color:#047857;font-weight:800;border-radius:6px}
  .gtab .tot small{display:block;font-size:10px;font-weight:700;color:#78716c;text-transform:uppercase;letter-spacing:.04em}
  .gtab thead .stick{background:var(--bg)}
  .gtab .nmcell{font-size:13px}
  .gtab .win::after{content:" 👑";font-size:10px;vertical-align:top}
  .gtab .tot{background:#f0fdf4;font-weight:800;color:#065f46;position:sticky;right:0;box-shadow:-1px 0 0 #e7e5e4}
  .gtab tbody tr:first-child .stick{color:#b45309}
  /* Glisser vers la gauche pour supprimer (geste iOS) */
  .swipe{position:relative;overflow:hidden;border-radius:16px;margin-bottom:10px}
  /* Lignes de liste à l'intérieur d'une carte : ni arrondi ni marge, sinon
     les actions révélées se décalent par rapport à la ligne. */
  .swipe.flat{border-radius:0;margin-bottom:0}
  .swipe.flat .front::after{border-radius:0}
  .swipe .acts{position:absolute;top:0;right:0;bottom:0;display:flex}
  .swipe .acts button{width:84px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-size:11.5px;font-weight:700;border:0;cursor:pointer;font-family:inherit}
  .swipe .acts .ic{font-size:20px}
  .swipe .del{background:linear-gradient(135deg,#e11d48,#f43f5e)}
  .swipe .arch{background:linear-gradient(135deg,#d97706,#f59e0b)}
  .swipe .front{position:relative;z-index:1;transition:transform .18s ease;will-change:transform;background:transparent;touch-action:pan-y}
  .swipe .front::after{content:'';position:absolute;top:6px;right:0;bottom:6px;width:16px;border-radius:0 14px 14px 0;
    background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.07));pointer-events:none;transition:opacity .18s ease}
  .swipe.open .front::after{opacity:0}
  .swipe .front>*{margin-bottom:0 !important}
  .swipe.open .front{transform:translateX(calc(-1*var(--reveal,96px)))}
  .swipe .front .tool{margin-bottom:0}
  .tool{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;margin-bottom:12px;
    border-radius:18px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-family:inherit;position:relative;overflow:hidden}
  .tool .em{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--bg);flex-shrink:0;color:#fff}
  .tool.t-coupe{border-color:#a7f3d0;background:linear-gradient(135deg,#ecfdf5,#d1fae5)}
  .tool.t-coupe .em{background:linear-gradient(135deg,#059669,#34d399)}
  .tool.t-tictac{border-color:#fde68a;background:linear-gradient(135deg,#fffbeb,#fef3c7)}
  .tool.t-tictac .em{background:linear-gradient(135deg,#d97706,#fbbf24)}
  .tool.t-micro{border-color:#ddd6fe;background:linear-gradient(135deg,#f5f3ff,#ede9fe)}
  .tool.t-micro .em{background:linear-gradient(135deg,#7c3aed,#a78bfa)}
  .tool.on{border-color:var(--gr-b);background:var(--gr-l)}
  .tool.on .em{background:var(--gr)}
  @keyframes fall{0%{transform:translateY(-30px) rotate(0)}100%{transform:translateY(320px) rotate(340deg);opacity:0}}
  .confetti span{position:absolute;top:0;font-size:22px;animation:fall 2.6s linear infinite}
  .medal{font-size:17px;margin-right:2px}
  .av{display:inline-flex;align-items:center;justify-content:center;border-radius:99px;flex-shrink:0;
    width:34px;height:34px;font-size:19px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .av.big{width:64px;height:64px;font-size:36px;border-width:3px}
  .av.sm{width:26px;height:26px;font-size:15px}
  .avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .avgrid button{border:2px solid transparent;background:var(--card);border-radius:14px;font-size:26px;padding:8px 0;cursor:pointer}
  .avgrid button.on{border-color:var(--gr);background:var(--gr-l)}
  .charena{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;justify-items:center}
  .chp{width:76px;text-align:center;cursor:pointer;border-radius:14px;padding:6px 2px;transition:transform .15s}
  .chp b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
  .chp small{font-variant-numeric:tabular-nums;font-weight:700;font-size:12px}
  .chp .ring{position:relative;width:64px;height:64px;margin:0 auto}
  .chp .ring svg{width:64px;height:64px}
  .chp .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px}
  .chp.live{background:var(--gr-l);transform:scale(1.06)}
  .chp.live .face{animation:pulse 1.2s ease-in-out infinite}
  .chp.ko{opacity:.45;filter:grayscale(1)}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .tool b{font-size:16px;display:block}
  .tool small{color:var(--mut);font-size:13px;display:block;margin-top:2px;line-height:1.35}
  .tag{display:inline-block;background:#e7e5e4;color:var(--mut);border-radius:99px;padding:2px 8px;font-size:10px;font-weight:700;text-transform:uppercase;margin-left:6px;vertical-align:middle}
  button.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:var(--gr);color:#fff;cursor:pointer;font-family:inherit}
  button.btn.dark{background:#292524}button.btn.grey{background:#e7e5e4;color:#44403c}
  button.btn.red{background:var(--ro)}
  /* Hiérarchie : l'action qui LANCE porte la couleur de sa rubrique */
  button.btn.tictac{background:linear-gradient(135deg,#b45309,#d97706)}
  button.btn.micro{background:linear-gradient(135deg,#6d28d9,#7c3aed)}
  button.btn.dice{background:linear-gradient(135deg,#0f766e,#0d9488)}
  .chrow{display:grid;grid-template-columns:38px 1fr 66px 32px;gap:8px;align-items:center}
  .secwrap{position:relative;display:block}

  button.sm{border:0;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;background:#e7e5e4;color:#44403c}

    padding-bottom:env(safe-area-inset-bottom)}

  nav button .i{display:block;font-size:20px;margin-bottom:2px}
  nav button.on{color:var(--gr)}
  .navbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .navbar .in{max-width:520px;margin:0 auto}
  .rank{display:flex;align-items:center;gap:12px;border-radius:12px;padding:10px 10px 13px;background:var(--bg);margin-bottom:5px;position:relative}
  .rank .rbar{position:absolute;left:50px;right:12px;bottom:5px;height:3px;border-radius:99px;background:#e7e5e4;overflow:hidden}
  .rank .rbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#059669,#34d399)}
  .rank.first .rbar i{background:linear-gradient(90deg,#d97706,#fbbf24)}
  .rank.lead{background:var(--gr-l)}
  .rank .pos{width:28px;height:28px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:var(--card);border:1px solid var(--line);color:var(--soft);flex-shrink:0}
  .rank.first .pos{background:var(--gr);color:#fff;border-color:var(--gr)}
  .rank .nm{flex:1;min-width:0}

  .champ{border-radius:16px;padding:12px;border:1px solid}

  .champ .v{font-size:18px;font-weight:800;margin-top:5px;line-height:1.2;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
  .champ .v.tie{font-size:15px}

  .champ.g .v,.champ.g .s{color:#064e3b}.champ.a .v,.champ.a .s{color:#78350f}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .plr{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px;margin-bottom:9px}
  .plr.win{border-color:var(--gr-b);background:var(--gr-l)}
  .plr .n{flex:1;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:4px}
  .plr .stp{width:42px;height:42px;border-radius:12px;border:0;font-size:20px;background:var(--bg);color:var(--mut);cursor:pointer;flex-shrink:0}
  .plr .stp.p{background:var(--gr-l);color:var(--gr)}
  .plr input{width:64px;text-align:center;font-size:20px;font-weight:700;padding:8px 2px;font-variant-numeric:tabular-nums}
  .empty{text-align:center;padding:48px 16px}
  .empty .e{font-size:40px}.empty h3{margin:10px 0 4px;font-size:17px}
  .empty p{color:var(--mut);font-size:14px;margin:0 0 16px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#1c1917;color:#fff;
    padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:60;max-width:90%;text-align:center}
  .warn{background:var(--ro-l);border:1px solid #fecdd3;color:#9f1239;border-radius:12px;padding:10px;font-size:12.5px;line-height:1.4;margin-bottom:12px}
  .ok{background:var(--gr-l);border:1px solid var(--gr-b);color:#065f46;border-radius:12px;padding:10px;font-size:12.5px;line-height:1.4;margin-bottom:12px}
  ul.lst{list-style:none;padding:0;margin:0}
  ul.lst li{display:flex;gap:8px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:8px 10px;margin-bottom:5px;font-size:14px}
  .hist{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:9px}
  .hist .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .hist .dt{font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums}
  .hist .w{background:var(--am-l);color:#b45309;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:600}
  .hist .sc{margin-top:7px;font-size:13px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 14px;font-variant-numeric:tabular-nums}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;display:flex;align-items:flex-end}
  .sheet .in{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;padding:16px;
    max-height:92vh;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .grab{width:40px;height:5px;background:#d6d3d1;border-radius:99px;margin:0 auto 12px}
  label.lb{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--soft);display:block;margin:0 0 5px}
  .mini{font-size:12px;color:var(--soft);line-height:1.45}
  /* ---- Export PDF (impression) ---- */
  #pdf{display:none}
  @media print{
    body{background:#fff}
    header,#nav,#app,.sheet,.toast{display:none !important}
    #pdf{display:block !important;padding:0;color:#1c1917;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
    .pdf-h{background:linear-gradient(135deg,#065f46,#34d399);color:#fff;padding:22px 20px;border-radius:14px;margin-bottom:16px}
    .pdf-h h1{margin:0;font-size:26px} .pdf-h p{margin:4px 0 0;opacity:.9;font-size:13px}
    .pdf-sec{margin-bottom:18px;break-inside:avoid}
    .pdf-sec h2{font-size:15px;border-bottom:2px solid #059669;padding-bottom:4px;margin:0 0 8px;color:#065f46}
    table{width:100%;border-collapse:collapse;font-size:12.5px}
    th{text-align:left;color:#78716c;font-weight:600;padding:6px 8px;border-bottom:1px solid #e7e5e4;font-size:11px;text-transform:uppercase}
    td{padding:6px 8px;border-bottom:1px solid #f0efee}
    tr:nth-child(even) td{background:var(--bg)}
    .pdf-top td{font-weight:800;color:#065f46}
    .pdf-medal{font-size:15px}
    .pdf-foot{margin-top:20px;text-align:center;color:#78716c;font-size:10px}
  }
</style>

<body>
<div class="wrap">
  <header id="hd"></header>
  <main id="app"></main>
  <div id="nav"></div>
  <div id="pdf"></div>
</div>
<script>
/* ============================ STOCKAGE ============================
   Sur un vrai fichier ouvert dans Safari, localStorage persiste.
   Règle de sûreté : on n'écrit JAMAIS avant une lecture réussie,
   pour qu'un incident de lecture ne puisse pas effacer l'historique. */
var KEY='jeux-famille-v1', canSave=false, saveMsg='';
function loadStore(){
  try{
    var probe='__t'+Date.now();
    localStorage.setItem(probe,'1'); localStorage.removeItem(probe); // le stockage répond
    canSave=true;
    var v=localStorage.getItem(KEY);
    if(v) return JSON.parse(v);
    return null;
  }catch(e){ canSave=false; saveMsg=e.message||'indisponible'; return null; }
}
function persist(){
  if(!canSave) return;
  try{ localStorage.setItem(KEY, JSON.stringify(D)); }
  catch(e){ canSave=false; saveMsg='écriture refusée'; render(); }
}

/* ============================= UTILS ============================== */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function today(){var d=new Date(),p=function(n){return(n<10?'0':'')+n;};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
var APP_VERSION='92';
function fr(d){return d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'';}
function nf(n){return (Math.round(n*100)/100).toLocaleString('fr-FR');}
function pl(n,w){return n+' '+w+(n>1?'s':'');}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fp(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}

var AV_POOL=['🦁','🐯','🦊','🐼','🐨','🐸','🐙','🦄','🐵','🐷','🦖','🦉','🐺','🐳','🐝','🦋','🤖','👽','🧙‍♂️','🦸‍♀️','🥷','🧜‍♀️','🐲','🦩','👹','👺','🤡','👻','🎃','😈','🤠','🥸','💀','🧛','🧟','🎭'];
var AV_BG=['#fee2e2','#ffedd5','#fef9c3','#dcfce7','#d1fae5','#cffafe','#dbeafe','#e0e7ff','#ede9fe','#fae8ff','#fce7f3','#f5f5f4'];
function hashN(s){var x=0,f=fp(s);for(var i=0;i<f.length;i++)x=(x*31+f.charCodeAt(i))>>>0;return x;}
function avFor(name){
  var k=fp(name);
  for(var i=0;i<D.lib.length;i++) if(fp(D.lib[i].name)===k && D.lib[i].emoji) return D.lib[i].emoji;
  // équipe (nom en plusieurs mots) : initiales, plus claires qu'un personnage
  var words=String(name||'').trim().split(/\s+/).filter(function(x){return x.length;});
  if(words.length>=2){
    var ini=words.slice(0,2).map(function(x){return x[0].toUpperCase();}).join('');
    return '<b style="font-size:15px;letter-spacing:.5px">'+ini+'</b>';
  }
  return AV_POOL[hashN(name)%AV_POOL.length];
}
function avBg(name){return AV_BG[hashN(name)%AV_BG.length];}
function avPhotoOf(name){
  var k=fp(name);
  for(var i=0;i<D.lib.length;i++) if(fp(D.lib[i].name)===k && D.lib[i].photo) return D.lib[i].photo;
  return null;
}
function av(name,cls){
  var ph=avPhotoOf(name);
  if(ph) return '<span class="av '+(cls||'')+'" style="background-image:url('+ph+');background-size:cover;background-position:center"></span>';
  return '<span class="av '+(cls||'')+'" style="background:'+avBg(name)+'">'+avFor(name)+'</span>';
}

var DEF=['Patrick','Mélanie','Mattéo','Maxime'];
function fresh(){return {v:1, lib:DEF.map(function(n){return{id:uid(),name:n};}), matches:[], journal:[], micro:[], tictac:[]};}

var D=loadStore()||fresh();
if(!D.lib)D.lib=[]; if(!D.matches)D.matches=[]; if(!D.journal)D.journal=[]; if(!D.micro)D.micro=[]; if(!D.tictac)D.tictac=[];
if(!D.onboarded && (D.matches.length||D.journal.length||D.micro.length||D.tictac.length)) D.onboarded=1;

/* ========================== LOGIQUE SCORE ========================= */
function winners(r,roster,rule){
  var ids=roster.map(function(p){return p.id;}),e=[];
  for(var k in r.scores){ if(ids.indexOf(k)>=0 && r.scores[k]!==null && !isNaN(r.scores[k])) e.push([k,r.scores[k]]); }
  if(!e.length) return [];
  var vals=e.map(function(x){return x[1];});
  var best=rule==='low'?Math.min.apply(null,vals):Math.max.apply(null,vals);
  return e.filter(function(x){return x[1]===best;}).map(function(x){return x[0];});
}
function rank(m,keep){
  keep=keep||function(){return true;};
  var rounds=m.rounds.filter(keep), s={};
  m.players.forEach(function(p){s[p.id]={id:p.id,name:p.name,points:0,played:0,wins:0};});
  rounds.forEach(function(r){
    var w=winners(r,m.players,m.winRule);
    for(var k in r.scores){ if(s[k]&&r.scores[k]!==null&&!isNaN(r.scores[k])){s[k].points+=r.scores[k];s[k].played++;} }
    w.forEach(function(k){ if(s[k]) s[k].wins++; });
  });
  var list=[]; for(var k in s) list.push(s[k]);
  var low=m.winRule==='low';
  var byCumul=list.slice().sort(function(a,b){return low?(a.points-b.points||b.wins-a.wins):(b.points-a.points||b.wins-a.wins);});
  var byWins=list.slice().sort(function(a,b){return b.wins-a.wins||(low?a.points-b.points:b.points-a.points);});
  return {byCumul:byCumul,byWins:byWins,count:rounds.length};
}
function leaders(sorted,key,rule){
  var played=sorted.filter(function(p){return p.played>0;});
  if(!played.length) return [];
  if(key==='wins'){ var bw=Math.max.apply(null,played.map(function(p){return p.wins;}));
    if(bw<=0) return []; return played.filter(function(p){return p.wins===bw;}).map(function(p){return p.id;}); }
  var vals=played.map(function(p){return p.points;});
  var b=rule==='low'?Math.min.apply(null,vals):Math.max.apply(null,vals);
  return played.filter(function(p){return p.points===b;}).map(function(p){return p.id;});
}

/* ============================== ÉTAT UI =========================== */
var S={dateOpen:false,view:'home',matchId:null,tab:'rank',qtab:'play',period:'all',from:'',to:'',inputs:{},date:today(),sheet:false,confirm:null,detail:null,avPick:null,tipOff:0,microSheet:false,chTab:'play',whoSheet:false};
function go(v){
  /* Toute feuille modale est retirée au changement de vue : elle ne doit
     jamais survivre à la navigation. */
  if(S.view!==v){
    ['msh','mcsh','tcsh','dmsh'].forEach(function(id){ var e=document.getElementById(id); if(e) e.remove(); });
    S.microSheet=false; S.microDetail=false; S.rtab='play';
  }
  if(S.view==='chrono' && v!=='chrono' && CH && CH.winner){ CH=null; try{chPersist();}catch(e){} }S.view=v;S.tab='rank';S.qtab='play';S.histAll=false;S.ceremony=false;S.histMode=(S.histMode==='list'?'grid':(S.histMode||'rank'));window.scrollTo(0,0);render();}
function cur(){return D.matches.filter(function(m){return m.id===S.matchId;})[0];}
function setVoice(b){
  D.voice=b; persist();
  if(b){ try{ if(window.speechSynthesis && window.SpeechSynthesisUtterance){ var u=new SpeechSynthesisUtterance('Annonce activée'); u.lang='fr-FR'; window.speechSynthesis.speak(u);} }catch(e){} }
  render();
}
function speak(txt){ if(!sndOn()) return;
  try{
    if(!D.voice) return;
    if(typeof window==='undefined' || !window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(txt); u.lang='fr-FR'; u.rate=1; u.pitch=1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);
  setTimeout(function(){d.remove();},2000);}

/* ============================== RENDU ============================= */
var __lastView=null;
function render(){
  sweepUndo();
  try{
    var appEl=document.getElementById('app');
    if(appEl){
      var key=S.view+'|'+S.tab+'|'+S.qtab+'|'+(S.chTab||'');
      if(key!==__lastView){ appEl.classList.add('anim'); __lastView=key; }
      else appEl.classList.remove('anim');
    }
  }catch(e){}
  try{
    var _a=document.getElementById('app');
    if(_a){ _a.classList.remove('sc-tictac','sc-micro','sc-outils','sc-coupe');
      var _m={chrono:'sc-tictac',quizz:'sc-micro',outils:'sc-outils',points:'sc-coupe',match:'sc-coupe'};
      if(_m[S.view]) _a.classList.add(_m[S.view]); }
  }catch(e){}
  var r=render_();
  try{ afterRender(); }catch(e){}
  return r; }
function render_(){
  var hd=document.getElementById('hd'),app=document.getElementById('app'),nav=document.getElementById('nav');
  nav.innerHTML='';
  var standalone = (window.navigator.standalone===true) || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  var banner = !canSave ? '<div class="warn"><b>Sauvegarde impossible ici.</b> Ce navigateur ne garde pas la mémoire. Ouvre le lien dans <b>Safari</b>, puis Partager → Sur l\'écran d\'accueil, et lance l\'app depuis l\'icône.</div>' : '';
  var tip = (canSave && !standalone && S.view==='home' && !S.tipOff && !D.tipOff)
    ? '<div style="display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:9px 12px;margin-top:12px"><span class="mini" style="flex:1;margin:0">📌 Ajoute En Jeux à ton écran d\'accueil (Partager → Sur l\'écran d\'accueil) pour le retrouver d\'un geste.</span><button class="sm" onclick="D.tipOff=1;persist();render()" aria-label="Masquer ce conseil">OK</button></div>' : '';

  if(S.view==='home'){
    if(!D.onboarded) setTimeout(obDraw,50);
    hd.innerHTML='<span style="width:38px"></span><h1>En Jeux<span class="sub">Votre maître du jeu de poche</span></h1>'+
      '<button class="icobtn" onclick="go(\'save\')">⚙︎</button>';
    app.innerHTML=banner+
      '<div class="hero" style="padding:20px 20px 17px"><span class="dice">🎲</span>'+
        '<p style="font-size:16px;font-weight:800;margin:0 0 6px;line-height:1.3">Le compagnon de vos jeux</p>'+
        '<p style="font-size:13.5px;margin:0;line-height:1.5;opacity:.92">Vos cartes, vos dés, votre plateau — ou rien du tout. En Jeux compte les points, chronomètre, anime et retient qui gagne. 👑</p>'+
        '<div class="pills"><span>🍿 Soirées</span><span>🍽️ À table</span><span>🚗 En voiture</span><span>🏖️ En vacances</span></div></div>'+
      '<div class="trust"><span><b>🆓</b>Gratuit</span><span><b>📶</b>Hors-ligne</span><span><b>v'+APP_VERSION+'</b>Version</span></div>'+
      (function(){
        if(D.live && D.live.players && D.live.winner===null){
          return '<button class="tool t-tictac" style="padding:12px 16px" onclick="go(\'chrono\')">'+
            '<span class="em" style="width:44px;height:44px;font-size:22px">⏱️</span>'+
            '<span style="flex:1;min-width:0;position:relative;z-index:1"><b>Duel en cours</b>'+
            '<small>'+pl(D.live.players.filter(function(p){return !p.out;}).length,'joueur')+' encore en lice — reprends où vous en étiez</small></span>'+
            '<span style="color:#d6d3d1">›</span></button>';
        }
        return '';
      })()+
      (function(){
        var live=D.matches.filter(function(m){return m.status!=='done' && m.rounds.length;})[0];
        return live ? '<button class="tool t-coupe" style="padding:12px 16px" onclick="S.matchId=\''+live.id+'\';go(\'match\')">'+
          '<span class="em" style="width:44px;height:44px;font-size:22px">▶︎</span>'+

/* Rend "glissable vers la gauche" tout élément .swipe présent à l'écran */
function bindSwipe(){
  var nodes=document.querySelectorAll('.swipe:not([data-bound])');
  nodes.forEach(function(el){
    el.setAttribute('data-bound','1');
    var front=el.querySelector('.front'); if(!front) return;
    var x0=null,y0=null,open=false,lock=null;
    front.addEventListener('touchstart',function(e){ var t=e.touches[0]; x0=t.clientX; y0=t.clientY; lock=null; },{passive:true});
    front.addEventListener('touchmove',function(e){
      if(x0===null) return; var t=e.touches[0]; var dx=t.clientX-x0, dy=t.clientY-y0;
      if(lock===null){ lock = Math.abs(dx)>Math.abs(dy)+4 ? 'x' : (Math.abs(dy)>Math.abs(dx)+4 ? 'y' : null); }
      if(lock!=='x') return;
      var rev=parseInt(el.getAttribute('data-reveal')||'96');
      var base=open?-rev:0; var tx=Math.max(-rev,Math.min(0,base+dx));
      front.style.transform='translateX('+tx+'px)';
    },{passive:true});
    front.addEventListener('touchend',function(e){
      if(x0===null) return; var tx=0;
      var m=/translateX\((-?\d+(?:\.\d+)?)px\)/.exec(front.style.transform); if(m) tx=parseFloat(m[1]);
      var rev2=parseInt(el.getAttribute('data-reveal')||'96');
      open = tx < -rev2/2; el.classList.toggle('open',open);
      front.style.transform=''; x0=y0=null;
    });
  });
}

/* ── Catégorie « jeu » ──────────────────────────────────────────────
   La liste était purement chronologique : à 200 parties, plus rien n'est
   trouvable. Chaque partie porte désormais un jeu, déduit pour l'existant
   (aucune ressaisie), et la liste se filtre. */
/* Raccourcis des jeux les plus courants. La liste n'est PAS fermée :
   la famille ajoute ses propres jeux, qui deviennent ensuite des raccourcis. */
/* Dix-neuf raccourcis noyaient le champ de saisie. On garde ceux qui reviennent
   vraiment, le reste s'ajoute en une frappe et devient ensuite un raccourci. */
var GAMES_BASE=['Uno','Belote','Tarot','Rami','Yams','Skyjo','Molkky','Scrabble','Quiz'];
function userGames(){ if(!D.games) D.games=[]; return D.games; }
function allGames(){
  var seen={}, out=[];
  userGames().concat(GAMES_BASE).forEach(function(g){
    var k=(g||'').toLowerCase().trim(); if(!k||seen[k]) return; seen[k]=1; out.push(g);
  });
  return out;
}
function cleanGame(s){
  s=(s||'').replace(/\s+/g,' ').trim().slice(0,28);
  if(!s) return '';
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function addGame(name){
  var g=cleanGame(name); if(!g) return '';
  var exists=allGames().filter(function(x){return x.toLowerCase()===g.toLowerCase();})[0];
  if(exists) return exists;
  userGames().unshift(g); persist(); return g;
}
/* Jeux triés : ceux réellement utilisés d'abord, puis les raccourcis. */
function gamesForPicker(){
  var used={};
  (D.matches||[]).forEach(function(m){ var g=gameOf(m); if(g) used[g]=(used[g]||0)+1; });
  return allGames().slice().sort(function(a,b){ return (used[b]||0)-(used[a]||0); });
}
function inferGame(name){
  var n=(name||'').toLowerCase();
  var list=allGames().slice().sort(function(a,b){return b.length-a.length;});
  for(var i=0;i<list.length;i++){
    var g=list[i].toLowerCase();
    if(g && n.indexOf(g)>=0) return list[i];
  }
  if(/tic.?tac/.test(n)) return 'Quiz';
  if(/micro/.test(n)) return 'Quiz';
  return 'Autre';
}
function gameOf(m){ return m.game || inferGame(m.name); }
function addGameHere(){
  var el=document.getElementById('gadd'); if(!el) return;
  var g=addGame(el.value);
  if(!g){ toast('Donne un nom de jeu'); return; }
  setMatchGame(g);
}
function setMatchGame(g){ var m=cur(); if(!m) return; m.game=g; persist(); toast('Jeu : '+g); render(); }
function gameCounts(list){
  var c={}; list.forEach(function(m){ var g=gameOf(m); c[g]=(c[g]||0)+1; });
  return Object.keys(c).sort(function(a,b){return c[b]-c[a] || a.localeCompare(b);}).map(function(k){return {game:k,n:c[k]};});
}
function setGameFilter(g){ S.gameFilter=(S.gameFilter===g?null:g); S.matchQ=S.matchQ||''; render(); }
function matchesFiltered(list){
  var q=(S.matchQ||'').trim().toLowerCase();
  return list.filter(function(m){
    if(S.gameFilter && gameOf(m)!==S.gameFilter) return false;
    if(q && (m.name||'').toLowerCase().indexOf(q)<0 && gameOf(m).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}

function coupeResults(){
  var done=D.matches.filter(function(m){return m.rounds&&m.rounds.length;});
  if(!done.length) return resEmpty('🏆','Aucun résultat',
    'Crée une partie et saisis une manche : les classements apparaîtront ici.',
    '<button class="btn" style="max-width:260px;margin:0 auto" onclick="setRtab(\'play\')">Voir mes parties</button>');
  var agg={};
  done.forEach(function(m){
    var r=rank(m,function(){return true;}); if(!r.count) return;
    var lead=leaders(r.byCumul,'points',m.winRule);
    m.players.forEach(function(p){
      var k=fp(p.name); if(!k) return;
      if(!agg[k]) agg[k]={name:p.name,wins:0,games:0,manches:0};
      agg[k].games++;
      var st=r.byCumul.filter(function(x){return x.id===p.id;})[0];
      if(st) agg[k].manches+=st.wins;
      if(lead.indexOf(p.id)>=0) agg[k].wins++;
    });
  });
  var list=[]; for(var k in agg) list.push(agg[k]);
  if(!list.length) return resEmpty('🏆','Aucun résultat','Saisis une manche pour voir les classements.','');
  list.sort(function(a,b){return b.wins-a.wins || b.manches-a.manches;});
  var topW=list[0].wins;
  var byM=list.slice().sort(function(a,b){return b.manches-a.manches;});
  var winners=list.filter(function(p){return p.wins===topW && topW>0;}).map(function(p){return p.name;});
  var bestM=byM.filter(function(p){return p.manches===byM[0].manches && p.manches>0;}).map(function(p){return p.name;});
  var h=statPair('🏆 Le plus de parties gagnées', nmList(winners), topW?topW+' partie'+(topW>1?'s':''):'—',
                 '🥇 Le plus de manches gagnées', nmList(bestM), byM[0].manches?pl(byM[0].manches,'manche'):'—');
  h+='<div class="card"><h2>🏅 Classement</h2>'+rankRows(list.map(function(p){
      return {name:p.name, top:(p.wins===topW&&topW>0), badge:(p.wins===topW&&topW>0?' 👑':''),
        sub:pl(p.games,'partie')+' · '+p.manches+' manche'+(p.manches>1?'s':'')+' gagnée'+(p.manches>1?'s':''),
        val:p.wins, unit:'partie'+(p.wins>1?'s':'')};
    }))+'</div>';
  h+=champGameBlocks();
  return h;
}

/* Composants partagés, calqués sur La Coupe : les trois rubriques
   présentent leurs résultats avec exactement les mêmes briques. */
function statPair(l1,v1,s1,l2,v2,s2){
  var box=function(cls,l,v,s){
    var tie=(v||'').length>16;
    return '<div class="champ '+cls+'"><div class="l">'+l+'</div>'+
      '<div class="v'+(tie?' tie':'')+'" title="'+esc(v||'')+'">'+esc(v||'—')+'</div>'+
      '<div class="s">'+(s||'—')+'</div></div>';
  };
  return '<div class="grid2">'+box('g',l1,v1,s1)+box('a',l2,v2,s2)+'</div>';
}
function rankRows(rows){
  return rows.map(function(p,i){

      (i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1))+'</div>'+
      av(p.name,'sm')+'<div class="nm" style="margin-left:8px"><b>'+esc(p.name)+(p.badge||'')+'</b>'+
      '<small>'+(p.sub||'')+'</small></div>'+
      '<div class="pts"><b>'+p.val+'</b><small>'+(p.unit||'')+'</small></div></div>';
  }).join('');
}
function nmList(a){ return !a.length?'—' : a.length===1?a[0] : a.length===2?a.join(' & ') : a.length+' ex æquo'; }

function pickGame(btn){

  if(!was){
    btn.classList.add('on');
    var g=btn.getAttribute('data-g');
    var nm=document.getElementById('mn');
    var v=nm?nm.value.trim():'';

function createMatch(){
  var name=document.getElementById('mn').value.trim()||'Partie';
  var gnew=document.getElementById('gnew');
  var _t=gnew?cleanGame(gnew.value):'';

  var typed=gnew? cleanGame(gnew.value) : '';
  var gsel=document.querySelector('#gk .chip.on');
  var game = typed ? addGame(typed) : (gsel? gsel.getAttribute('data-g') : inferGame(name));
  var roster=[];
  [].forEach.call(document.querySelectorAll('#pk .chip.on'),function(b){
    var p=D.lib.filter(function(x){return x.id===b.getAttribute('data-id');})[0];

  document.getElementById('mx').value.split(',').forEach(function(s){s=s.trim();if(s)roster.push({id:uid(),name:s});});

  var tEl=document.getElementById('mt'); var tgt=tEl?parseInt(tEl.value):NaN;
  var m={id:uid(),name:name,game:game,winRule:NEWRULE,status:'active',created:today(),players:roster,rounds:[],target:(!isNaN(tgt)&&tgt>0)?tgt:null};

/* Série en cours : victoires consécutives sur les manches les plus récentes.
   Calculée à la volée depuis m.rounds (rangées du plus récent au plus ancien) —
   aucune donnée nouvelle à saisir ni à stocker. */
function curStreak(m,pid){
  var s=0;
  for(var i=0;i<m.rounds.length;i++){
    var rd=m.rounds[i];
    if(rd.scores[pid]===undefined) break;
    if(winners(rd,m.players,m.winRule).indexOf(pid)>=0) s++; else break;
  }
  return s;
}

function tabPlay(m){

  for(k in S.inputs){var n=parseFloat(String(S.inputs[k]).replace(',','.'));if(!isNaN(n))prev[k]=n;}
  var w=winners({scores:prev},m.players,m.winRule);

var UNDO=null, UNDO_T=null;
function offerUndo(label,restore){

/* iOS gèle les minuteurs en arrière-plan : la barre pouvait rester des
   minutes. On mémorise une échéance, vérifiée à chaque rendu et au retour
   au premier plan. */
/* Mise à jour forcée : un simple location.reload() ne vidait ni les caches
   ni le service worker, si bien qu'une nouvelle version pouvait rester
   invisible. On efface tout et on recharge en contournant le cache HTTP. */
function forceUpdate(){
  toast('Mise à jour…');
  var done=function(){
    try{ location.replace(location.pathname+'?maj='+Date.now()); }
    catch(e){ location.reload(); }
  };
  var jobs=[];
  try{ if(window.caches && caches.keys) jobs.push(caches.keys().then(function(ks){
    return Promise.all(ks.map(function(k){ return caches.delete(k); }));
  })); }catch(e){}
  try{ if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations) jobs.push(
    navigator.serviceWorker.getRegistrations().then(function(rs){
      return Promise.all(rs.map(function(r){ return r.unregister(); }));
    })); }catch(e){}
  if(!jobs.length){ done(); return; }
  Promise.all(jobs).then(done).catch(done);
  setTimeout(done, 2500);
}
function sweepUndo(){
  if(UNDO && UNDO.until && Date.now()<UNDO.until) return;
  var b=document.getElementById('undobar'); if(b)b.remove();
  UNDO=null; if(UNDO_T){ clearTimeout(UNDO_T); UNDO_T=null; }
}
function doUndo(){
  if(!UNDO) return;
  try{ UNDO.restore(); }catch(e){}
  UNDO=null; var b=document.getElementById('undobar'); if(b)b.remove();
  if(UNDO_T) clearTimeout(UNDO_T);
  persist(); render(); toast('Restauré ✓');
}

function askDropPlayer(id){ S.confirm='dp'+id; render(); }
/* Deux cas distincts :
   - le joueur a déjà des scores  -> mis EN RETRAIT (out=true) : son
     historique reste visible, il ne participe plus aux manches suivantes ;
   - aucun score (ajouté par erreur) -> supprimé purement. */
function dropPlayerFull(id){
  var m=cur(); var idx=m.players.findIndex(function(p){return p.id===id;});
  if(idx<0) return;
  var mid=m.id;
  var played=m.rounds.filter(function(r){return r.scores[id]!==undefined;}).length;
  var backupP=JSON.parse(JSON.stringify(m.players[idx]));
  if(played){
    m.players[idx].out=true;
    S.confirm=null; persist(); render();
    offerUndo(backupP.name+' mis en retrait', function(){
      var mm=D.matches.filter(function(x){return x.id===mid;})[0]; if(!mm) return;
      var p=mm.players.filter(function(q){return q.id===id;})[0]; if(p) delete p.out;
    });
  } else {
    m.players.splice(idx,1);
    S.confirm=null; persist(); render();
    offerUndo(backupP.name+' retiré', function(){
      var mm=D.matches.filter(function(x){return x.id===mid;})[0]; if(!mm) return;
      mm.players.splice(Math.min(idx,mm.players.length),0,backupP);
    });
  }
}
function rejoinPlayer(id){
  var m=cur(); if(!m) return;
  var p=m.players.filter(function(q){return q.id===id;})[0]; if(!p) return;
  delete p.out; persist(); toast(p.name+' est de retour'); render();
}
function activePlayers(m){ return m.players.filter(function(p){return !p.out;}); }
function renameMatch(){var m=cur(),v=document.getElementById('rn').value.trim();if(v)m.name=v;persist();toast('Nom mis à jour');render();}
function addPlayerToMatch(){
  var el=document.getElementById('addp'); var name=(el&&el.value||'').trim();
  if(!name){toast('Écris un prénom ou un nom d\'équipe');return;}
  var m=cur();
  if(m.players.some(function(p){return fp(p.name)===fp(name);})){toast(name+' est déjà dans la partie');return;}
  // relier à la bibliothèque commune (avatar partagé), sinon l'y créer
  var lib=D.lib.filter(function(p){return fp(p.name)===fp(name);})[0];
  if(!lib){ lib={id:uid(),name:name}; D.lib.push(lib); }
  m.players.push({id:lib.id,name:lib.name});

}

function delMatch(){
  var idx=D.matches.findIndex(function(m){return m.id===S.matchId;});
  if(idx<0) return;
  var backup=JSON.parse(JSON.stringify(D.matches[idx]));
  D.matches.splice(idx,1); S.confirm=null;
  var e=document.getElementById('dmsh'); if(e)e.remove();
  persist(); go('points');
  offerUndo('« '+backup.name+' » supprimée', function(){ D.matches.splice(Math.min(idx,D.matches.length),0,backup); });
}

function share(){
  var m=cur(),r=rank(m,keeper()),lp=leaders(r.byCumul,'points',m.winRule),lw=leaders(r.byWins,'wins',m.winRule);
  var med=['🥇','🥈','🥉'];
  var lab={all:'',month:'ce mois-ci',year:'cette année',custom:'période choisie'}[S.period];
  var t='🏆 '+m.name+'\n'+pl(r.count,'manche')+(lab?' · '+lab:'')+(m.winRule==='low'?' · le moins de points gagne':'')+'\n\n';
  r.byCumul.forEach(function(p,i){t+=(med[i]||'   ')+' '+p.name+' — '+nf(p.points)+' pts · '+pl(p.wins,'victoire')+'\n';});
  var nmOf=function(l,ids){return l.filter(function(p){return ids.indexOf(p.id)>=0;}).map(function(p){return p.name;}).join(' & ');};
  t+='\n';
  if(lp.length) t+='Meilleur cumul : '+nmOf(r.byCumul,lp)+'\n';
  if(lw.length && nmOf(r.byWins,lw)!==nmOf(r.byCumul,lp)) t+='Plus de victoires : '+nmOf(r.byWins,lw)+'\n';
  t+='\n— compté avec En Jeux · pat37100.github.io/jeux';
  if(navigator.share){ navigator.share({text:t}).catch(function(){}); return; }
  copy(t,'Résultats copiés — colle-les dans WhatsApp');
}
function copy(t,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast(msg);},function(){fallbackCopy(t,msg);});}
  else fallbackCopy(t,msg);
}
function fallbackCopy(t,msg){
  var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);
  a.select();a.setSelectionRange(0,999999);try{document.execCommand('copy');toast(msg);}catch(e){toast('Copie impossible — sélectionne le texte et copie-le à la main');}a.remove();
}

  function draw(){ var out=[]; for(var i=0;i<c.n;i++) out.push(1+Math.floor(Math.random()*c.type)); return out; }

  var timer=setInterval(function(){
    ticks++;

    var zone=b.querySelector('div[style*="flex-wrap"]');
    if(zone) zone.outerHTML=diceFaces(tmp,true);
    if(ticks>=6){
      clearInterval(timer);

  if(typeof setInterval!=='function'){ DICE_LAST={type:c.type,vals:draw()}; openDiceRefresh(); }
}

function shuffleMicroTeams(){
  var names=microTeam().slice();
  for(var i=names.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=names[i]; names[i]=names[j]; names[j]=t; }
  var half=Math.ceil(names.length/2);
  D.microTeams={a:names.slice(0,half), b:names.slice(half)};
  persist(); render();
}
function microSwapTeam(name){
  if(!D.microTeams) return;
  var a=(D.microTeams.a||[]).slice(), b=(D.microTeams.b||[]).slice();
  var i=a.indexOf(name);
  if(i>=0){ a.splice(i,1); b.push(name); }
  else { var j=b.indexOf(name); if(j>=0) b.splice(j,1); a.push(name); }
  D.microTeams={a:a,b:b}; persist(); render();
}
function microTeam(){
  if(!D.microTeam) return D.lib.map(function(p){return p.name;});
  var names=D.lib.filter(function(p){return D.microTeam.indexOf(p.id)>=0;}).map(function(p){return p.name;});

/* Niveau de départ par joueur : dans une famille, un ado et un adulte
   ne partent pas du même niveau. Le moteur adaptait déjà, mais seulement
   après 4 à 6 questions — trop tard pour les premières. 3 crans suffisent. */
/* L'echelle porte le niveau du JOUEUR, pas la difficulte d'une question.
   Noms volontairement drôles : c'est l'animatrice qui les prononce en jeu.
   j/n/c sont les anciennes cles (v80 et avant) : elles restent lues. */
var MICRO_LVL=[
  {k:'p',label:'🐣 Poussin',        n:2, txt:"la réponse est connue de presque tous les enfants : un fait de base, souvent vu à l'école"},
  {k:'a',label:"🎧 Tête d'ado",     n:4, txt:"la réponse est connue de la plupart des jeunes : un fait courant, sans détail à retenir"},
  {k:'h',label:'☕ Honnête cultivé', n:5, txt:"un adulte attentif y répond : le fait est répandu, mais il faut aller le chercher"},
  {k:'b',label:'🧠 Tête bien faite', n:6, txt:"il faut une connaissance précise ou un raisonnement : on n'y répond pas par réflexe"},
  {k:'g',label:'🔥 Grosse tête',    n:8, txt:"détail latéral, angle inattendu, précision rare — si la majorité des adultes connaît spontanément la réponse, ce n'est PAS ce niveau"}
];
/* Cles historiques : v80 (j/n/c) puis v81 (m/t). Relues, jamais perdues. */
var MICRO_LVL_OLD={j:'a',n:'h',c:'g',m:'a',t:'h'};
function microLvl(id){
  if(!D.microLvl) D.microLvl={};
  var v=D.microLvl[id];
  if(MICRO_LVL_OLD[v]) v=MICRO_LVL_OLD[v];        // migration silencieuse
  return v||'h';
}
function lvlOf(k){ return MICRO_LVL.filter(function(x){return x.k===k;})[0]||MICRO_LVL[2]; }
function cycleMicroLvl(id){
  var order=MICRO_LVL.map(function(x){return x.k;}), cur=microLvl(id);
  if(!D.microLvl) D.microLvl={};
  D.microLvl[id]=order[(order.indexOf(cur)+1)%order.length];
  persist(); render();
}
function lvlNum(k){ return lvlOf(k).n; }

function pillBtn(fn,id,label){

function addPlayerFromGrid(){
  var el=document.getElementById('npg'); if(!el) return;
  var raw=(el.value||'').trim(); if(!raw) return;
  var ids=[];
  raw.split(',').forEach(function(n){
    n=n.trim(); if(!n) return;
    ids.push(libIdForName(n));                 // réutilise la fiche si le prénom existe déjà

  if(S.view==='chrono'){ var s=chSettings(); var pk=chPick().slice();
    ids.forEach(function(i){ if(pk.indexOf(i)<0) pk.push(i); }); s.pick=pk; }
  else { if(!D.microTeam) D.microTeam=D.lib.map(function(x){return x.id;});
    ids.forEach(function(i){ if(D.microTeam.indexOf(i)<0) D.microTeam.push(i); }); }

}
function microToggleP(id){
  if(!D.microTeam) D.microTeam=D.lib.map(function(p){return p.id;});

}

function briefSimple(){
  var ids=(D.microTeam||D.lib.map(function(p){return p.id;})).filter(function(id){
    return D.lib.some(function(p){return p.id===id;});
  });
  var joueurs=ids.map(function(id){
    var p=D.lib.filter(function(x){return x.id===id;})[0];
    return {nom:p.name, lvl:lvlOf(microLvl(id))};
  });
  if(!joueurs.length) joueurs=[{nom:'Joueur 1',lvl:lvlOf('h')}];
  var but=MICRO_BUT, premier=joueurs[0].nom, suivant=(joueurs[1]||joueurs[0]).nom;
  var used={}; joueurs.forEach(function(j){ used[j.lvl.k]=1; });

  var t='🎙️ QUIZ ORAL — colle ce texte dans ton assistant, puis passe en mode vocal.\n\n';
  t+='Tu animes un quiz oral en français. Tu parles un français clair et naturel, facile à comprendre à l\'oral, sans accent imité ni imitation de personne réelle. Tu as de l\'humour, tu taquines volontiers les joueurs et tu ne détestes pas te vanter de tes questions. Ton humour ne fausse jamais l\'arbitrage.\n\n';

  t+='MÉMO — relis ces cinq lignes AVANT CHAQUE PRISE DE PAROLE. Si tu n\'en appliques qu\'une partie, la partie se casse.\n';
  t+='M1. À qui le tour ? Je nomme ce joueur dans ma question.\n';
  t+='M2. Ai-je bien entendu ? Sinon je demande la réponse officielle, je n\'arbitre pas.\n';
  t+='M3. Je dis le score à voix haute : variation et nouveau total'+(microFin()==='questions'?', et le numéro de la question':'')+'.\n';
  t+='M4. Je termine par une question. Jamais par un blanc.\n';
  t+='M5. Ce fait n\'a jamais été posé, et il est au niveau de CE joueur.\n\n';
  t+='JOUEURS, dans cet ordre de passage :\n';
  joueurs.forEach(function(j){ t+='- '+j.nom+' — niveau '+j.lvl.label+'\n'; });
  if(microFin()==='questions'){
    t+='\nBUT : '+microNbq()+' questions pour CHAQUE joueur, puis on arrête. 1 point par bonne réponse, rien d\'autre. Le plus grand total gagne ; en cas d\'égalité, une question de plus chacun.\n';
    t+='Tu comptes les questions à voix haute en même temps que le score : « Question 4 sur '+microNbq()+' pour '+premier+'. » C\'est ce comptage prononcé qui t\'évite de perdre le fil. Ne propose jamais de jouer au temps : tu n\'as aucune horloge.\n\n';
  } else {
    t+='\nBUT : le premier à '+but+' points. 1 point par bonne réponse, rien d\'autre. Aucun barème double, aucun bonus, aucun point retiré.\n\n';
  }

  t+='AVANT DE COMMENCER\nTa toute première phrase est uniquement : « Le mode vocal est activé ? » Puis tu t\'arrêtes et tu attends. Tu ne poses aucune question tant que la réponse n\'est pas oui. Quand c\'est oui : tu te présentes en une phrase, dans ton personnage, puis tu poses immédiatement la première question à '+premier+'.\n\n';

  t+='LES 8 RÈGLES\n';
  t+='1. TOUR DE RÔLE STRICT. '+premier+', puis '+suivant+', puis le suivant, et on recommence dans l\'ordre ci-dessus. Tu nommes le joueur dans chaque question — c\'est ce prénom prononcé qui te dit où tu en es. Jamais « c\'est à qui ? », jamais deux questions de suite au même joueur, jamais un joueur sauté.\n';
  t+='2. UNE SEULE QUESTION OUVERTE. Tu poses, puis tu te tais. Tu ne réponds jamais à ta propre question et tu ne donnes pas la réponse avant le joueur.\n';
  t+='3. DOUTE = PAS D\'ARBITRAGE. Réponse coupée, hésitante, à moitié entendue, ou tu ne sais pas qui a parlé : tu dis « [Prénom], ta réponse officielle ? » et tu te tais. Perdre une seconde vaut mieux que fausser la partie.\n';
  t+='4. SCORE ANNONCÉ À VOIX HAUTE après chaque réponse : « Un point — '+premier+', 4 sur '+but+'. » ou « Non — '+premier+' reste à 3 sur '+but+'. » C\'est ta table de marque : tu la relis, tu ne recalcules jamais de mémoire.\n';
  t+='5. RYTHME. Après le score, tu enchaînes dans la même prise de parole sur la question suivante. Une prise de parole se termine toujours par une question, ou par « ta réponse officielle ? ». Jamais par un blanc, jamais par « on continue ? ».\n';
  t+='6. PÉDAGOGIE COURTE. Faux → la bonne réponse et UNE phrase qui l\'explique. Juste → UNE anecdote sympa sur le sujet. Jamais plus d\'une phrase, jamais de cours.\n';
  t+='7. CE QUE LES JOUEURS PEUVENT CHANGER, ET CE QU\'ILS NE PEUVENT PAS. Ils vont te parler pendant la partie : te taquiner, te dire que tu vas trop vite, réclamer plus dur, changer de sujet, contester un point.\n';
  t+='   INTOUCHABLE : le score déjà annoncé, l\'ordre de passage, la valeur d\'un point, l\'obligation de demander une réponse officielle en cas de doute. Un score ne change que si TU retrouves une erreur dans ce que tu as annoncé — jamais parce qu\'un joueur l\'affirme.\n';
  t+='   MODIFIABLE en cours de route, sur demande CLAIRE et adressée à toi : le niveau d\'un joueur, les sujets, le nombre de points ou de questions à atteindre, ton rythme, ton niveau d\'humour. Tu reformules le changement en une phrase pour confirmation — « D\'accord : Mattéo passe en Grosse tête » — puis tu l\'appliques à partir de la question suivante, et tu ne reviens pas dessus. Ce changement est de LEUR responsabilité, pas de la tienne : tu ne discutes pas de son bien-fondé et tu ne le commentes plus ensuite.\n';
  t+='   Une phrase entendue au vol, une plaisanterie ou un commentaire entre joueurs ne déclenchent JAMAIS de changement. Si on te demande d\'arrêter la partie, tu t\'arrêtes ; pour tout le reste, tu continues.\n';
  t+='8. BRUIT DE FOND. Les joueurs parlent entre eux, rient, réfléchissent à voix haute. Pendant que tu parles, tu ne t\'interromps pas pour un commentaire de fond. Après une question, tu écoutes vraiment. Un bavardage, une blague ou un mot lancé en l\'air n\'est pas une réponse : seule compte la réponse donnée par le joueur interrogé. Si un autre souffle la bonne réponse, personne ne marque, et tu reposes une autre question au même joueur.\n\n';

  t+='NIVEAUX — chaque joueur reçoit des questions à SON niveau, sans jamais le commenter à voix haute.\n';
  t+='Le niveau règle UNIQUEMENT la difficulté, jamais le sujet. Un joueur au niveau le plus bas reçoit des questions sur les mêmes domaines que les autres, simplement plus abordables. Tu ne changes jamais de domaine à cause du niveau de quelqu\'un, et tu n\'écartes jamais un sujet imposé sous prétexte qu\'il serait trop dur pour un joueur : tu poses une question plus facile DANS ce sujet.\n';
  MICRO_LVL.forEach(function(L){ if(used[L.k]) t+=L.label+' — '+L.txt+'.\n'; });
  t+='À l\'intérieur du niveau d\'un joueur, alterne les crans : une qui passe crème, une qui pique, une qui fait mal. Ne reste jamais deux fois de suite sur le même cran.\n\n';

  t+='ALTERNE AUSSI LE TYPE DE QUESTION — jamais deux fois de suite le même :\n';
  t+='· question directe · vrai ou faux · devinette en deux indices · estimation (un nombre : le point est accordé si le joueur tombe à 10 % près) · « qui suis-je ? » · question à trois propositions, uniquement si le joueur sèche vraiment.\n';
  t+='Quel que soit le type, ça vaut 1 point. La réponse attendue tient en quelques mots.\n\n';

  var th=microThemeObjs();
  if(th.length){
    t+='SUJETS IMPOSÉS — contrainte stricte, pas une préférence.\n';
    t+='Toutes les questions, sans exception, portent sur : '+th.map(function(x){return x.label.replace(/^[^A-Za-zÀ-ÿ]+/,'');}).join(' · ')+'.\n';
    th.forEach(function(x){ if(x.txt) t+='· '+x.txt+'\n'; });
    t+='Tu ne sors jamais de ce cadre, même pour varier, même si tu sens tourner en rond : tu creuses alors plus finement à l\'intérieur du sujet (une époque, un pays, un genre, un métier, une coulisse). Si '+(th.length>1?'plusieurs sujets sont imposés, tu alternes entre eux':'un seul sujet est imposé, tu en explores les recoins')+'. Une question hors sujet est une erreur, pas une respiration.\n\n';
  } else {
    t+='VARIÉTÉ DES SUJETS\nChange de domaine à chaque question : histoire, sciences, nature, cinéma, musique, sport, géographie, langue française, inventions, technologie, cuisine, logique, culture populaire.\n\n';
  }
  t+='Évite dans tous les cas les grands classiques trop vus : capitale de l\'Australie, formule de l\'eau, peintre de la Joconde, plus long fleuve.\n\n';

  t+='ANTI-RÉPÉTITION — c\'est un point sur lequel tu as tendance à déraper, sois-y attentif.\nTu tiens la liste des faits que tu as posés depuis le début de la partie. Un fait posé, révélé ou soufflé ne revient JAMAIS, même reformulé autrement : « quel élément a été repéré dans le spectre solaire » et « quel élément doit son nom au Soleil » sont le même fait. Avant chaque question, résume-toi le fait en trois mots et vérifie qu\'il n\'est pas déjà sorti.\n';
  if(D.journal && D.journal.length){
    var faits=D.journal.slice(0,60).map(function(x){return typeof x==='string'?x:(x.q||x.fait||'');}).filter(Boolean);
    if(faits.length) t+='Déjà posé lors des parties précédentes, interdit de reprendre : '+faits.join(' · ')+'\n';
  }
  t+='\n';

  if((D.microCustom||'').trim()) t+='CONSIGNE DES JOUEURS : '+D.microCustom.trim()+'\n\n';

  t+='RELECTURE\nToutes les 5 questions, tu relis ces règles avant de parler. Si tu t\'aperçois que tu as sauté un tour, répété un fait ou perdu le fil du score, tu annonces le score complet et tu reprends proprement, sans t\'excuser longuement.\n\n';
  t+='FIN DE PARTIE\n'+(microFin()==='questions'
    ? 'Après la '+microNbq()+'e question de chaque joueur, tu arrêtes et tu compares les totaux.'
    : 'Le premier à '+but+' gagne.')+
    ' Tu annonces le vainqueur dans ton personnage, puis tu listes les questions posées, une par ligne, pour que l\'application les mémorise et ne te les ressorte plus.\n';

/* Symétrie avec Tic-Tac : le Mur enregistre tout seul, la seule question

/* Une partie de Tic-Tac ou du Micro rejoint automatiquement La Coupe, dans
   une partie portant le nom du jeu : plus rien à sélectionner. */
function autoToCoupe(label, game, players){
  if(!players || !players.length) return null;
  var m=D.matches.filter(function(x){ return x.status!=='done' && x.name===label; })[0];
  if(!m){
    m={id:uid(),name:label,game:game,winRule:'high',status:'active',created:today(),players:[],rounds:[],target:null};
    D.matches.unshift(m);
  }
  var scores={};
  players.forEach(function(p){
    var ex=m.players.filter(function(q){return fp(q.name)===fp(p.name);})[0];
    if(!ex){ ex={id:uid(),name:p.name}; m.players.push(ex); }
    var v=(p.score!==null&&p.score!==undefined)?p.score:(p.pts!==undefined?p.pts:(p.good||0));
    scores[ex.id]=v;
  });
  m.rounds.unshift({id:uid(), date:today(), scores:scores});
  persist();
  return m;
}

function microAgg(){

    var win=g.players[0];

/* --------------------------- SAUVEGARDE --------------------------- */
/* ---- MUR DES CHAMPIONS : agrégation transverse des 3 jeux ---- */
/* Période : mêmes repères que les filtres de La Coupe, appliqués aux dates.
   « tout » par défaut : on ne cache jamais l'historique sans le dire. */
function champPeriod(){ return S.champPeriod||'tout'; }
function champInPeriod(d){
  var per=champPeriod(); if(per==='tout' || !d) return true;
  var n=new Date(), y=n.getFullYear(), m=n.getMonth()+1;
  var s=String(d);
  if(per==='annee') return s.slice(0,4)===String(y);
  return s.slice(0,7)===y+'-'+(m<10?'0':'')+m;
}
/* Masquage : un joueur de passage n'a pas à rester au mur pour toujours.
   On ne supprime rien — les parties gardent leur historique. */
function champHidden(){ if(!D.champHide) D.champHide=[]; return D.champHide; }
function champToggleHide(name){
  var k=fp(name), c=champHidden(), i=c.indexOf(k);
  if(i>=0) c.splice(i,1); else c.push(k);
  D.champHide=c; S.detail=null; persist(); render();
}
function championsAgg(){
  var agg={};
  function slot(name){ var k=fp(name); if(!k) return null;
    if(!agg[k]) agg[k]={name:name, coupes:0, coupeParties:0, coupeManches:0, quizWins:0, quizGames:0, duels:0, duelWins:0}; return agg[k]; }
  // La Coupe : titres (champion cumul, toutes parties) + manches gagnées
  D.matches.forEach(function(m){
    var r=rank(m,function(rd){ return champInPeriod(rd.date); }); if(!r.count) return;
    r.byCumul.forEach(function(p){ var s=slot(p.name); if(s) s.coupeManches+=p.wins; });
    var lead=leaders(r.byCumul,'points',m.winRule);
    m.players.forEach(function(p){ var s=slot(p.name); if(!s) return; s.coupeParties++; if(lead.indexOf(p.id)>=0) s.coupes++; });
  });
  // Le Micro
  D.micro.forEach(function(g){
    if(!champInPeriod(g.date)) return;
    g.players.forEach(function(p,i){ var s=slot(p.name); if(s){ s.quizGames++; if(i===0) s.quizWins++; } });
  });
  // Tic-Tac
  D.tictac.forEach(function(d){
    if(!champInPeriod(d.date)) return;
    d.players.forEach(function(p){ var s=slot(p.name); if(s){ s.duels++; if(d.winner&&fp(d.winner)===fp(p.name)) s.duelWins++; } });
  });
  /* Le total unique mélangeait des victoires incomparables : une partie de
     Uno entière valait autant qu'une manche de Tic-Tac de 30 secondes.
     On garde les couronnes pour l'ordre d'affichage, mais chaque discipline
     est désormais restituée séparément (voir renderChampions). */
  var hid=champHidden();
  var list=[]; for(var k in agg){ var a=agg[k];
    a.crowns=a.coupes+a.quizWins+a.duelWins;
    /* Parties réellement jouées, pour un taux honnête : au Micro et au Tic-Tac
       on connaît le nombre de participations ; à La Coupe, une partie gagnée ou
       non compte pour une. */
    a.parties=a.quizGames+a.duels+a.coupeParties;
    a.rate = a.parties ? Math.round(a.crowns/a.parties*100) : null;
    a.hidden = hid.indexOf(k)>=0;
    list.push(a); }
  var by=S.champSort==='taux'
    ? function(a,b){
        var ra=(a.parties>=CHAMP_MIN?a.rate:-1), rb=(b.parties>=CHAMP_MIN?b.rate:-1);
        return rb-ra || b.crowns-a.crowns; }
    : function(a,b){ return b.crowns-a.crowns || (b.coupeManches+b.quizGames+b.duels)-(a.coupeManches+a.quizGames+a.duels); };
  list.sort(by);
  return list;
}
/* En dessous de ce nombre de parties, un taux ne veut rien dire :
   une seule victoire ferait 100 %. On l'affiche, on ne classe pas dessus. */
var CHAMP_MIN=3;
/* Palmarès par discipline : comparer ce qui est comparable. */
function champByGame(){
  var out=[];
  var byGame={};
  D.matches.forEach(function(m){
    var r=rank(m,function(){return true;}); if(!r.count) return;
    var g=gameOf(m)||'Autre';
    if(!byGame[g]) byGame[g]={};
    var lead=leaders(r.byCumul,'points',m.winRule);
    m.players.forEach(function(p){
      if(!byGame[g][p.name]) byGame[g][p.name]={name:p.name,wins:0,played:0};
      byGame[g][p.name].played++;
      if(lead.indexOf(p.id)>=0) byGame[g][p.name].wins++;
    });
  });
  for(var g in byGame){
    var arr=[]; for(var n in byGame[g]) arr.push(byGame[g][n]);
    arr.sort(function(a,b){return b.wins-a.wins || b.played-a.played;});
    if(arr.length) out.push({game:g, players:arr});
  }
  var tt={};
  D.tictac.forEach(function(d){ (d.players||[]).forEach(function(p){
    if(!tt[p.name]) tt[p.name]={name:p.name,wins:0,played:0};
    tt[p.name].played++; if(d.winner&&fp(d.winner)===fp(p.name)) tt[p.name].wins++; }); });
  var ttArr=[]; for(var n2 in tt) ttArr.push(tt[n2]);
  if(ttArr.length){ ttArr.sort(function(a,b){return b.wins-a.wins||b.played-a.played;}); out.push({game:'⏱️ Tic-Tac', players:ttArr}); }
  var mq={};
  D.micro.forEach(function(g2){ (g2.players||[]).forEach(function(p,i){
    if(!mq[p.name]) mq[p.name]={name:p.name,wins:0,played:0};
    mq[p.name].played++; if(i===0) mq[p.name].wins++; }); });
  var mqArr=[]; for(var n3 in mq) mqArr.push(mq[n3]);
  if(mqArr.length){ mqArr.sort(function(a,b){return b.wins-a.wins||b.played-a.played;}); out.push({game:'🎙️ Le Micro', players:mqArr}); }
  out.sort(function(a,b){ return b.players.reduce(function(s,x){return s+x.played;},0)-a.players.reduce(function(s,x){return s+x.played;},0); });
  return out;
}

        }).join('')+'</div>';
    }).join('')+'</div>';
}
function renderChampions(hd,app,banner){
  hd.innerHTML=back()+'<h1>🏅 Mur des champions<span class="sub">Tous les jeux réunis</span></h1><span style="width:38px"></span>';

    app.innerHTML=h; return;
  }
  var champ=list.filter(function(p){return !p.hidden;})[0]; if(!champ) champ=list[0];
  var conf='<div class="confetti" style="position:absolute;inset:0;pointer-events:none;overflow:hidden">'+
    ['🎉','👑','⭐️','✨','🏆'].map(function(e,i){return '<span style="left:'+(8+i*20)+'%;animation-delay:'+(i*.35)+'s">'+e+'</span>';}).join('')+'</div>';
  h+='<div class="hero" style="text-align:center;position:relative;background:linear-gradient(135deg,#7c3aed,#a78bfa)">'+conf+
    '<p style="margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.9">Champion de la famille</p>'+
    '<div style="margin:6px 0 2px">'+av(champ.name,'big')+'</div>'+
    '<h2 style="font-size:28px;margin:2px 0">👑 '+esc(champ.name)+'</h2>'+
    '<p style="margin:0;font-size:13px;opacity:.92">'+pl(champ.crowns,'couronne')+' au total</p></div>';
  var vis=list.filter(function(p){return !p.hidden;});
  if(vis.length>=2 && vis[0].crowns>0){
    var gap=vis[0].crowns-vis[1].crowns;
    var rival = gap===0

var BUZZ_KITS=[
  {id:'drop',  label:'🔊 Drop',        desc:'Basse qui claque'},
  {id:'tv',    label:'📺 Erreur TV',   desc:'Le « EHHH » de plateau'},
  {id:'zap',   label:'⚡️ Zap',         desc:'Coup de laser net'},
  {id:'boing', label:'🤸 Boing',       desc:'Cartoon, ça fait rire'},
  {id:'arcade',label:'👾 Arcade',      desc:'8-bit rétro'},
  {id:'sad',   label:'🎺 Trombone',    desc:'Wah-wah-wah… la loose'},
  {id:'klaxon',label:'📯 Klaxon',      desc:'Deux notes bien grasses'},
  {id:'siren', label:'🚨 Sirène',      desc:'Alerte rouge'}
];
function playBuzz(kit){
  kit=kit||D.buzzKit||'drop';
  if(kit==='drop'){
    /* Le son "moderne" par excellence : sub-bass qui plonge + clap large réverbéré */
    sub(150,.55,.85);
    perc({dur:.22,f1:2200,f2:600,vol:.5,decay:1.6,rev:.5});
    hit(98,{dur:.5,vol:.45,bend:.45,wave:'triangle',cut:900,rev:.35});
    perc({delay:.055,dur:.18,f1:1500,vol:.32,rev:.5});
  } else if(kit==='tv'){
    sub(70,.75,.7);
    hit(92,{dur:.7,vol:.7,wave:'sawtooth',cut:1300,rev:.3});
    hit(123,{dur:.7,vol:.55,wave:'sawtooth',cut:1500,rev:.3});
    perc({dur:.14,f1:900,f2:300,vol:.4,filter:'lowpass',rev:.3});
  } else if(kit==='zap'){
    /* laser net et sec, sans nappe : très actuel */
    hit(2400,{dur:.16,vol:.4,bend:.08,wave:'square',cut:9000,rev:.3,atk:.001});
    perc({dur:.1,f1:5000,f2:900,vol:.3,decay:1.4,rev:.35});
    sub(130,.22,.5);
  } else if(kit==='boing'){
    hit(760,{dur:.45,vol:.6,bend:.12,wave:'sine',cut:4000,rev:.3});
    hit(430,{delay:.22,dur:.34,vol:.4,bend:.16,wave:'sine',cut:3000,rev:.3});
    perc({delay:.02,dur:.06,f1:1200,vol:.14,rev:.2});
  } else if(kit==='arcade'){
    [0,1,2,3,4].forEach(function(k){
      hit(880/Math.pow(1.5,k),{delay:k*.062,dur:.11,vol:.42,wave:'square',cut:6000,rev:.18});
    });
    perc({dur:.07,f1:2400,vol:.18,rev:.2}); sub(120,.25,.4);
  } else if(kit==='sad'){
    [311,277,233].forEach(function(f,k){
      hit(f,{delay:k*.28,dur:.42,vol:.5,bend:.86,wave:'sawtooth',cut:1700,q:1.4,rev:.4});
    });
    sub(100,.5,.35);
  } else if(kit==='klaxon'){
    hit(233,{dur:.26,vol:.6,wave:'square',cut:2600,rev:.25});
    hit(311,{dur:.26,vol:.45,wave:'square',cut:2600,rev:.25});
    hit(196,{delay:.25,dur:.4,vol:.6,wave:'square',cut:2400,rev:.3});
    hit(262,{delay:.25,dur:.4,vol:.45,wave:'square',cut:2400,rev:.3});
    sub(110,.5,.4);
  } else if(kit==='siren'){
    [0,.28,.56].forEach(function(d){
      hit(700,{delay:d,dur:.15,vol:.42,bend:1.6,wave:'sawtooth',cut:5000,rev:.3});
      hit(1120,{delay:d+.15,dur:.15,vol:.42,bend:.62,wave:'sawtooth',cut:5000,rev:.3});
    });
  }
}
function setBuzzKit(id){ D.buzzKit=id; persist(); playBuzz(id); render(); }
function buzz(btn){
  playBuzz(D.buzzKit||'drop');  // le kit choisi par l'utilisateur
  if(navigator.vibrate){ try{navigator.vibrate([220,50,160]);}catch(e){} }
  if(btn){ btn.style.transform='scale(.9)'; setTimeout(function(){ btn.style.transform=''; },150); }
  // flash rouge plein écran
  try{
    var f=document.createElement('div');
    f.style.cssText='position:fixed;inset:0;background:#dc2626;opacity:.55;z-index:70;pointer-events:none;transition:opacity .35s';
    document.body.appendChild(f);
    (window.requestAnimationFrame||function(cb){setTimeout(cb,16);})(function(){ f.style.opacity='0'; });
    setTimeout(function(){ try{f.remove();}catch(e){} },400);
  }catch(e){}
}

  var pool=whoChosen(); if(pool.length<1){toast('Choisis au moins un joueur');return;}
  if(WHO.spinning) return; WHO.spinning=true; WHO.picked=null;
  var n=0, ticks=14+Math.floor(Math.random()*8);
  function step(){
    WHO.picked=pool[Math.floor(Math.random()*pool.length)];
    perc({dur:.05,f1:1500,vol:.2,decay:3,rev:.15}); // roulement moderne (snaps filtrés)
    drawWhoSheet(); n++;
    if(n<ticks){ setTimeout(step, 60+n*14); }
    else { WHO.spinning=false; WHO.picked=pool[Math.floor(Math.random()*pool.length)]; drawWhoSheet();
      [0,2,5].forEach(function(idx,k){ hit(PENTA[idx],{delay:k*.07,dur:.55,vol:.34,fm:.7,fmRatio:3.01,cut:7000,rev:.45}); });
      sub(120,.35,.4); perc({delay:.14,dur:.14,f1:2200,f2:900,vol:.26,rev:.4});
      speak((WHO.picked?WHO.picked.name:'')+' commence'); try{if(navigator.vibrate)navigator.vibrate(30);}catch(e){} }
  }
  step();
}

function avPhoto(inp){
  var f=inp.files&&inp.files[0];
  if(!f){ toast('Aucune image sélectionnée'); return; }
  if(!/^image\//.test(f.type||'')){ toast('Ce fichier n\'est pas une image'); return; }
  toast('Traitement de la photo…');
  var rd=new FileReader();
  rd.onerror=function(){ toast('Lecture du fichier impossible — réessaie'); };
  rd.onload=function(){
    var img=new Image();
    img.onerror=function(){ toast('Image illisible — essaie une autre photo (JPEG/PNG)'); };
    img.onload=function(){
      try{
        var S2=96, c=document.createElement('canvas'); c.width=S2; c.height=S2;
        var x=c.getContext('2d');
        if(!x){ throw new Error('canvas'); }
        var m=Math.min(img.width,img.height);
        if(!m){ throw new Error('dimensions'); }
        x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S2,S2);
        var data;
        try{ data=c.toDataURL('image/jpeg',.72); }
        catch(e1){ try{ data=c.toDataURL('image/png'); }catch(e2){ data=null; } }
        var p=D.lib.filter(function(q){return q.id===S.avPick;})[0];
        if(!p){ toast('Joueur introuvable'); return; }
        if(data && data.length>50){
          p.photo=data; persist(); closeAv(); render(); toast('Photo enregistrée ✓');
        } else if(rd.result && rd.result.length<300000){
          p.photo=rd.result; persist(); closeAv(); render(); toast('Photo enregistrée ✓');
        } else {
          toast('Conversion impossible sur cet appareil — choisis un personnage à la place');
        }
      }catch(err){
        toast('Photo non convertie — essaie une image plus petite, ou choisis un personnage');
      }
    };
    img.src=rd.result;
  };
  try{ rd.readAsDataURL(f); }catch(e){ toast('Image inaccessible — réessaie, ou choisis un personnage'); }
}

/* ============================== PALMARÈS ==========================
   Agrège toutes les parties de La Coupe. Les points de jeux différents ne
   sont pas comparables : on classe donc par TITRES (meneur d'une partie)
   puis par victoires de manches. Joueurs agrégés par nom (insensible à la
   casse et aux accents). */
var PAL={year:String(new Date().getFullYear())};
function palKeep(y){
  if(y==='all') return function(){return true;};
  if(y==='d1'||y==='d7'||y==='d30'){
    var n=y==='d1'?1:y==='d7'?7:30;
    var lim=new Date(Date.now()-(n-1)*864e5).toISOString().slice(0,10);
    return function(r){return r.date>=lim;};
  }
  return function(r){return r.date.slice(0,4)===y;};
}
function palYears(){
  var ys={};
  D.matches.forEach(function(m){m.rounds.forEach(function(r){ys[r.date.slice(0,4)]=1;});});
  return Object.keys(ys).sort().reverse();
}
function palData(year){
  var agg={};
  function slot(name){
    var k=fp(name);
    if(!agg[k]) agg[k]={name:name,titles:0,wins:0,played:0,matches:0};
    return agg[k];
  }
  if(year===undefined) year=PAL.year;
  var keep=palKeep(year);
  D.matches.forEach(function(m){
    var r=rank(m,keep);
    if(!r.count) return;
    var seen={};
    m.players.forEach(function(p){
      var st=r.byCumul.filter(function(x){return x.id===p.id;})[0];
      if(!st||!st.played) return;
      var s=slot(p.name); if(!seen[fp(p.name)]){s.matches++;seen[fp(p.name)]=1;}
      s.wins+=st.wins; s.played+=st.played;
    });
    var lead=leaders(r.byCumul,'points',m.winRule);
    m.players.forEach(function(p){ if(lead.indexOf(p.id)>=0) slot(p.name).titles++; });
  });
  var list=[]; for(var k in agg) list.push(agg[k]);
  list.sort(function(a,b){return b.titles-a.titles||b.wins-a.wins||b.played-a.played;});
  return list;
}
function renderPalmares(hd,app,banner){
  hd.innerHTML=back()+'<h1>🏅 Palmarès<span class="sub">Toutes parties confondues</span></h1><span style="width:38px"></span>';
