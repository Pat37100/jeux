  function pchip(v,lb){return '<button class="chip'+(PAL.year===v?' on':'')+'" onclick="PAL.year=\''+v+'\';render()">'+lb+'</button>';}
  var isChamp=['d7','d30','all'].indexOf(PAL.year)>=0||ys.indexOf(PAL.year)>=0;

      '<button class="chip'+(isChamp?' on':'')+'" style="flex:1;text-align:center" onclick="PAL.year=\''+(ys[0]||'all')+'\';render()">🏆 Championnat</button>'+

  }else{

  if(!list.length){
    h+='<div class="empty"><div class="e">🏅</div><h3>Rien sur cette période</h3><p>Joue des manches et le palmarès se remplit.</p></div>';

    var champ=list[0];

      ['🎉','🏆','⭐️','✨'].map(function(e,i){return '<span style="left:'+(10+i*24)+'%;animation-delay:'+(i*.4)+'s">'+e+'</span>';}).join('')+'</div>';
    h+='<div class="hero" style="text-align:center;position:relative">'+conf+
       '<p style="margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85">Champion '+({all:'toutes saisons',d1:'de la soirée',d7:'des 7 jours',d30:'des 30 jours'}[PAL.year]||('saison '+PAL.year))+'</p>'+
       '<div style="margin:6px 0 2px">'+av(champ.name,'big')+'</div>'+
       '<h2 style="font-size:28px;margin:2px 0 2px">👑 '+esc(champ.name)+'</h2>'+

/* =============================== CHRONO ===========================
   Duel de temps : chaque joueur a son compte à rebours,
   en pause quand ce n'est pas son tour. Bon = il garde la main ; Faux = au
   suivant. À zéro = éliminé. L'animateur pilote. Rien n'est persisté : une
   manche de chrono est éphémère (mais les réglages, eux, sont mémorisés). */
var CH = null;              // état de la manche en cours (null = écran de config)
var chTick = null;          // intervalle
var __audio=null,__comp=null;
function audioCtx(){
  var C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
  if(!__audio){ __audio=new C();
    try{ __comp=__audio.createDynamicsCompressor();
      __comp.threshold.value=-20; __comp.knee.value=12; __comp.ratio.value=14;
      __comp.attack.value=.002; __comp.release.value=.18;
      __comp.connect(__audio.destination);
    }catch(e){ __comp=null; }
  }
  var a=__audio; if(a.state==='suspended'){ try{a.resume();}catch(e){} }
  return a;
}
function outNode(a){ return __comp||a.destination; }
/* ── Réverbération courte : c'est ce qui distingue un son "app 2026"
      d'un bip de vieux téléphone. Un son sec paraît daté. ── */
var __rev=null;
function revNode(a){
  if(__rev) return __rev;
  try{
    var len=Math.floor(a.sampleRate*1.1), buf=a.createBuffer(2,len,a.sampleRate);
    for(var c=0;c<2;c++){ var d=buf.getChannelData(c);
      for(var i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); } }
    var cv=a.createConvolver(); cv.buffer=buf;
    var wet=a.createGain(); wet.gain.value=.34;
    cv.connect(wet); wet.connect(outNode(a));
    __rev=cv;
  }catch(e){ __rev=null; }
  return __rev;
}
/* Voix percussive moderne : attaque immédiate, extinction rapide, filtrée, réverbérée.
   C'est la signature sonore des apps actuelles (pop, blip, marimba). */
function sndOn(){ return D.sound!==false; }
function hit(freq,opts){ if(!sndOn()) return;
  if(D.fx===0) return;
  opts=opts||{};
  try{
    var a=audioCtx(); if(!a) return;
    var t=a.currentTime+(opts.delay||0);
    var dur=opts.dur||.22, vol=opts.vol||.4;
    var o=a.createOscillator(); o.type=opts.wave||'sine';
    o.frequency.setValueAtTime(freq,t);
    if(opts.bend) o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*opts.bend),t+dur*.9);
    // synthèse FM : donne le timbre marimba/cloche (bien plus riche qu'une sinusoïde nue)
    if(opts.fm){
      var m=a.createOscillator(), mg=a.createGain();
      m.frequency.value=freq*(opts.fmRatio||2.4); mg.gain.value=freq*(opts.fm||.6);
      m.connect(mg); mg.connect(o.frequency); m.start(t); m.stop(t+dur);
    }
    var g=a.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+(opts.atk||.006));   // attaque nette
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);          // extinction percussive
    var f=a.createBiquadFilter();
    f.type=opts.filter||'lowpass'; f.frequency.value=opts.cut||5200; f.Q.value=opts.q||.9;
    o.connect(f); f.connect(g); g.connect(outNode(a));
    if(opts.rev!==false){ var r=revNode(a); if(r){ var rg=a.createGain(); rg.gain.value=(opts.rev||.3)*vol; g.connect(rg); rg.connect(r); } }
    o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
/* Percussion à base de bruit : clap, snap, whoosh — indispensable au son moderne */
function perc(opts){ if(!sndOn()) return;
  if(D.fx===0) return;
  opts=opts||{};
  try{
    var a=audioCtx(); if(!a) return;
    var t=a.currentTime+(opts.delay||0), dur=opts.dur||.12;
    var len=Math.max(1,Math.floor(a.sampleRate*dur));
    var buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,opts.decay||2); }
    var s=a.createBufferSource(); s.buffer=buf;
    var f=a.createBiquadFilter(); f.type=opts.filter||'bandpass';
    f.frequency.setValueAtTime(opts.f1||1400,t); f.Q.value=opts.q||1.1;
    if(opts.f2) f.frequency.exponentialRampToValueAtTime(opts.f2,t+dur); // balayage = whoosh
    var g=a.createGain(); g.gain.value=opts.vol||.3;
    s.connect(f); f.connect(g); g.connect(outNode(a));
    if(opts.rev!==false){ var r=revNode(a); if(r){ var rg=a.createGain(); rg.gain.value=(opts.rev||.25)*(opts.vol||.3); g.connect(rg); rg.connect(r); } }
    s.start(t); s.stop(t+dur+.02);
  }catch(e){}
}
/* Sub-bass : le "boum" qu'on sent plus qu'on entend — signature des sons modernes */
function sub(freq,dur,vol){ if(!sndOn()) return;
  if(D.fx===0) return;
  try{

  var s={}; qbankAll().forEach(function(x){ s[x.t]=(s[x.t]||0)+1; });

  return out;
}
/* Même logique de réglage qu'au Micro : des SUJETS multi-sélection et un
   NIVEAU pris sur la même échelle. La banque n'ayant que 5 crans, le palier
   choisi vise n, et on s'élargit progressivement plutôt que de ne rien sortir. */
var CH_LVL_N={p:1,a:2,h:3,b:4,g:5};
/* Les sujets du Tic-Tac sont ceux du référentiel THEMES, restreints à ceux qui
   ont réellement des questions en banque. Mêmes libellés qu'au Micro. */
function chThemeList(){
  var dispo={}; qbankAll().forEach(function(q){ dispo[q.t]=1; });
  return THEMES.filter(function(t){ return t.bank.some(function(b){return dispo[b];}); });
}
function chBankCats(){
  var ids=chThemes(), out={};
  if(!ids.length) return null;                       // null = tous les sujets
  ids.forEach(function(id){ var t=themeById(id); if(t) t.bank.forEach(function(b){ out[b]=1; }); });
  return out;
}
/* Anti-doublon persistant : une question posée ne revient pas, même dans une
   manche suivante ou après fermeture de l'app. Réinitialisé seulement quand la
   banque est épuisée pour la sélection en cours. */
function qSeen(){ if(!D.qSeen) D.qSeen=[]; return D.qSeen; }
function qMarkSeen(q){
  var s=qSeen(); if(s.indexOf(q)<0) s.push(q);
  if(s.length>400) s.splice(0, s.length-400);
  D.qSeen=s; persist();
}
function chThemes(){
  var s=chSettings();
  if(!s.qThemes) s.qThemes=[];                       // les anciens réglages par catégorie sont abandonnés proprement
  return s.qThemes.filter(function(id){ return !!themeById(id); });
}
function chToggleTheme(t){
  var c=chThemes(), i=c.indexOf(t);
  if(i>=0) c.splice(i,1); else c.push(t);

}
function chAllThemes(){ chSettings().qThemes=[]; chSettings().qTheme='*'; persist(); if(CH) qbankNext(); else render(); }
function chOwnQuestions(){ chSettings().qTheme=null; chSettings().qThemes=[]; persist(); render(); }
function chLvl(){ return chSettings().qLvl||'h'; }
function chSetLvl(k){ chSettings().qLvl=k; persist(); if(CH) qbankNext(); else render(); }
function qbankMatch(tol){
  var cats=chBankCats(), target=CH_LVL_N[chLvl()]||3;
  return qbankAll().filter(function(x){
    return (!cats || cats[x.t]) && Math.abs((x.n||3)-target)<=tol;
  });

function qbankCount(){ return qbankMatch(0).length; }
function qbankPick(){
  var seen=qSeen(), used=(CH&&CH.qUsed)||[];
  /* 1) jamais reposée, ni dans cette manche ni dans les précédentes */
  for(var tol=0; tol<=4; tol++){
    var pool=qbankMatch(tol).filter(function(x){ return seen.indexOf(x.q)<0 && used.indexOf(x.q)<0; });
    if(pool.length) return pool[Math.floor(Math.random()*pool.length)];
  }
  /* 2) tout le stock de cette sélection a été vu : on repart à zéro pour elle
        seulement, en évitant au moins de répéter dans la manche en cours */
  var stock=qbankMatch(4);
  D.qSeen=seen.filter(function(q){ return !stock.some(function(x){return x.q===q;}); }); persist();
  var pool2=stock.filter(function(x){ return used.indexOf(x.q)<0; });
  if(pool2.length) return pool2[Math.floor(Math.random()*pool2.length)];
  if(CH) CH.qUsed=[];
  return stock.length ? stock[Math.floor(Math.random()*stock.length)] : null;
}
function qbankNext(){
  if(!CH) return;
  var q=qbankPick();
  CH.q=q; CH.qShow=false;
  if(q){ CH.qUsed=(CH.qUsed||[]).concat([q.q]); qMarkSeen(q.q); }
  chPersist(); render();
}
function qbankReveal(){ if(CH){ CH.qShow=true; chPersist(); render(); } }

  var alive=chAlive();
  var best=alive.slice().sort(function(a,b){ return b.good-a.good || b.left-a.left; })[0];
  CH.winner = best ? best.name : ((CH.players[0]&&CH.players[0].name)||null);
  D.live=null; persist();
  /* Le Mur des champions recense tout ce qui se joue dans l'app :
     aucune décision à prendre, aucun bouton. */
  try{ chSaveDuel(true); }catch(e){}
  if(CH.winner){ fanfare(); speak(CH.winner+' remporte la manche'); }
  render();

    players: CH.players.map(function(p){return {name:p.name, good:p.good, bad:(p.bad||0)};}),

function chToCoupeGo(id){
  var sh=document.getElementById('tcsh'); if(sh) sh.remove();
  if(!CH) return;
  if(!CH.saved) chSaveDuel();
  var m=D.matches.filter(function(x){return x.id===id;})[0];
  if(!m){
    m={id:uid(),name:'Tic-Tac',game:'Quiz',date:today(),status:'live',winRule:'high',target:null,players:[],rounds:[]};
    D.matches.unshift(m);
  }
  var scores={};
  CH.players.forEach(function(p){
    var ex=m.players.filter(function(q){return q.name===p.name;})[0];
    if(!ex){ ex={id:uid(),name:p.name}; m.players.push(ex); }
    scores[ex.id]=p.good;

/* Sélection Tic-Tac alignée sur celle du Micro : des identifiants de
   bibliothèque, et un temps par joueur mémorisé PAR JOUEUR et non par position
   (avant, retirer un joueur décalait tous les temps personnalisés). */
var CH_SECS_CYCLE=[0,30,45,60,90,120];
function chPick(){
  var s=chSettings();
  if(!s.pick){
    /* Migration : on reprend les noms existants, SAUF le trio « Joueur 1/2/3 »
       par défaut jamais utilisé — sinon trois fiches fantômes entraient dans la
       bibliothèque et polluaient aussi le Micro. */
    var legacy=(s.players||[]);
    var untouched = legacy.join('|')==='Joueur 1|Joueur 2|Joueur 3' && !(D.tictac||[]).length;
    if(untouched) legacy=[];
    s.pick = legacy.length ? legacy.map(function(n){ return libIdForName(n); })
                           : D.lib.map(function(x){ return x.id; });   // comme au Micro : tout le monde est proposé
    if(s.custom){                                  // reprise des anciens temps, indexés par position
      var c={}; s.pick.forEach(function(id,i){ if(s.custom[i]) c[id]=s.custom[i]; }); s.custom=c;
    }
    persist();
  }
  return s.pick.filter(function(id){ return D.lib.some(function(p){return p.id===id;}); });
}
function chNames(){ return chPick().map(function(id){ return (D.lib.filter(function(p){return p.id===id;})[0]||{}).name; }); }
function chToggleP(id){
  var s=chSettings(), pk=chPick().slice(), i=pk.indexOf(id);
  if(i>=0){ if(pk.length<=2){ toast('Il faut au moins deux joueurs'); return; } pk.splice(i,1); }
  else { if(pk.length>=8){ toast('Huit joueurs au maximum'); return; } pk.push(id); }
  s.pick=pk; persist(); render();
}
function chSecsOf(id){ var c=chSettings().custom||{}; return c[id]||0; }
function cycleChSecs(id){
  var s=chSettings(); if(!s.custom) s.custom={};
  var cur=chSecsOf(id), k=CH_SECS_CYCLE.indexOf(cur);
  var nx=CH_SECS_CYCLE[(k<0?0:k+1)%CH_SECS_CYCLE.length];
  if(nx) s.custom[id]=nx; else delete s.custom[id];
  persist(); render();
}
function chSecsLabel(id){ var v=chSecsOf(id); return v? v+'s' : 'défaut'; }
function chSetSecs(v){ chSettings().secs=Math.min(1800,Math.max(5,v||60)); persist(); render(); }

/* chSetPlayerSecs / chRename / chAddP / chDelP retirés : la saisie libre de noms

/* ---- Démarrage d'une manche ---- */
/* Le duel vit dans D : un appel entrant, un verrouillage d'écran ou un

function chPersist(){ try{ D.live=CH?JSON.parse(JSON.stringify(CH)):null; persist(); }catch(e){} }
function chRestore(){

    if(D.live && D.live.players && D.live.players.length && D.live.winner===null){

function chStart(){

  var s=chSettings();
  CH={ players:chPick().map(function(id){
         var nm=(D.lib.filter(function(p){return p.id===id;})[0]||{}).name;
         var t=chSecsOf(id)||s.secs;
         return {name:nm, left:t, out:false, good:0, bad:0, start:t};
       }),
       active:0, running:false, sound:s.sound, total:s.secs, winner:null };

function chStopTick(){ if(chTick){clearInterval(chTick); chTick=null;} }
function chRun(){
  if(CH.running) return;

  chRunNow();

function chCountdown(done){
  var ov=document.createElement('div'); ov.id='cnt321';
  ov.style.cssText='position:fixed;inset:0;background:rgba(6,78,59,.92);z-index:60;display:flex;align-items:center;justify-content:center';
  ov.innerHTML='<div id="cnum" style="font-size:110px;font-weight:800;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.35)">3</div>';
  document.body.appendChild(ov);
  var steps=[['3',760],['2',760],['1',760],['GO !',1180]], i=0;
  function next(){
    if(!CH){ var o=document.getElementById('cnt321'); if(o) o.remove(); return; }   // partie quittée en plein décompte
    if(i>0){ var el=document.getElementById('cnum'); if(el){ el.textContent=steps[i][0]; el.style.fontSize=steps[i][0]==='GO !'?'72px':'110px'; } }
    if(CH&&CH.sound){
      if(i===3){ // GO !
        sub(110,.5,.6);
        [0,2,4,5].forEach(function(idx,k){ hit(PENTA[idx],{delay:k*.05,dur:.6,vol:.34,fm:.7,fmRatio:3.01,cut:7000,rev:.45}); });
        perc({dur:.2,f1:2400,f2:800,vol:.32,rev:.45});
      } else {   // 3 · 2 · 1
        hit(PENTA[2],{dur:.14,vol:.3,fm:.4,fmRatio:2.01,cut:4200,rev:.22});
        perc({dur:.05,f1:1800,vol:.14,rev:.15});
      }
    }
    i++;
    if(i<steps.length){ setTimeout(next,600); }
    else setTimeout(function(){ try{ov.remove();}catch(e){} if(done)done(); },550);
  }
  next();
}
function chRunNow(){
  if(!CH || CH.winner) return;              // manche abandonnée ou finie pendant le décompte
  if(CH.running) return;
  CH.running=true; chStopTick();
  var last=Date.now();
  var __psave=0;
  chTick=setInterval(function(){
    var now=Date.now(), dt=(now-last)/1000; last=now;
    if(now-__psave>2000){ __psave=now; chPersist(); }
    var p=CH.players[CH.active];
    var beforeSec=Math.ceil(p.left);
    p.left-=dt;
    var afterSec=Math.ceil(p.left);
    // tension sonore façon plateau TV : tic-tac sous 10 s, plus pressant sous 5 s
    if(CH.sound && afterSec<beforeSec && afterSec>0){
      if(afterSec<=5){ hit(1245,{dur:.07,vol:.3,cut:5000,rev:.12,atk:.002}); perc({dur:.03,f1:2600,vol:.1,rev:.1}); }
      else if(afterSec<=10){ hit(830,{dur:.06,vol:.2,cut:3600,rev:.1,atk:.002}); }
    }
    if(p.left<=0){ p.left=0; p.out=true; if(CH.sound) chBeep(); chStopTick(); CH.running=false;
      var rest=chAlive().length;
      if(rest>1){ toast('⏰ '+p.name+' éliminé — encore '+rest+' en course'); speak(p.name+' éliminé'); }
      chAdvance(true); }
    render();
  },100);
  render();
}
function chPause(){ CH.running=false; chStopTick(); chPersist(); render(); }
function chAlive(){ return CH.players.filter(function(p){return !p.out;}); }
function chNextIdx(from){
  var n=CH.players.length;
  for(var k=1;k<=n;k++){ var i=(from+k)%n; if(!CH.players[i].out) return i; }
  return -1;
}
function chAdvance(auto){
  var alive=chAlive();
  if(alive.length<=1){ CH.winner = alive.length? alive[0].name : null; CH.running=false; chStopTick(); if(CH.winner) speak(CH.winner+' remporte le duel'); render(); return; }
  var ni=chNextIdx(CH.active);
  if(ni>=0){ CH.active=ni; speak('À toi '+CH.players[ni].name); }
  CH.running=false; chStopTick();
  if(auto) render();
}
/* Boutons animateur */
function chGood(){
  if(chSettings().qTheme && CH && !CH.winner) setTimeout(function(){ if(CH&&!CH.winner) qbankNext(); },0);
  if(CH.winner) return;

}
/* Mode « la bonne réponse passe la main » : le succès fait tourner */
function chPassGood(){
  if(chSettings().qTheme && CH && !CH.winner) setTimeout(function(){ if(CH&&!CH.winner) qbankNext(); },0);
  if(CH.winner) return;

/* …et l'échec le laisse en difficulté sur son propre temps */
function chKeepWrong(){

/* Classement du jour : agrège les manches Tic-Tac enregistrées aujourd'hui.
   C'est l'information que les anneaux ne donnent pas — ce qui s'est joué avant. */
function chDayBoard(){
  var d=today(), agg={}, n=0;
  (D.tictac||[]).forEach(function(m){
    if(m.date!==d) return; n++;
    (m.players||[]).forEach(function(p){
      var k=fp(p.name);
      if(!agg[k]) agg[k]={name:p.name, v:0, good:0, manches:0};
      agg[k].manches++; agg[k].good+=(p.good||0);
      if(m.winner && fp(m.winner)===fp(p.name)) agg[k].v++;
    });
  });
  if(!n) return '<div class="card" style="background:var(--bg)"><h2 style="font-size:14px;margin:0 0 4px">📅 Classement du jour</h2>'+
    '<p class="mini" style="margin:0">Première manche de la journée — le classement apparaîtra dès qu\'elle sera terminée.</p></div>';
  var list=[]; for(var k in agg) list.push(agg[k]);
  list.sort(function(a,b){ return b.v-a.v || b.good-a.good; });
  var med=['🥇','🥈','🥉'];
  return '<div class="card" style="background:var(--bg)"><h2 style="font-size:14px;margin:0 0 8px">📅 Classement du jour <span style="font-weight:400;font-size:12px;color:#a8a29e">('+pl(n,'manche')+')</span></h2>'+
    list.map(function(p,i){

        '<span style="width:20px">'+(med[i]||'')+'</span>'+
        '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.name)+'</span>'+
        '<b>'+pl(p.v,'victoire')+'</b>'+
        '<span class="mini" style="margin:0;width:64px;text-align:right">✓ '+p.good+'</span></div>';
    }).join('')+'</div>';
}
function chSkip(){
  if(chSettings().qTheme && CH && !CH.winner) setTimeout(function(){ if(CH&&!CH.winner) qbankNext(); },0);
  if(!CH||CH.winner) return;
  chStopTick(); CH.running=false;

}
function chWrong(){
  if(chSettings().qTheme && CH && !CH.winner) setTimeout(function(){ if(CH&&!CH.winner) qbankNext(); },0);
  chStopTick(); CH.running=false;
  sub(140,.2,.45);
  hit(196,{dur:.26,vol:.3,bend:.62,wave:'triangle',cut:1200,rev:.25});
  perc({dur:.1,f1:600,f2:220,vol:.2,filter:'lowpass',rev:.2});
  var pw=CH.players[CH.active]; if(pw) pw.bad=(pw.bad||0)+1;
  chAdvance(false);
  if(!CH.winner){ setTimeout(function(){ swoosh(); },140); chRun(); } else render();
}
/* whoosh : la main passe d'un joueur à l'autre — on l'entend, on le voit */
function swoosh(){
  /* Vrai whoosh : bruit filtré balayé vers le haut + petit blip de repère */
  perc({dur:.26,f1:400,f2:3600,vol:.26,filter:'bandpass',q:1.4,decay:1.2,rev:.3});
  hit(PENTA[3],{delay:.1,dur:.16,vol:.2,fm:.4,cut:5000,rev:.25});
}
function chJump(i){
  if(!CH||CH.winner!==null) return;
  if(!CH.players[i]||CH.players[i].out||i===CH.active) return;
  var wasRunning=CH.running;
  chStopTick(); CH.running=false; CH.active=i;

}
function chReset(){ chStopTick(); CH=null; render(); }

/* ---- Écran de jeu ---- */
/* 1er, 2e, 3e… — utilisé par le classement en direct du Tic-Tac. */
function rg(n){ return n===1?'1er':(n+'e'); }
function fmtT(sec){ sec=Math.max(0,Math.ceil(sec)); var m=Math.floor(sec/60), s=sec%60; return m+':'+(s<10?'0':'')+s; }
function chGame(){
  var p=CH.players[CH.active];
  var qBlock='';
  if(chSettings().qTheme && CH.winner===null){
    if(!CH.q){ var q0=qbankPick(); if(q0){ CH.q=q0; CH.qUsed=(CH.qUsed||[]).concat([q0.q]); qMarkSeen(q0.q); } }
    if(CH.q){
      qBlock='<div class="card" style="border-color:var(--am);background:var(--am-l)">'+
        '<p class="mini" style="margin:0 0 6px;color:#92400e">'+esc(CH.q.t)+' · niveau '+CH.q.n+'</p>'+
        '<p style="margin:0;font-size:16px;font-weight:700;line-height:1.35">'+esc(CH.q.q)+'</p>'+
        (CH.qShow
          ? '<p style="margin:9px 0 0;font-size:15px;font-weight:800;color:#059669">→ '+esc(CH.q.a)+'</p>'
          : '<button class="sm" style="width:100%;margin-top:9px;background:var(--card)" onclick="qbankReveal()">👁 Voir la réponse</button>')+
        '<button class="sm" style="width:100%;margin-top:6px;background:var(--card)" onclick="qbankNext()">🔄 Autre question</button>'+
      '</div>';
    }
  }
  var col = p.left<=5 ? '#e11d48' : p.left<=20 ? '#f59e0b' : '#059669';
  if(CH.winner!==null || chAlive().length<=1){
    var w = CH.winner!==null ? CH.winner : (chAlive()[0]&&chAlive()[0].name);
    var conf='<div class="confetti" style="position:absolute;inset:0;pointer-events:none;overflow:hidden">'+
      ['🎉','🏆','⭐️','🎊','✨','🥇'].map(function(e,i){return '<span style="left:'+(8+i*15)+'%;animation-delay:'+(i*.35)+'s">'+e+'</span>';}).join('')+'</div>';
    return '<div class="card" style="text-align:center;padding:28px 16px;position:relative;overflow:hidden">'+conf+
      '<div style="font-size:52px" class="winbig">🏆</div><div style="margin:4px 0">'+(w?av(w,'big'):'')+'</div><h2 style="font-size:22px;margin:4px 0 2px">'+esc(w||'—')+'</h2>'+
      (function(){
        /* Tableau de fin : podium, taux de réussite et comparaison — pas
           seulement le nombre de bonnes réponses. */
        var srt=CH.players.slice().sort(function(a,b){ return b.good-a.good || (a.bad||0)-(b.bad||0); });
        var champ=srt[0], tot=CH.players.reduce(function(s,x){return s+x.good+(x.bad||0);},0);
        var best=Math.max(1,srt[0].good);
        var med=['🥇','🥈','🥉'];
        return '<p class="mini" style="margin:0">'+
            (champ&&champ.good? '✓ '+champ.good+' bonne'+(champ.good>1?'s':'')+' réponse'+(champ.good>1?'s':'') : 'dernier joueur en course')+
            (tot? ' · '+pl(tot,'question')+' en tout' : '')+'</p>'+
          '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">'+
          podiumBoard(srt.map(function(p){
            var t=p.good+(p.bad||0);
            return {name:p.name, ratio:p.good/best,
              main:'<b style="color:#059669">✓ '+p.good+'</b> <b style="color:#9f1239;font-weight:600">✗ '+(p.bad||0)+'</b>'+(t?' <span style="color:#a8a29e;font-size:11.5px">'+Math.round(p.good/t*100)+'%</span>':'')};
          }))+
          '</div></div>'; })()+
      '<p class="mini" style="text-align:center;color:#059669;margin-top:12px">✓ Enregistrée au 🏅 Mur des champions</p>'+
      '<button class="btn tictac" style="margin-top:8px" onclick="chToCoupe()">🏆 Compter dans La Coupe</button>'+
      '<button class="btn" style="margin-top:8px" onclick="chStart()">Rejouer</button>'+
      '<button class="btn grey" style="margin-top:8px" onclick="chReset()">Modifier les réglages</button>';
  }

  var alive=chAlive().length;
  var resumed = !CH.running && CH.players.some(function(p){return p.good>0 || p.left<(p.start||CH.total);});
  var nCol = CH.players.length<=4 ? 'n'+CH.players.length : 'nx';
  var maxGood = Math.max.apply(null, CH.players.map(function(x){return x.good;}));
  /* Classement en direct : à bonnes réponses égales, celui qui s'est le moins
     trompé passe devant, puis celui qui a le plus de temps. Le rang est calculé
     une fois et lu dans chaque colonne. */
  var ordre=CH.players.slice().sort(function(a,b){
    return b.good-a.good || (a.bad||0)-(b.bad||0) || b.left-a.left; });
  var rangDe={};
  ordre.forEach(function(x,k){
    var prev=ordre[k-1];
    rangDe[x.name] = (prev && prev.good===x.good && (prev.bad||0)===(x.bad||0)) ? rangDe[prev.name] : k+1;
  });

  var h=qBlock+'<div class="card" style="padding:9px 12px;margin-bottom:10px;background:var(--am-l);border-color:var(--am);text-align:center">'+
    '<p style="margin:0;font-size:13px;color:#92400e"><b>\uD83D\uDC65 '+alive+' en course</b> \u00B7 \u00E0 z\u00E9ro seconde on est \u00E9limin\u00E9 \u00B7 <b>le dernier debout gagne</b> \uD83C\uDFC6</p></div>';

  // Qui a la main : gros titre lisible de loin
  h+='<div class="turnbar"><div class="st">'+(CH.running?'\u23F1 \u00E0 lui de jouer':'\u23F8 en pause')+'</div>'+
     '<div class="nm" style="color:'+col+'">'+esc(p.name)+'</div></div>';

  // ARÈNE : une colonne par joueur/équipe, remplie par son temps restant
  h+='<div class="duel '+nCol+'">';
  CH.players.forEach(function(pl,i){
    var base = pl.start || CH.total;
    var pc = base>0 ? Math.max(0,Math.min(1,pl.left/base)) : 0;
    var live = (i===CH.active && !pl.out);
    var cc = pl.out ? '#d6d3d1' : (pl.left<=5 ? '#e11d48' : pl.left<=20 ? '#f59e0b' : '#059669');
    var cls = 'lane'+(live?' live':'')+(pl.out?' ko':'')+(!pl.out&&pl.left<=5?' danger':(!pl.out&&pl.left<=20?' warn':''));
    var bg = pl.out ? '#e7e5e4' : (pl.left<=5 ? 'linear-gradient(180deg,#fecdd3,#fda4af)' : pl.left<=20 ? 'linear-gradient(180deg,#fde68a,#fcd34d)' : 'linear-gradient(180deg,#a7f3d0,#6ee7b7)');
    var lead = (!pl.out && pl.good>0 && pl.good===maxGood);
    var R=42, CIRC=2*Math.PI*R, off=CIRC*(1-pc);
    var ph=avPhotoOf(pl.name);
    var ring='<div class="ring"><svg viewBox="0 0 100 100">'+
      '<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="#eeedec" stroke-width="9"/>'+
      '<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="'+(pl.out?'#d6d3d1':cc)+'" stroke-width="9" stroke-linecap="round" '+
        'stroke-dasharray="'+CIRC.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" style="transition:stroke-dashoffset .3s linear"/></svg>'+
      '<span class="face">'+(pl.out?'\u274C':(ph?'<img src="'+ph+'" alt="">':avFor(pl.name)))+'</span></div>';
    h+='<div class="'+cls+'" onclick="chJump('+i+')">'+
       (lead?'<span class="crown">\uD83D\uDC51</span>':'')+
       ring+
       '<div class="who">'+esc(pl.name)+'</div>'+
       '<div class="tt" style="color:'+(pl.out?'#78716c':cc)+'">'+(pl.out?'0:00':fmtT(pl.left))+'</div>'+
       /* Tout ce qu'il faut savoir sur un joueur tient désormais ici :
          rang en direct, bonnes, mauvaises et taux. Plus de tableau redondant
          en bas de l'écran. */
       '<div class="gd" style="line-height:1.35">'+
         '<span style="color:#059669">\u2713 '+pl.good+'</span> '+
         '<span style="color:#9f1239">\u2717 '+(pl.bad||0)+'</span>'+
         (function(){ var tot=pl.good+(pl.bad||0);
           return tot? '<br><span style="font-size:10.5px;color:#78716c;font-weight:700">'+Math.round(pl.good/tot*100)+' % · '+rg(rangDe[pl.name])+'</span>'
                     : '<br><span style="font-size:10.5px;color:#a8a29e;font-weight:600">à jouer</span>'; })()+
       '</div>'+
       '</div>';
  });
  h+='</div>';
  var passLbl=(chSettings().pass||'wrong')==='good'?'la main passe apr\u00E8s une bonne r\u00E9ponse'
             :((chSettings().pass||'wrong')==='both'?'tu d\u00E9cides quand la main passe':'il garde la main tant qu\'il r\u00E9pond juste');
  h+='<p class="mini" style="text-align:center;margin:-4px 0 10px">Sous chaque joueur : \u2713 bonnes \u00B7 \u2717 mauvaises \u00B7 taux et rang en direct \u00B7 '+passLbl+'.</p>';

  // contrôle principal : Démarrer / Pause
  h+= CH.running
    ? '<button class="btn" style="background:#78716c" onclick="chPause()">⏸ Pause</button>'
    : '<button class="btn tictac" onclick="chRun()">▶︎ Lancer le temps de '+esc(p.name)+'</button>';

  // boutons animateur : 2 actions seulement (benchmark pendule d'échecs / party games)
  var pass=(chSettings().pass||'wrong');
  /* Deux boutons de score + une sortie neutre : un joueur qui passe son tour
     ne doit pas être compté comme s'étant trompé. */
  /* La précision « au suivant / garde la main » n'est affichée que
     lorsqu'elle distingue réellement les deux boutons. En mode « les deux
     font tourner », elle serait identique des deux côtés : on l'omet. */
  var sub=function(txt){ return pass==='both' ? '' : ' <span style="font-weight:500;opacity:.85">— '+txt+'</span>'; };
  if(pass==='good'){
    h+='<button class="btn" style="margin-top:10px" onclick="chPassGood()">✓ Bonne réponse'+sub('au suivant')+'</button>'+
       '<button class="btn red" style="margin-top:8px" onclick="chKeepWrong()">✗ Mauvaise réponse'+sub('il continue')+'</button>';
  } else {
    h+='<button class="btn" style="margin-top:10px" onclick="chGood()">✓ Bonne réponse'+sub('il garde la main')+'</button>'+
       '<button class="btn red" style="margin-top:8px" onclick="chWrong()">✗ Mauvaise réponse'+sub('au suivant')+'</button>';
  }
  /* « Passer sans compter » retiré : toucher un joueur donne déjà la main
     sans marquer, et la règle de passation le fait automatiquement. */


  /* Le tableau « Taux de réussite » a été retiré : bonnes, mauvaises, taux et
     rang figurent maintenant dans la colonne de chaque joueur. Ne reste ici que
     ce que l'arène ne montre pas : ce qui s'est joué plus tôt dans la journée. */
  h+=chDayBoard();

  /* Zone de sortie : regroupée, en bas, séparée des actions de jeu.
     Avant, « Terminer », « Abandonner » et « Nouvelle manche » étaient éparpillés
     entre les boutons d'animation — on ne savait plus lequel faisait quoi. */
  h+='<div class="card" style="margin-top:14px;background:var(--bg)">'+
     '<label class="lb">Arrêter cette manche</label>'+
     '<button class="sm g" style="width:100%;margin-bottom:7px" onclick="chFinishNow()">🏁 Terminer et désigner le vainqueur</button>'+
     
     '<button class="sm" style="width:100%;color:#9f1239" onclick="chAbandon()">✕ Abandonner sans compter</button></div>';
  return h;
}

render();
/* Retour au premier plan : c'est le moment où l'on voit encore l'ancienne page. */
document.addEventListener('visibilitychange',function(){ if(!document.hidden) checkVersion(); });

/* Fonctionnement hors réseau (utile en voiture) + détection de mise à jour */
/* ---- Détection de version indépendante du service worker -------------
   Le SW est déjà en « réseau d'abord », mais sur une PWA iOS la page déjà
   ouverte continue d'afficher l'ancien HTML : une version pouvait rester
   invisible plusieurs jours. On compare donc explicitement la version en
   ligne à celle qui tourne, au démarrage et à chaque retour au premier plan. */
var __vCheckAt=0;
function checkVersion(force){
  var now=Date.now();
  if(!force && now-__vCheckAt<60000) return;
  __vCheckAt=now;
  try{
    fetch('./index.html', {cache:'no-store'}).then(function(r){ return r.text(); })
    .then(function(txt){
      var m=txt.match(/APP_VERSION='(\d+)'/);
      if(m && m[1] !== APP_VERSION) showUpdateBar(m[1]);
    }).catch(function(){});                 // hors ligne : on ne dérange pas
  }catch(e){}
}
function showUpdateBar(v){
  if(document.getElementById('updbar')) return;
  var d=document.createElement('div'); d.id='updbar'; d.className='updbar';
  d.innerHTML='<span>🔄 Version '+(v||'')+' disponible</span><button id="updbtn">Mettre à jour</button>';
  document.body.appendChild(d);
  document.getElementById('updbtn').onclick=function(){
    /* Rechargement franc : on vide les caches et on repart de zéro, sinon un
       simple reload peut resservir la page déjà en mémoire. */
    var done=function(){ try{ location.replace(location.pathname+'?r='+Date.now()); }catch(e){ location.reload(); } };
    try{
      if(window.caches && caches.keys) caches.keys().then(function(ks){
        return Promise.all(ks.map(function(k){ return caches.delete(k); }));
      }).then(done, done);
      else done();
    }catch(e){ done(); }
  };
}
if('serviceWorker' in navigator){
  var __hadController = !!navigator.serviceWorker.controller;
  var __reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(__reloaded) return;
    // Un nouveau service worker a pris le contrôle. Si l'app tournait déjà
    // (mise à jour pendant l'usage), on propose de recharger — sans surprise.
    if(__hadController) showUpdateBar();
    __reloaded=true;
  });
  window.addEventListener('load',function(){
    checkVersion(true);
    navigator.serviceWorker.register('sw.js').then(function(reg){
      if(reg.waiting && navigator.serviceWorker.controller) showUpdateBar();
      reg.addEventListener('updatefound',function(){
        var nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange',function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller) showUpdateBar();
        });
      });
    }).catch(function(){});
  });
}
</script>
